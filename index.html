<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="AI Lab"><link rel="manifest" href="manifest.webmanifest"><title>AI Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;display:flex;flex-direction:column}.head{padding:calc(18px + env(safe-area-inset-top)) 18px 14px;border-bottom:1px solid #29324a;background:#111827;position:sticky;top:0;z-index:2}.title{font-size:22px;font-weight:750}.sub{font-size:13px;color:#9ca3af;margin-top:3px}.chat{flex:1;padding:16px;overflow:auto}.msg{max-width:88%;padding:12px 14px;margin:9px 0;border-radius:17px;white-space:pre-wrap;line-height:1.45}.ai{background:#171f33;border:1px solid #29324a}.user{margin-left:auto;background:#334155}.bottom{padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #29324a;background:#111827}.inputrow{display:flex;gap:8px;align-items:flex-end}textarea{flex:1;min-height:48px;max-height:140px;resize:none;background:#0f172a;color:#fff;border:1px solid #334155;border-radius:14px;padding:12px;font:inherit;font-size:16px;outline:none}button{min-height:46px;border:0;border-radius:13px;padding:10px 15px;background:#4f46e5;color:white;font-weight:700;font-size:15px}button.secondary{background:#263148}.actions{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}.status{font-size:12px;color:#9ca3af;margin-top:7px}.hidden{display:none}@media(max-width:380px){.actions button{flex:1;padding:9px 8px;font-size:14px}}</style></head><body><main class="app"><header class="head"><div class="title">AI Lab</div><div class="sub">Experimental self-improvement assistant</div></header><section id="chat" class="chat" aria-live="polite"><div class="msg ai">Hello boss 👋\n\nThis is your phone-ready AI Lab. Connect a backend to use a real AI model.</div></section><footer class="bottom"><div class="inputrow"><textarea id="input" rows="1" placeholder="Message your AI…" aria-label="Message"></textarea><button id="send" type="button">Send</button></div><div class="actions"><button id="improve" class="secondary" type="button">Improve last</button><button id="clear" class="secondary" type="button">New chat</button></div><div id="status" class="status">Demo mode · no API key is stored in the app</div></footer></main><script>const chat=document.getElementById('chat'),input=document.getElementById('input'),send=document.getElementById('send'),improve=document.getElementById('improve'),clear=document.getElementById('clear'),status=document.getElementById('status');let lastQ='',lastA='';function add(text,kind){const d=document.createElement('div');d.className='msg '+kind;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}function demo(q){const s=q.toLowerCase();if(/^(hi|hello|hey)\b/.test(s))return'Hello boss. What should we work on?';if(s.includes('self')&&s.includes('improv'))return'I can review an answer, identify weaknesses, propose an improved version, and compare it against tests. A real backend is required for genuine model reasoning.';return'I received:\n\n'+q+'\n\nIn the full version, the agent can plan the task, generate a solution, evaluate it against tests, and propose an improved candidate.'}function sendMsg(){const q=input.value.trim();if(!q)return;add(q,'user');input.value='';lastQ=q;lastA=demo(q);add(lastA,'ai')}send.onclick=sendMsg;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,140)+'px'});improve.onclick=()=>{if(!lastA){add('There is no previous answer to improve yet.','ai');return}add('Improvement review for:\n'+lastQ+'\n\n• Check correctness\n• Identify missing information\n• Test reasoning\n• Produce a stronger candidate\n\nThe downloadable PWA is ready for connection to a real AI backend.','ai')};clear.onclick=()=>{chat.innerHTML='';lastQ='';lastA='';add('New conversation started, boss.','ai')};if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
