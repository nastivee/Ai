<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Nastivee AI</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --header-h: 65px;
  --dock-h: 90px; /* updated live by JS to the real dock height */
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(160deg, #241044, #0b0615);
  background-attachment: fixed;
  color: white;
  min-height: 100vh;
}

button,
textarea {
  font: inherit;
}

.app {
  max-width: 1000px;
  min-height: 100vh;
  margin: auto;
  display: flex;
  flex-direction: column;
}

/* HEADER */

header {
  height: var(--header-h);
  padding: 0 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(10,5,20,.8);
  border-bottom: 1px solid rgba(255,255,255,.08);
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  font-size: 20px;
  font-weight: bold;
}

.headerButtons {
  display: flex;
  gap: 7px;
}

.headerButtons button {
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(255,255,255,.07);
  color: white;
  padding: 8px 11px;
  border-radius: 10px;
}

/* MEMORY */

.memoryPanel {
  display: none;
  margin: 10px 15px;
  padding: 13px;
  border-radius: 13px;
  background: rgba(255,255,255,.06);
}

.memoryPanel.open {
  display: block;
}

.memoryTitle {
  font-weight: bold;
  margin-bottom: 7px;
}

.memoryContent {
  white-space: pre-line;
  color: #ddd;
  font-size: 14px;
}

/* CHAT */

#chat {
  flex: 1;
  padding: 20px 14px;
  /* Always leave room for the whole dock, whatever is stacked in it */
  padding-bottom: calc(var(--dock-h) + 24px);
}

.message {
  display: flex;
  margin-bottom: 15px;
  /* When a message is scrolled to, it lands just under the header */
  scroll-margin-top: calc(var(--header-h) + 10px);
}

.message.user {
  justify-content: flex-end;
}

.bubble {
  max-width: 85%;
  padding: 11px 14px;
  border-radius: 16px;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.message.user .bubble {
  background: linear-gradient(135deg, #743cff, #5020a7);
  border-bottom-right-radius: 5px;
}

.message.assistant .bubble {
  background: rgba(255,255,255,.07);
  border-bottom-left-radius: 5px;
}

/* IMAGE */

.imageCard {
  width: min(100%, 650px);
  padding: 8px;
  border-radius: 17px;
  background: rgba(255,255,255,.06);
}

.imageCard img {
  width: 100%;
  display: block;
  border-radius: 12px;
}

.imageActions {
  margin-top: 9px;
}

.rerenderButton {
  border: 0;
  padding: 10px 15px;
  border-radius: 11px;
  background: linear-gradient(135deg, #7d43ff, #5521b7);
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.rerenderButton:disabled {
  opacity: .55;
}

/* =====================================================
   DOCK
   Everything pinned to the bottom lives in here and
   stacks vertically: preview, progress, composer.
   Nothing overlaps.
===================================================== */

.dock {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  justify-content: center;
  padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
  background: linear-gradient(transparent, rgba(8,5,16,.97) 22%);
  z-index: 7;
}

.dockInner {
  width: min(100%, 970px);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* PROGRESS */

.imageProgress {
  display: none;
  padding: 14px;
  border-radius: 14px;
  background: rgba(36,20,64,.97);
  border: 1px solid rgba(124,60,255,.3);
}

.imageProgress.open {
  display: block;
}

.progressTop {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 8px;
}

.progressSpinner {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  border: 3px solid rgba(255,255,255,.2);
  border-top-color: white;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

.imageProgress.done .progressSpinner {
  display: none;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.progressTitle {
  font-weight: bold;
}

.progressStage {
  font-size: 13px;
  color: #d8ccec;
  margin-bottom: 9px;
}

.progressBar {
  height: 7px;
  background: rgba(255,255,255,.1);
  border-radius: 10px;
  overflow: hidden;
}

.progressFill {
  height: 100%;
  width: 5%;
  background: linear-gradient(90deg,#8b5cff,#c18cff);
  transition: width .7s ease;
}

/* Before the panel closes itself, the bar drains so it never just vanishes */
.imageProgress.closing .progressFill {
  transition: width var(--drain-ms, 1000ms) linear;
  width: 0 !important;
}

.imageProgress.failed {
  border-color: rgba(249,115,22,.6);
}

.imageProgress.failed .progressFill {
  background: #f97316;
}

/* UPLOAD PREVIEW */

.uploadPreview {
  display: none;
  align-items: flex-start;
  gap: 2px;
  align-self: flex-start;
}

.uploadPreview.open {
  display: flex;
}

.uploadPreview img {
  width: 75px;
  height: 75px;
  object-fit: cover;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,.2);
}

/* Close mark: large, no background, no border */
.removePhoto {
  border: 0;
  background: none;
  color: white;
  font-size: 34px;
  line-height: 1;
  padding: 0 10px;
  cursor: pointer;
}

/* COMPOSER */

.composer {
  display: flex;
  align-items: flex-end;
  gap: 7px;
  padding: 8px;
  border-radius: 16px;
  background: rgba(26,15,47,.97);
  border: 1px solid rgba(255,255,255,.1);
}

.composer.imageMode {
  border-color: rgba(139,92,246,.65);
}

.composer textarea {
  flex: 1;
  min-height: 43px;
  max-height: 140px;
  resize: none;
  padding: 11px;
  border: 0;
  outline: 0;
  background: transparent;
  color: white;
}

.composer textarea::placeholder {
  color: #9b91a9;
}

.actionButton {
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  border: 0;
  border-radius: 11px;
  background: rgba(255,255,255,.08);
  color: white;
  cursor: pointer;
}

.sendButton {
  background: linear-gradient(135deg,#743cff,#5420b5);
}

.actionButton:disabled {
  opacity: .5;
}

/* MOBILE */

@media(max-width:600px) {
  .bubble {
    max-width: 92%;
  }

  #chat {
    padding-left: 9px;
    padding-right: 9px;
  }

  .headerButtons button {
    padding: 7px 9px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
 <header
  <div class="logo">
    <img src="IMG_0471.jpeg" alt="Nastivee AI">
    <span>Nastivee AI</span>
  </div>
</header>

  <div class="headerButtons">
    <button id="memoryButton">🧠 Memory</button>
    <button id="newChatButton">＋ New</button>
  </div>
</header>

<div id="memoryPanel" class="memoryPanel">
  <div class="memoryTitle">Long-term memory</div>
  <div id="memoryContent" class="memoryContent">
    No saved memories yet.
  </div>
</div>

<main id="chat"></main>

<!-- DOCK: everything at the bottom, stacked -->

<div id="dock" class="dock">
<div class="dockInner">

  <!-- UPLOAD PREVIEW -->

  <div id="uploadPreview" class="uploadPreview">
    <img id="uploadPreviewImage" src="" alt="Uploaded image">

    <button id="removePhoto" class="removePhoto" title="Remove photo" aria-label="Remove photo">
      ×
    </button>
  </div>

  <!-- IMAGE PROGRESS -->

  <div id="imageProgress" class="imageProgress">

    <div class="progressTop">
      <div class="progressSpinner"></div>

      <div id="progressTitle" class="progressTitle">
        Creating your image…
      </div>
    </div>

    <div id="progressStage" class="progressStage">
      Preparing…
    </div>

    <div class="progressBar">
      <div id="progressFill" class="progressFill"></div>
    </div>

  </div>

  <!-- COMPOSER -->

  <div id="composer" class="composer">

    <button
      id="uploadButton"
      class="actionButton"
      title="Upload image"
    >
      📷
    </button>

    <button
      id="imageButton"
      class="actionButton"
      title="Image mode"
    >
      🎨
    </button>

    <textarea
      id="messageInput"
      placeholder="Message Nastivee…"
      rows="1"
    ></textarea>

    <button
      id="sendButton"
      class="actionButton sendButton"
      title="Send"
    >
      ➤
    </button>

    <input
      id="fileInput"
      type="file"
      accept="image/*"
      hidden
    >

  </div>

</div>
</div>

</div>

<script>

/* =====================================================
   CONFIG
===================================================== */

const API_BASE =
  'https://ai-8vlt.onrender.com';

const CONVERSATION_KEY =
  'nastivee_conversation_v3';

const MEMORY_KEY =
  'nastivee_long_term_memory_v1';


/* =====================================================
   STATE
===================================================== */

let conversation = [];
let memory = {};
let imageMode = false;
let selectedPhoto = null;
let chatBusy = false;
let imageBusy = false;

let progressTimer = null;
let progressCloseTimer = null;

let messageCount = 0;


/*
  IMPORTANT:

  This stores the ORIGINAL uploaded photo and the
  original prompt.

  Re-render will always use this original photo,
  never the previous AI result.
*/

let lastImage = {
  sourceImage: null,
  prompt: '',
  wasEdit: false
};


/* =====================================================
   ELEMENTS
===================================================== */

const chat =
  document.getElementById('chat');

const dock =
  document.getElementById('dock');

const messageInput =
  document.getElementById('messageInput');

const sendButton =
  document.getElementById('sendButton');

const imageButton =
  document.getElementById('imageButton');

const uploadButton =
  document.getElementById('uploadButton');

const fileInput =
  document.getElementById('fileInput');

const composer =
  document.getElementById('composer');

const memoryButton =
  document.getElementById('memoryButton');

const memoryPanel =
  document.getElementById('memoryPanel');

const memoryContent =
  document.getElementById('memoryContent');

const newChatButton =
  document.getElementById('newChatButton');

const imageProgress =
  document.getElementById('imageProgress');

const progressTitle =
  document.getElementById('progressTitle');

const progressStage =
  document.getElementById('progressStage');

const progressFill =
  document.getElementById('progressFill');

const uploadPreview =
  document.getElementById('uploadPreview');

const uploadPreviewImage =
  document.getElementById('uploadPreviewImage');

const removePhoto =
  document.getElementById('removePhoto');


/* =====================================================
   DOCK HEIGHT
   Keeps the chat's bottom padding equal to the real
   height of the dock, so nothing hides behind it.
===================================================== */

function updateDockHeight() {
  document.documentElement.style.setProperty(
    '--dock-h',
    `${dock.offsetHeight}px`
  );
}

if ('ResizeObserver' in window) {
  new ResizeObserver(updateDockHeight).observe(dock);
}

window.addEventListener('resize', updateDockHeight);


/* =====================================================
   LOAD STORAGE
===================================================== */

try {
  conversation =
    JSON.parse(
      localStorage.getItem(CONVERSATION_KEY)
    ) || [];
} catch {
  conversation = [];
}

try {
  memory =
    JSON.parse(
      localStorage.getItem(MEMORY_KEY)
    ) || {};
} catch {
  memory = {};
}


/* =====================================================
   STORAGE
===================================================== */

function saveConversation() {
  try {
    localStorage.setItem(
      CONVERSATION_KEY,
      JSON.stringify(
        conversation.slice(-100)
      )
    );
  } catch {
    /*
      Images are large. If storage is full,
      save the text messages only.
    */
    try {
      localStorage.setItem(
        CONVERSATION_KEY,
        JSON.stringify(
          conversation
            .filter(m => m.type !== 'image')
            .slice(-100)
        )
      );
    } catch {}
  }
}

function saveMemory() {
  try {
    localStorage.setItem(
      MEMORY_KEY,
      JSON.stringify(memory)
    );
  } catch {}
}


/* =====================================================
   MEMORY
===================================================== */

function extractMemory(text) {

  if (!text) return;

  let match;

  match = text.match(
    /my\s+(?:dog|dogs|puppy)(?:'s)?\s+(?:name\s+is|is\s+called|is\s+named)\s+([A-Za-z][A-Za-z0-9_-]{1,30})/i
  );

  if (match) {
    memory.dogName = match[1];
  }

  match = text.match(
    /my\s+name\s+is\s+([A-Za-z][A-Za-z0-9_-]{1,30})/i
  );

  if (match) {
    memory.userName = match[1];
  }

  match = text.match(
    /(?:my\s+dog|my\s+puppy)\s+is\s+a\s+([A-Za-z][A-Za-z -]{2,30})/i
  );

  if (match) {
    memory.dogBreed =
      match[1].trim();
  }

  saveMemory();
  renderMemory();
}


function renderMemory() {

  const entries = [];

  if (memory.userName) {
    entries.push(
      `Your name: ${memory.userName}`
    );
  }

  if (memory.dogName) {
    entries.push(
      `Dog's name: ${memory.dogName}`
    );
  }

  if (memory.dogBreed) {
    entries.push(
      `Dog breed: ${memory.dogBreed}`
    );
  }

  if (memory.favourites) {
    entries.push(
      `Favourites: ${memory.favourites}`
    );
  }

  memoryContent.textContent =
    entries.length
      ? entries.join('\n')
      : 'No saved memories yet.';
}


/* =====================================================
   API
===================================================== */

async function apiFetch(path, options = {}) {

  const response =
    await fetch(
      `${API_BASE}${path}`,
      {
        ...options,

        headers: {
          'Content-Type': 'application/json',
          ...(options.headers || {})
        }
      }
    );

  const text =
    await response.text();

  let data;

  try {
    data =
      text
        ? JSON.parse(text)
        : {};
  } catch {
    throw new Error(
      text ||
      `Server returned HTTP ${response.status}`
    );
  }

  if (!response.ok) {
    throw new Error(
      data.details ||
      data.error ||
      `HTTP ${response.status}`
    );
  }

  return data;
}


/* =====================================================
   MESSAGE WRAPPER
   Every message gets its own anchor id.
===================================================== */

function createMessageWrapper(role) {

  const wrapper =
    document.createElement('div');

  messageCount++;

  wrapper.id =
    `msg-${messageCount}`;

  wrapper.className =
    `message ${role}`;

  return wrapper;
}


/* =====================================================
   CHAT MESSAGE
===================================================== */

function addMessage(role, content, options = {}) {

  const wrapper =
    createMessageWrapper(role);

  const bubble =
    document.createElement('div');

  bubble.className =
    'bubble';

  bubble.textContent =
    content;

  wrapper.appendChild(bubble);
  chat.appendChild(wrapper);

  if (!options.silent) {
    showMessage(wrapper);
  }

  return wrapper;
}


/* =====================================================
   IMAGE MESSAGE
===================================================== */

function addImageMessage(
  imageUrl,
  sourceImage,
  prompt,
  wasEdit,
  options = {}
) {

  const wrapper =
    createMessageWrapper('assistant');

  const card =
    document.createElement('div');

  card.className =
    'imageCard';

  const img =
    document.createElement('img');

  img.src =
    imageUrl;

  img.alt =
    'Nastivee AI image';

  const actions =
    document.createElement('div');

  actions.className =
    'imageActions';

  const button =
    document.createElement('button');

  button.className =
    'rerenderButton';

  button.textContent =
    '🔄 Re-render';

  button.addEventListener(
    'click',
    () => {

      rerenderImage(
        button,
        sourceImage,
        prompt,
        wasEdit
      );

    }
  );

  /*
    If the original upload is unavailable
    after a page reload, don't pretend the
    image can be re-rendered from the result.
  */

  if (wasEdit && !sourceImage) {
    button.disabled = true;
    button.title =
      'Upload the original image again to re-render';
  }

  actions.appendChild(button);

  card.appendChild(img);
  card.appendChild(actions);

  wrapper.appendChild(card);

  chat.appendChild(wrapper);

  if (!options.silent) {
    /*
      Scroll once now, and again when the image has
      loaded and the card has its full height.
    */
    showMessage(wrapper);
    img.addEventListener(
      'load',
      () => showMessage(wrapper),
      { once: true }
    );
  }

  return wrapper;
}


/* =====================================================
   SCROLL
   New content lands at the TOP of the screen,
   just under the header.
===================================================== */

function showMessage(element) {
  requestAnimationFrame(() => {
    element.scrollIntoView({
      block: 'start',
      behavior: 'smooth'
    });
  });
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    window.scrollTo(
      0,
      document.documentElement.scrollHeight
    );
  });
}


/* =====================================================
   PROGRESS
===================================================== */

function startImageProgress(isRerender) {

  clearInterval(progressTimer);
  clearTimeout(progressCloseTimer);

  imageProgress.classList.remove(
    'closing',
    'done',
    'failed'
  );

  imageProgress.classList.add('open');

  progressTitle.textContent =
    isRerender
      ? 'Re-rendering your image…'
      : 'Creating your image…';

  const stages =
    isRerender

      ? [
          ['Preparing your original photo…', 8],
          ['Using your original photo for likeness…', 25],
          ['Reworking your original request…', 45],
          ['Creating a fresh variation…', 68],
          ['Finishing the new image…', 88]
        ]

      : [
          ['Preparing your request…', 10],
          ['Understanding your image instructions…', 28],
          ['Creating your image…', 58],
          ['Finishing the image…', 85]
        ];

  let index = 0;

  progressStage.textContent =
    stages[0][0];

  progressFill.style.width =
    `${stages[0][1]}%`;

  progressTimer =
    setInterval(() => {

      index++;

      if (index >= stages.length) {
        clearInterval(progressTimer);
        return;
      }

      progressStage.textContent =
        stages[index][0];

      progressFill.style.width =
        `${stages[index][1]}%`;

    }, 1600);
}


/*
  Closes the panel after a delay. The bar drains
  across that delay so the user can see it going.
*/

function closeProgressAfter(ms) {

  clearTimeout(progressCloseTimer);

  imageProgress.style.setProperty(
    '--drain-ms',
    `${ms}ms`
  );

  // let the full bar paint first, then drain it
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      imageProgress.classList.add('closing');
    });
  });

  progressCloseTimer =
    setTimeout(() => {

      imageProgress.classList.remove(
        'open',
        'closing',
        'done',
        'failed'
      );

      progressFill.style.width =
        '5%';

    }, ms);
}


function finishImageProgress() {

  clearInterval(progressTimer);

  imageProgress.classList.add('done');

  progressStage.textContent =
    'Done ✓';

  progressFill.style.width =
    '100%';

  closeProgressAfter(1200);
}


function failImageProgress() {

  clearInterval(progressTimer);

  imageProgress.classList.add(
    'done',
    'failed'
  );

  progressStage.textContent =
    'Something went wrong.';

  progressFill.style.width =
    '100%';

  closeProgressAfter(2000);
}


/* =====================================================
   NORMAL CHAT
===================================================== */

/*
  Only text turns go to the chat API, as plain
  { role, content }. Generated images are stored in
  the conversation as huge data URLs and must not
  be sent back as chat text.
*/

function chatHistoryForApi() {
  return conversation
    .filter(m =>
      m.type !== 'image' &&
      typeof m.content === 'string'
    )
    .slice(-30)
    .map(m => ({
      role: m.role,
      content: m.content
    }));
}

async function sendMessage() {

  const text =
    messageInput.value.trim();

  if (!text) return;

  if (chatBusy || imageBusy) return;

  if (imageMode) {
    messageInput.value = '';
    resizeInput();
    await createImage(text);
    return;
  }

  chatBusy = true;
  sendButton.disabled = true;

  addMessage('user', text);

  conversation.push({
    role: 'user',
    content: text
  });

  extractMemory(text);

  messageInput.value = '';
  resizeInput();

  saveConversation();

  const thinking =
    createMessageWrapper('assistant');

  const thinkingBubble =
    document.createElement('div');

  thinkingBubble.className =
    'bubble';

  thinkingBubble.textContent =
    'Nastivee is thinking…';

  thinking.appendChild(thinkingBubble);
  chat.appendChild(thinking);

  try {

    const data =
      await apiFetch(
        '/api/chat',
        {
          method: 'POST',

          body: JSON.stringify({
            messages:
              chatHistoryForApi(),

            memory
          })
        }
      );

    thinking.remove();

    addMessage(
      'assistant',
      data.reply
    );

    conversation.push({
      role: 'assistant',
      content: data.reply
    });

    saveConversation();

  } catch (error) {

    thinking.remove();

    addMessage(
      'assistant',
      `Sorry, something went wrong: ${error.message}`
    );

  } finally {

    chatBusy = false;
    sendButton.disabled = false;

  }
}


/* =====================================================
   CREATE IMAGE
===================================================== */

async function createImage(prompt) {

  if (imageBusy) return;

  imageBusy = true;
  sendButton.disabled = true;

  const wasEdit =
    !!selectedPhoto;

  /*
    SAVE THE ORIGINAL UPLOAD BEFORE ANYTHING ELSE.
  */

  const sourceImage =
    selectedPhoto;

  const originalPrompt =
    prompt;

  addMessage(
    'user',
    prompt
  );

  startImageProgress(false);

  try {

    let data;

    if (wasEdit) {

      data =
        await apiFetch(
          '/api/image/edit',
          {
            method: 'POST',

            body: JSON.stringify({
              prompt: originalPrompt,
              image: sourceImage,
              regenerate: false
            })
          }
        );

    } else {

      data =
        await apiFetch(
          '/api/image',
          {
            method: 'POST',

            body: JSON.stringify({
              prompt: originalPrompt,
              regenerate: false
            })
          }
        );

    }

    finishImageProgress();

    /*
      VERY IMPORTANT:

      Store the ORIGINAL upload,
      not data.image.
    */

    lastImage = {
      sourceImage,
      prompt: originalPrompt,
      wasEdit
    };

    addImageMessage(
      data.image,
      sourceImage,
      originalPrompt,
      wasEdit
    );

    conversation.push({
      role: 'assistant',
      type: 'image',
      content: data.image
    });

    saveConversation();

  } catch (error) {

    failImageProgress();

    addMessage(
      'assistant',
      `Image generation failed: ${error.message}`
    );

  } finally {

    imageBusy = false;
    sendButton.disabled = false;

  }
}


/* =====================================================
   RE-RENDER
===================================================== */

async function rerenderImage(
  button,
  sourceImage,
  originalPrompt,
  wasEdit
) {

  if (imageBusy) return;

  /*
    Uploaded-image re-render MUST have
    the original photo.
  */

  if (wasEdit && !sourceImage) {

    addMessage(
      'assistant',
      'Please upload the original photo again before re-rendering.'
    );

    return;
  }

  imageBusy = true;

  button.disabled = true;

  button.textContent =
    '⏳ Re-rendering…';

  startImageProgress(true);

  try {

    let data;

    if (wasEdit) {

      /*
        ORIGINAL PHOTO GOES HERE.

        NOT the previous generated image.
      */

      data =
        await apiFetch(
          '/api/image/edit',
          {
            method: 'POST',

            body: JSON.stringify({
              prompt: originalPrompt,
              image: sourceImage,
              regenerate: true
            })
          }
        );

    } else {

      data =
        await apiFetch(
          '/api/image',
          {
            method: 'POST',

            body: JSON.stringify({
              prompt: originalPrompt,
              regenerate: true
            })
          }
        );

    }

    finishImageProgress();

    /*
      Keep the original upload alive.
    */

    lastImage = {
      sourceImage,
      prompt: originalPrompt,
      wasEdit
    };

    addImageMessage(
      data.image,
      sourceImage,
      originalPrompt,
      wasEdit
    );

  } catch (error) {

    failImageProgress();

    addMessage(
      'assistant',
      `Re-render failed: ${error.message}`
    );

  } finally {

    imageBusy = false;

    button.disabled = false;

    button.textContent =
      '🔄 Re-render';

  }
}


/* =====================================================
   IMAGE MODE
===================================================== */

function setImageMode(enabled) {

  imageMode =
    enabled;

  if (imageMode) {

    composer.classList.add('imageMode');

    imageButton.textContent =
      '🖼️';

    messageInput.placeholder =
      selectedPhoto
        ? 'Describe what you want changed…'
        : 'Describe the image you want…';

  } else {

    composer.classList.remove('imageMode');

    imageButton.textContent =
      '🎨';

    messageInput.placeholder =
      'Message Nastivee…';

  }
}

imageButton.addEventListener(
  'click',
  () => {
    setImageMode(!imageMode);
  }
);


/* =====================================================
   UPLOAD
===================================================== */

uploadButton.addEventListener(
  'click',
  () => {
    fileInput.click();
  }
);

fileInput.addEventListener(
  'change',
  () => {

    const file =
      fileInput.files?.[0];

    if (!file) return;

    const reader =
      new FileReader();

    reader.onload =
      () => {

        /*
          This is the ORIGINAL PHOTO.
        */

        selectedPhoto =
          reader.result;

        setImageMode(true);

        uploadPreviewImage.src =
          selectedPhoto;

        uploadPreview.classList.add(
          'open'
        );

        messageInput.placeholder =
          'Describe what you want changed…';
      };

    reader.readAsDataURL(file);

  }
);


/* =====================================================
   REMOVE PHOTO
===================================================== */

removePhoto.addEventListener(
  'click',
  () => {

    selectedPhoto =
      null;

    fileInput.value =
      '';

    uploadPreview.classList.remove(
      'open'
    );

    messageInput.placeholder =
      imageMode
        ? 'Describe the image you want…'
        : 'Message Nastivee…';

  }
);


/* =====================================================
   MEMORY BUTTON
===================================================== */

memoryButton.addEventListener(
  'click',
  () => {

    memoryPanel.classList.toggle(
      'open'
    );

    renderMemory();

  }
);


/* =====================================================
   NEW CHAT
===================================================== */

newChatButton.addEventListener(
  'click',
  () => {

    conversation = [];

    try {
      localStorage.removeItem(
        CONVERSATION_KEY
      );
    } catch {}

    chat.innerHTML = '';

    messageCount = 0;

    selectedPhoto =
      null;

    fileInput.value =
      '';

    uploadPreview.classList.remove(
      'open'
    );

    lastImage = {
      sourceImage: null,
      prompt: '',
      wasEdit: false
    };

    setImageMode(false);

    addMessage(
      'assistant',
      'New chat started. How can I help?'
    );

  }
);


/* =====================================================
   SEND
===================================================== */

sendButton.addEventListener(
  'click',
  sendMessage
);

messageInput.addEventListener(
  'keydown',
  event => {

    if (
      event.key === 'Enter' &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =====================================================
   TEXTAREA RESIZE
===================================================== */

function resizeInput() {

  messageInput.style.height =
    'auto';

  messageInput.style.height =
    `${Math.min(
      messageInput.scrollHeight,
      140
    )}px`;
}

messageInput.addEventListener(
  'input',
  resizeInput
);


/* =====================================================
   RESTORE CHAT
===================================================== */

function restoreConversation() {

  if (!conversation.length) {

    addMessage(
      'assistant',
      'Hi 👋 I’m Nastivee. What would you like to do?',
      { silent: true }
    );

    return;
  }

  conversation.forEach(
    message => {

      if (
        message.type === 'image'
      ) {

        addImageMessage(
          message.content,
          null,
          '',
          false,
          { silent: true }
        );

      } else {

        addMessage(
          message.role === 'user'
            ? 'user'
            : 'assistant',
          message.content,
          { silent: true }
        );

      }

    }
  );

  // On load, open at the latest message
  scrollToBottom();
  window.addEventListener('load', scrollToBottom, { once: true });
}


/* =====================================================
   START
===================================================== */

updateDockHeight();

renderMemory();

restoreConversation();

</script>
