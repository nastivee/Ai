<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171126">
<title>Nastivee AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: #0d0917;
  color: #fff;
  overflow: hidden;
}

button,
textarea,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

/* =====================================================
   AUTH
===================================================== */

.authScreen {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at 50% 20%, #38205f 0%, #171026 35%, #0d0917 75%);
  padding: 20px;
  z-index: 1000;
}

.authCard {
  width: 100%;
  max-width: 430px;
  padding: 35px;
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 25px;
  background: rgba(25,18,42,.9);
  box-shadow: 0 25px 80px rgba(0,0,0,.45);
  backdrop-filter: blur(20px);
}

.logoLarge {
  text-align: center;
  font-size: 38px;
  font-weight: 800;
  letter-spacing: -1.5px;
  margin-bottom: 8px;
}

.logoLarge span {
  color: #a875ff;
}

.authSubtitle {
  text-align: center;
  color: #aaa0bb;
  margin-bottom: 30px;
}

.authInput {
  width: 100%;
  border: 1px solid #3b3150;
  background: #130e20;
  color: white;
  padding: 15px 16px;
  border-radius: 13px;
  outline: none;
  margin-bottom: 12px;
}

.authInput:focus {
  border-color: #8b5cf6;
}

/* PASSWORD FIELD WITH VIEW/HIDE TOGGLE */

.authPasswordWrap {
  position: relative;
}

.authPasswordWrap .authInput {
  padding-right: 52px;
}

.passwordToggle {
  position: absolute;
  top: 0;
  right: 0;
  height: 51px;
  border: 0;
  background: none;
  color: #b1a5c2;
  font-size: 18px;
  padding: 0 14px;
  line-height: 1;
}

.passwordToggle:hover {
  color: #fff;
}

.resetScreen {
  display: none;
  position: fixed;
  inset: 0;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at 50% 20%, #38205f 0%, #171026 35%, #0d0917 75%);
  padding: 20px;
  z-index: 1001;
}

.resetScreen.show {
  display: flex;
}

.resetHint {
  color: #aaa0bb;
  font-size: 14px;
  text-align: center;
  margin-bottom: 18px;
}

.authForgot {
  text-align: right;
  margin: -4px 0 4px;
}

.authForgot button {
  border: 0;
  background: none;
  color: #b98aff;
  font-size: 13px;
  padding: 4px 2px;
}

.authButton {
  width: 100%;
  border: 0;
  padding: 15px;
  border-radius: 13px;
  background: linear-gradient(135deg, #8b5cf6, #a855f7);
  color: white;
  font-weight: 700;
  margin-top: 8px;
}

.authSwitch {
  text-align: center;
  color: #aaa0bb;
  margin-top: 20px;
  font-size: 14px;
}

.authSwitch button {
  background: none;
  border: 0;
  color: #b98aff;
  font-weight: 700;
}

.authError {
  color: #ff8585;
  text-align: center;
  font-size: 14px;
  min-height: 20px;
  margin-top: 12px;
}

/* =====================================================
   APP
===================================================== */

.app {
  display: none;
  width: 100%;
  height: 100%;
}

.app.visible {
  display: flex;
}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {
  width: 270px;
  height: 100%;
  flex-shrink: 0;
  background: #120d1e;
  border-right: 1px solid #2a2138;
  display: flex;
  flex-direction: column;
  z-index: 50;
}

.sidebarHeader {
  padding: 22px 18px 15px;
}

.logo {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -.8px;
}

.logo span {
  color: #a875ff;
}

.newChatButton {
  width: 100%;
  margin-top: 20px;
  padding: 13px;
  border-radius: 12px;
  border: 1px solid #493560;
  background: #211731;
  color: white;
  font-weight: 700;
}

.newChatButton:hover {
  background: #2b1d40;
}

.chatHistory {
  flex: 1;
  overflow-y: auto;
  padding: 8px 10px;
}

.historyLabel {
  color: #756a83;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 8px;
}

.chatHistoryItem {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  border: 0;
  border-radius: 10px;
  padding: 11px;
  color: #d6cedf;
  background: transparent;
  text-align: left;
  margin-bottom: 3px;
}

.chatHistoryItem:hover,
.chatHistoryItem.active {
  background: #241933;
  color: white;
}

.chatHistoryTitle {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 14px;
}

.deleteChatButton {
  opacity: 0;
  background: none;
  border: 0;
  color: #8e829a;
  padding: 3px;
}

.chatHistoryItem:hover .deleteChatButton {
  opacity: 1;
}

.sidebarBottom {
  padding: 15px;
  border-top: 1px solid #2a2138;
}

.userEmail {
  color: #92879d;
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-bottom: 10px;
}

.logoutButton {
  width: 100%;
  padding: 10px;
  border: 1px solid #382d47;
  background: transparent;
  color: #c8bfce;
  border-radius: 10px;
}

/* =====================================================
   MAIN
===================================================== */

.main {
  flex: 1;
  min-width: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(circle at 50% 0%, rgba(106,62,160,.13), transparent 35%),
    #0d0917;
}

.header {
  height: 64px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  padding: 0 22px;
  border-bottom: 1px solid #241c31;
  background: rgba(13,9,23,.8);
}

.mobileMenuButton {
  display: none;
  border: 0;
  background: none;
  color: white;
  font-size: 23px;
  margin-right: 12px;
}

.headerTitle {
  font-weight: 700;
  font-size: 16px;
}

.headerStatus {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 7px;
  color: #8e8498;
  font-size: 12px;
}

.statusDot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #6ee7a0;
}

/* =====================================================
   MEMORY
===================================================== */

.memoryPanel {
  padding: 12px 22px;
  border-bottom: 1px solid #241c31;
  background: rgba(17,12,27,.7);
}

.memoryToggle {
  border: 0;
  background: transparent;
  color: #aaa0b4;
  padding: 0;
  font-size: 12px;
}

.memoryContent {
  display: none;
  margin-top: 9px;
}

.memoryContent.open {
  display: block;
}

.memoryTextarea {
  width: 100%;
  min-height: 65px;
  resize: vertical;
  border: 1px solid #30243d;
  border-radius: 10px;
  background: #120d1d;
  color: white;
  padding: 10px;
  outline: none;
}

/* =====================================================
   CHAT
===================================================== */

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 25px max(20px, calc((100% - 900px) / 2));
  scroll-behavior: smooth;
}

.emptyState {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.emptyInner {
  max-width: 550px;
}

.emptyLogo {
  font-size: 42px;
  font-weight: 850;
  margin-bottom: 10px;
}

.emptyLogo span {
  color: #a875ff;
}

.emptyText {
  color: #91859e;
  line-height: 1.6;
}

.messageRow {
  display: flex;
  margin-bottom: 22px;
}

.messageRow.user {
  justify-content: flex-end;
}

.messageRow.assistant {
  justify-content: flex-start;
}

.messageBubble {
  max-width: min(760px, 88%);
  padding: 13px 16px;
  border-radius: 17px;
  line-height: 1.55;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.messageRow.user .messageBubble {
  background: linear-gradient(135deg, #6f42c1, #7c3aed);
  border-bottom-right-radius: 5px;
}

.messageRow.assistant .messageBubble {
  background: #191323;
  border: 1px solid #2b2137;
  border-bottom-left-radius: 5px;
}

.messageImageWrap {
  max-width: 760px;
  width: min(100%, 760px);
}

.generatedImage {
  display: block;
  width: 100%;
  max-width: 760px;
  border-radius: 17px;
  border: 1px solid #352743;
  background: #120d1c;
}

.imagePrompt {
  color: #a9a0b2;
  font-size: 12px;
  margin-top: 8px;
  white-space: pre-wrap;
}

.imageActions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}

.imageActionButton {
  border: 1px solid #40304f;
  background: #1a1226;
  color: #d8cde3;
  border-radius: 9px;
  padding: 8px 11px;
  font-size: 12px;
}

.imageActionButton:hover {
  background: #281936;
}

.imageActionButton.primary {
  border-color: #7951bd;
  background: #372052;
  color: white;
}

.imageActionButton:disabled {
  opacity: .45;
  cursor: not-allowed;
}

/* =====================================================
   IMAGE PROGRESS
===================================================== */

.imageProgress {
  display: none;
  margin: 0 auto 12px;
  width: min(900px, calc(100% - 40px));
  padding: 11px 14px;
  border: 1px solid #332641;
  background: #15101f;
  border-radius: 12px;
}

.imageProgress.show {
  display: block;
}

.progressText {
  font-size: 12px;
  color: #aaa0b2;
  margin-bottom: 7px;
}

.progressTrack {
  height: 5px;
  background: #292033;
  border-radius: 10px;
  overflow: hidden;
}

.progressBar {
  width: 20%;
  height: 100%;
  background: linear-gradient(90deg, #8b5cf6, #c084fc);
  border-radius: 10px;
  animation: progressMove 1.4s infinite ease-in-out;
}

@keyframes progressMove {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(500%); }
}

/* =====================================================
   COMPOSER
===================================================== */

.composerArea {
  flex-shrink: 0;
  padding: 12px 20px 18px;
  background: linear-gradient(to top, #0d0917 75%, transparent);
}

.composer {
  width: min(900px, 100%);
  margin: 0 auto;
  border: 1px solid #392b47;
  background: #15101f;
  border-radius: 18px;
  padding: 8px;
  box-shadow: 0 10px 40px rgba(0,0,0,.2);
}

.uploadPreview {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 7px 9px 10px;
}

.uploadPreview.show {
  display: flex;
}

.uploadThumb {
  width: 55px;
  height: 55px;
  object-fit: cover;
  border-radius: 9px;
  border: 1px solid #493758;
}

.uploadInfo {
  flex: 1;
  min-width: 0;
}

.uploadName {
  color: #d8d0df;
  font-size: 12px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.clearUpload {
  border: 0;
  background: #2a2033;
  color: #c9bfd2;
  border-radius: 8px;
  padding: 7px 9px;
}

.composerBottom {
  display: flex;
  align-items: flex-end;
  gap: 7px;
}

.messageInput {
  flex: 1;
  min-width: 0;
  max-height: 180px;
  min-height: 44px;
  resize: none;
  border: 0;
  outline: none;
  background: transparent;
  color: white;
  padding: 11px 10px;
  line-height: 1.45;
}

.messageInput::placeholder {
  color: #71687c;
}

.composerButton {
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  border: 0;
  border-radius: 12px;
  background: #241a31;
  color: #c7bbd2;
  display: flex;
  align-items: center;
  justify-content: center;
}

.composerButton:hover {
  background: #30213f;
}

.composerButton.imageModeActive {
  background: #6d42ae;
  color: white;
}

.sendButton {
  background: linear-gradient(135deg, #7c3aed, #9333ea);
  color: white;
}

.sendButton:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.fileInput {
  display: none;
}

.composerHint {
  width: min(900px, 100%);
  margin: 7px auto 0;
  text-align: center;
  color: #62596c;
  font-size: 10px;
}

/* =====================================================
   MOBILE OVERLAY
===================================================== */

.sidebarOverlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.58);
  z-index: 40;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 760px) {

  .sidebar {
    position: fixed;
    left: -285px;
    top: 0;
    bottom: 0;
    transition: left .22s ease;
    box-shadow: 20px 0 50px rgba(0,0,0,.35);
  }

  .sidebar.mobileOpen {
    left: 0;
  }

  .sidebarOverlay.show {
    display: block;
  }

  .mobileMenuButton {
    display: block;
  }

  .header {
    padding: 0 14px;
  }

  .memoryPanel {
    padding: 10px 14px;
  }

  .chat {
    padding: 18px 12px;
  }

  .messageBubble {
    max-width: 92%;
  }

  .composerArea {
    padding: 8px 9px 12px;
  }

  .composerHint {
    display: none;
  }

  .authCard {
    padding: 27px 22px;
  }

  .emptyLogo {
    font-size: 34px;
  }
}
</style>
</head>

<body>

<!-- =====================================================
     AUTH SCREEN
===================================================== -->

<div class="authScreen" id="authScreen">

  <div class="authCard">

    <div class="logoLarge">
      Nastivee<span>AI</span>
    </div>

    <div class="authSubtitle">
      Your personal AI assistant
    </div>

    <input
      id="authEmail"
      class="authInput"
      type="email"
      placeholder="Email"
      autocomplete="email"
    >

    <div class="authPasswordWrap">

      <input
        id="authPassword"
        class="authInput"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button
        id="passwordToggle"
        class="passwordToggle"
        type="button"
        aria-label="Show password"
        title="Show password"
      >
        Show
      </button>

    </div>

    <div class="authForgot">
      <button id="authForgotButton" type="button">
        Forgotten your password?
      </button>
    </div>

    <button
      id="authButton"
      class="authButton"
    >
      Log in
    </button>

    <div
      id="authError"
      class="authError"
    ></div>

    <div class="authSwitch">
      <span id="authSwitchText">
        Don't have an account?
      </span>

      <button id="authSwitchButton">
        Sign up
      </button>
    </div>

  </div>

</div>


<!-- =====================================================
     SET A NEW PASSWORD
===================================================== -->

<div class="resetScreen" id="resetScreen">

  <div class="authCard">

    <div class="logoLarge">
      Nastivee<span>AI</span>
    </div>

    <div class="resetHint">
      Choose a new password for your account.
    </div>

    <div class="authPasswordWrap">

      <input
        id="resetPassword"
        class="authInput"
        type="password"
        placeholder="New password"
        autocomplete="new-password"
      >

      <button
        id="resetPasswordToggle"
        class="passwordToggle"
        type="button"
        aria-label="Show password"
        title="Show password"
      >
        Show
      </button>

    </div>

    <div class="authPasswordWrap">

      <input
        id="resetPasswordConfirm"
        class="authInput"
        type="password"
        placeholder="Confirm new password"
        autocomplete="new-password"
      >

      <button
        id="resetPasswordConfirmToggle"
        class="passwordToggle"
        type="button"
        aria-label="Show password"
        title="Show password"
      >
        Show
      </button>

    </div>

    <button
      id="resetSaveButton"
      class="authButton"
    >
      Save new password
    </button>

    <div
      id="resetError"
      class="authError"
    ></div>

    <div class="authSwitch">
      <button id="resetCancelButton" type="button">
        Back to log in
      </button>
    </div>

  </div>

</div>


<!-- =====================================================
     APP
===================================================== -->

<div class="app" id="app">

  <!-- SIDEBAR -->

  <aside class="sidebar" id="sidebar">

    <div class="sidebarHeader">

      <div class="logo">
        Nastivee<span>AI</span>
      </div>

      <button
        class="newChatButton"
        id="newChatButton"
      >
        ＋ New chat
      </button>

    </div>

    <div class="chatHistory">

      <div class="historyLabel">
        Chats
      </div>

      <div id="chatHistoryList"></div>

    </div>

    <div class="sidebarBottom">

      <div
        class="userEmail"
        id="userEmail"
      ></div>

      <button
        class="logoutButton"
        id="logoutButton"
      >
        Log out
      </button>

    </div>

  </aside>


  <div
    class="sidebarOverlay"
    id="sidebarOverlay"
  ></div>


  <!-- MAIN -->

  <main class="main">

    <header class="header">

      <button
        class="mobileMenuButton"
        id="mobileMenuButton"
        aria-label="Open menu"
      >
        ☰
      </button>

      <div
        class="headerTitle"
        id="headerTitle"
      >
        New chat
      </div>

      <div class="headerStatus">

        <span class="statusDot"></span>

        Online

      </div>

    </header>


    <!-- MEMORY -->

    <div class="memoryPanel">

      <button
        class="memoryToggle"
        id="memoryToggle"
      >
        🧠 Memory
      </button>

      <div
        class="memoryContent"
        id="memoryContent"
      >

        <textarea
          id="memoryTextarea"
          class="memoryTextarea"
          placeholder="Things Nastivee should remember about you..."
        ></textarea>

      </div>

    </div>


    <!-- CHAT -->

    <section
      class="chat"
      id="chat"
    >

      <div
        class="emptyState"
        id="emptyState"
      >

        <div class="emptyInner">

          <div class="emptyLogo">
            Nastivee<span>AI</span>
          </div>

          <div class="emptyText">
            Ask me anything, upload an image,
            or create something with AI.
          </div>

        </div>

      </div>

    </section>


    <!-- IMAGE PROGRESS -->

    <div
      class="imageProgress"
      id="imageProgress"
    >

      <div
        class="progressText"
        id="progressText"
      >
        Creating image...
      </div>

      <div class="progressTrack">
        <div class="progressBar"></div>
      </div>

    </div>


    <!-- COMPOSER -->

    <div class="composerArea">

      <div class="composer">

        <div
          class="uploadPreview"
          id="uploadPreview"
        >

          <img
            id="uploadThumb"
            class="uploadThumb"
            alt="Upload preview"
          >

          <div class="uploadInfo">

            <div
              id="uploadName"
              class="uploadName"
            ></div>

          </div>

          <button
            id="clearUploadButton"
            class="clearUpload"
            type="button"
          >
            ✕
          </button>

        </div>


        <div class="composerBottom">

          <button
            id="imageButton"
            class="composerButton"
            type="button"
            title="Create image"
            aria-pressed="false"
          >
            🖼️
          </button>

          <button
            id="uploadButton"
            class="composerButton"
            type="button"
            title="Upload image"
          >
            📎
          </button>

          <textarea
            id="messageInput"
            class="messageInput"
            rows="1"
            placeholder="Message Nastivee..."
          ></textarea>

          <button
            id="sendButton"
            class="composerButton sendButton"
            type="button"
            title="Send"
          >
            ➤
          </button>

        </div>

      </div>

      <div class="composerHint">
        Nastivee can remember your chats and edit images.
      </div>

    </div>


  </main>

</div>


<input
  type="file"
  id="fileInput"
  class="fileInput"
  accept="image/*"
>


<script>

/* =====================================================
   CONFIG
===================================================== */

const SUPABASE_URL =
  'https://fzwqunpnohgwgwikumkt.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_kNUxEr43Kp5qVC4Evxgz0A_iCTLw7GB';

const API_BASE =
  'https://ai-8vlt.onrender.com';

const LIVE_SITE_URL =
  'https://ai-8vlt.onrender.com';


/* =====================================================
   SUPABASE
===================================================== */

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   STATE
===================================================== */

let currentUser = null;
let currentChatId = null;

let chats = [];

let memory = '';

let selectedImageFile = null;
let selectedImageData = null;

let imageMode = false;

let initialised = false;
let imageBusy = false;

let loadSequence = 0;
let activeRequestId = 0;
let imageRequestId = 0;


/*
  Stores the image history currently displayed.

  Each image message has:

  {
    currentImage,
    originalImage,
    prompt
  }

  For re-rendering, currentImage is always used.
*/

const imageState = new Map();


/* =====================================================
   DOM
===================================================== */

const authScreen =
  document.getElementById('authScreen');

const app =
  document.getElementById('app');

const authEmail =
  document.getElementById('authEmail');

const authPassword =
  document.getElementById('authPassword');

const authButton =
  document.getElementById('authButton');

const authError =
  document.getElementById('authError');

/* =====================================================
   PASSWORD VIEW / HIDE
===================================================== */

function wirePasswordToggle(toggleId, inputId) {

  const toggle =
    document.getElementById(toggleId);

  const input =
    document.getElementById(inputId);

  if (!toggle || !input) return;

  toggle.addEventListener(
    'click',
    () => {

      const showing =
        input.type === 'text';

      input.type =
        showing
          ? 'password'
          : 'text';

      toggle.textContent =
        showing
          ? 'Show'
          : 'Hide';

      const label =
        showing
          ? 'Show password'
          : 'Hide password';

      toggle.setAttribute('aria-label', label);
      toggle.title = label;

      input.focus();

    }
  );

}

wirePasswordToggle('passwordToggle', 'authPassword');
wirePasswordToggle('resetPasswordToggle', 'resetPassword');
wirePasswordToggle('resetPasswordConfirmToggle', 'resetPasswordConfirm');


/* =====================================================
   SET A NEW PASSWORD

   The reset email brings the user back with a recovery
   session. We hold the app back and ask for the new
   password first.
===================================================== */

let recoveryMode = false;

const resetScreen =
  document.getElementById('resetScreen');

const resetPassword =
  document.getElementById('resetPassword');

const resetPasswordConfirm =
  document.getElementById('resetPasswordConfirm');

const resetSaveButton =
  document.getElementById('resetSaveButton');

const resetError =
  document.getElementById('resetError');

const resetCancelButton =
  document.getElementById('resetCancelButton');


function isRecoveryLink() {

  const hash =
    window.location.hash || '';

  const search =
    window.location.search || '';

  return (
    hash.includes('type=recovery') ||
    search.includes('type=recovery')
  );

}


function showResetScreen() {

  recoveryMode = true;

  resetError.textContent = '';

  resetScreen.classList.add('show');

  authScreen.style.display = 'none';

  app.classList.remove('visible');

  resetPassword.focus();

}


function hideResetScreen() {

  recoveryMode = false;

  resetScreen.classList.remove('show');

}


async function saveNewPassword() {

  const password =
    resetPassword.value;

  const confirmation =
    resetPasswordConfirm.value;

  resetError.style.color = '#ff8585';

  if (!password || password.length < 6) {

    resetError.textContent =
      'Your new password must be at least 6 characters.';

    return;
  }

  if (password !== confirmation) {

    resetError.textContent =
      'The two passwords do not match.';

    return;
  }

  resetSaveButton.disabled = true;

  resetError.textContent = '';

  try {

    const { error } =
      await supabaseClient.auth.updateUser({
        password
      });

    if (error) throw error;

    resetError.style.color = '#9ee6bd';

    resetError.textContent =
      'Password updated. Opening your account...';

    resetPassword.value = '';
    resetPasswordConfirm.value = '';

    /*
      Clear the recovery link out of the address bar
      so a refresh does not reopen this screen.
    */

    if (window.history?.replaceState) {

      window.history.replaceState(
        null,
        '',
        window.location.pathname + window.location.search
      );

    }

    setTimeout(
      async () => {

        hideResetScreen();

        const { data } =
          await supabaseClient.auth.getSession();

        if (data?.session?.user) {

          currentUser = data.session.user;

          await initialiseApp();

        } else {

          showAuth();

        }

      },
      900
    );

  } catch (error) {

    resetError.style.color = '#ff8585';

    resetError.textContent =
      error?.message ||
      'Could not update your password.';

  } finally {

    resetSaveButton.disabled = false;

  }

}


resetSaveButton.addEventListener(
  'click',
  saveNewPassword
);

resetPasswordConfirm.addEventListener(
  'keydown',
  event => {

    if (event.key === 'Enter') {
      event.preventDefault();
      saveNewPassword();
    }

  }
);

resetCancelButton.addEventListener(
  'click',
  async () => {

    hideResetScreen();

    await supabaseClient.auth.signOut();

    showAuth();

  }
);

async function handleAuth() {

  const email =
    authEmail.value.trim();

  const password =
    authPassword.value;


  if (!email || !password) {

    authError.textContent =
      'Enter your email and password.';

    return;

  }


  authButton.disabled = true;

  authError.textContent = '';


  try {

    if (signupMode) {

      const {
        data,
        error
      } =
        await supabaseClient.auth.signUp({

          email,
          password,

          options: {
            emailRedirectTo:
              LIVE_SITE_URL
          }

        });


      if (error) {
        throw error;
      }


      if (data?.user && !data.session) {

        authError.style.color =
          '#9ee6bd';

        authError.textContent =
          'Account created. Check your email to confirm your account.';

      } else {

        authError.style.color =
          '#9ee6bd';

        authError.textContent =
          'Account created successfully.';

      }

    } else {

      const {
        error
      } =
        await supabaseClient.auth.signInWithPassword({

          email,
          password

        });


      if (error) {
        throw error;
      }

    }

  } catch (error) {

    authError.style.color =
      '#ff8585';

    authError.textContent =
      error?.message ||
      'Authentication failed.';

  } finally {

    authButton.disabled = false;

  }

}


/* =====================================================
   AUTH STATE
===================================================== */

supabaseClient.auth.onAuthStateChange(
  async (_event, session) => {

    if (_event === 'PASSWORD_RECOVERY') {

      currentUser =
        session?.user || null;

      showResetScreen();

      return;

    }

    if (recoveryMode) {
      return;
    }

    if (session?.user) {

      currentUser =
        session.user;

      await initialiseApp();

    } else {

      currentUser = null;

      showAuth();

    }

  }
);


async function checkSession() {

  const {
    data
  } =
    await supabaseClient.auth.getSession();

  if (data?.session?.user && isRecoveryLink()) {

    currentUser =
      data.session.user;

    showResetScreen();

    return;

  }

  if (data?.session?.user) {

    currentUser =
      data.session.user;

    await initialiseApp();

  } else {

    showAuth();

  }

}


function showAuth() {

  authScreen.style.display =
    'flex';

  app.classList.remove(
    'visible'
  );

}


function showApp() {

  authScreen.style.display =
    'none';

  app.classList.add(
    'visible'
  );

}

===================================================== */

async function initialiseApp() {

  if (!currentUser) {
    return;
  }

  showApp();

  userEmail.textContent =
    currentUser.email || '';

  memory =
    await loadMemory();

  memoryTextarea.value =
    memory || '';

  await loadChats();

  if (!currentChatId) {

    newChat();

  }

  initialised = true;

}

async function loadMemory() {

    return '';
  }


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from('profiles')
        .select('memory')
        .eq(
          'id',
          currentUser.id
        )
        .maybeSingle();


    if (error) {

      console.error(
        'MEMORY LOAD ERROR:',
        error
      );

      return '';

    }


    return data?.memory || '';

  } catch (error) {

    console.error(
      'MEMORY LOAD EXCEPTION:',
      error
    );

    return '';

  }

}

    if (error) {

/* =====================================================
   CHAT LIST
===================================================== */

async function loadChats() {

  if (!currentUser) {
    return;
  }


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from('chats')
        .select('*')
        .eq(
          'user_id',
          currentUser.id
        )
        .order(
          'created_at',
          {
            ascending: false
          }
        );


    if (error) {
      throw error;
    }


    chats =
      data || [];

    renderChatHistory();


  } catch (error) {

    console.error(
      'CHAT LOAD ERROR:',
      error
    );

  }

}


function renderChatHistory() {

  chatHistoryList.innerHTML =
    '';


  chats.forEach(
    chatItem => {

      const row =
        document.createElement(
          'div'
        );

      row.className =
        'chatHistoryItem' +
        (
          String(chatItem.id) ===
          String(currentChatId)
            ? ' active'
            : ''
        );


      const button =
        document.createElement(
          'button'
        );

      button.style.cssText =
        'flex:1;display:flex;align-items:center;gap:8px;background:none;border:0;color:inherit;text-align:left;padding:0;min-width:0;';


      const title =
        document.createElement(
          'span'
        );

      title.className =
        'chatHistoryTitle';

      title.textContent =
        chatItem.title ||
        'New chat';


      button.appendChild(title);


      button.addEventListener(
        'click',
        async () => {

          closeMobileSidebar();

          await loadChat(
            chatItem.id
          );

        }
      );


      const deleteButton =
        document.createElement(
          'button'
        );

      deleteButton.className =
        'deleteChatButton';

      deleteButton.textContent =
        '✕';

      deleteButton.title =
        'Delete chat';


      deleteButton.addEventListener(
        'click',
        async event => {

          event.stopPropagation();

          await deleteChat(
            chatItem.id
          );

        }
      );


      row.appendChild(button);

      row.appendChild(
        deleteButton
      );

      chatHistoryList.appendChild(
        row
      );

    }
  );

}


/* =====================================================
   DELETE CHAT
===================================================== */

async function deleteChat(
  chatId
) {

  if (!currentUser) {
    return;
  }


  const confirmed =
    confirm(
      'Delete this chat?'
    );


  if (!confirmed) {
    return;
  }


  try {

    const {
      error: messageError
    } =
      await supabaseClient
        .from('messages')
        .delete()
        .eq(
          'chat_id',
          chatId
        )
        .eq(
          'user_id',
          currentUser.id
        );


    if (messageError) {
      throw messageError;
    }


    const {
      error: chatError
    } =
      await supabaseClient
        .from('chats')
        .delete()
        .eq(
          'id',
          chatId
        )
        .eq(
          'user_id',
          currentUser.id
        );


    if (chatError) {
      throw chatError;
    }


    imageState.clear();

    currentChatId = null;

    await loadChats();

    newChat();


  } catch (error) {

    console.error(
      'DELETE CHAT ERROR:',
      error
    );

    alert(
      error?.message ||
      'Could not delete chat.'
    );

  }

}

/* =====================================================
   ENSURE CHAT
===================================================== */

async function ensureChat(
  firstMessage = ''
) {

  if (currentChatId) {
    return currentChatId;
  }


  if (!currentUser) {
    throw new Error(
      'You are not logged in.'
    );
  }


  const title =
    firstMessage
      ? firstMessage
          .replace(/\s+/g, ' ')
          .trim()
          .slice(0, 55)
      : 'New chat';


  const {
    data,
    error
  } =
    await supabaseClient
      .from('chats')
      .insert({

        user_id:
          currentUser.id,

        title:
          title || 'New chat'

      })
      .select()
      .single();


  if (error) {
    throw error;
  }


  currentChatId =
    data.id;

  headerTitle.textContent =
    data.title || 'New chat';


  chats.unshift(data);

  renderChatHistory();


  return currentChatId;

}


/* =====================================================
   LOAD CHAT
===================================================== */

async function loadChat(
  chatId
) {

  if (!currentUser) {
    return;
  }


  const sequence =
    ++loadSequence;


  currentChatId =
    chatId;

  imageState.clear();

  clearChatUI();


  const selectedChat =
    chats.find(
      item =>
        String(item.id) ===
        String(chatId)
    );


  headerTitle.textContent =
    selectedChat?.title ||
    'Chat';


  renderChatHistory();


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from('messages')
        .select('*')
        .eq(
          'chat_id',
          chatId
        )
        .eq(
          'user_id',
          currentUser.id
        )
        .order(
          'created_at',
          {
            ascending: true
          }
        );


    if (error) {
      throw error;
    }


    if (sequence !== loadSequence) {
      return;
    }


    if (!data?.length) {

      return;

    }


    emptyState?.remove();


    data.forEach(
      message => {

        if (
          message.role ===
          'user'
        ) {

          addTextMessage(
            'user',
            message.content || ''
          );

        } else if (
          message.image_url
        ) {

          /*
            IMPORTANT:

            The saved image becomes BOTH
            the current source and the source
            available after refresh.

            Re-render will therefore continue
            from the latest generated image.
          */

          addImageMessage(
            message.image_url,
            message.content || '',
            message.image_url,
            message.content || ''
          );

        } else {

          addTextMessage(
            'assistant',
            message.content || ''
          );

        }

      }
    );


    scrollToBottom();


  } catch (error) {

    console.error(
      'LOAD CHAT ERROR:',
      error
    );

    addTextMessage(
      'assistant',
      `Could not load this chat:\n${error.message}`
    );

  }

}


/* =====================================================
   SAVE MESSAGE
===================================================== */

async function saveMessage(
  role,
  content,
  imageUrl = null,
  chatIdOverride = null
) {

  const targetChatId =
    chatIdOverride ||
    currentChatId;


  if (
    !currentUser ||
    !targetChatId
  ) {

    console.error(
      'SAVE MESSAGE FAILED — missing user/chat:',
      {
        user:
          currentUser?.id,
        chatId:
          targetChatId
      }
    );

    return false;

  }


  try {

    const {
      error
    } =
      await supabaseClient
        .from('messages')
        .insert({

          chat_id:
            targetChatId,

          user_id:
            currentUser.id,

          role:
            role,

          content:
            content || '',

          image_url:
            imageUrl || null

        });


    if (error) {

      console.error(
        'SUPABASE MESSAGE SAVE ERROR:',
        error
      );


      if (
        String(currentChatId) ===
        String(targetChatId)
      ) {

        addTextMessage(
          'assistant',
          `Supabase save error:\n${error.message}`
        );

      }

      return false;

    }


    return true;


  } catch (error) {

    console.error(
      'MESSAGE SAVE EXCEPTION:',
      error
    );


    return false;

  }

}


/* =====================================================
   UPDATE CHAT TITLE
===================================================== */

async function updateChatTitle(
  chatId,
  title
) {

  if (!currentUser || !chatId) {
    return;
  }


  try {

    const {
      error
    } =
      await supabaseClient
        .from('chats')
        .update({
          title:
            title.slice(0, 55)
        })
        .eq(
          'id',
          chatId
        )
        .eq(
          'user_id',
          currentUser.id
        );


    if (error) {

      console.error(
        'TITLE UPDATE ERROR:',
        error
      );

      return;

    }


    const item =
      chats.find(
        chatItem =>
          String(chatItem.id) ===
          String(chatId)
      );


    if (item) {

      item.title =
        title.slice(0, 55);

    }


    if (
      String(currentChatId) ===
      String(chatId)
    ) {

      headerTitle.textContent =
        title.slice(0, 55);

    }


    renderChatHistory();


  } catch (error) {

    console.error(
      'TITLE UPDATE EXCEPTION:',
      error
    );

  }

}

/* =====================================================
   ADD IMAGE MESSAGE
===================================================== */

function addImageMessage(
  imageData,
  prompt = '',
  originalImageData = null,
  originalPrompt = ''
) {

  emptyState?.remove();


  const row =
    document.createElement(
      'div'
    );

  row.className =
    'messageRow assistant';


  const wrap =
    document.createElement(
      'div'
    );

  wrap.className =
    'messageImageWrap';


  const image =
    document.createElement(
      'img'
    );

  image.className =
    'generatedImage';

  image.src =
    imageData;

  image.alt =
    'Nastivee AI generated image';


  wrap.appendChild(
    image
  );


  if (prompt) {

    const promptText =
      document.createElement(
        'div'
      );

    promptText.className =
      'imagePrompt';

    promptText.textContent =
      prompt;

    wrap.appendChild(
      promptText
    );

  }


  const actions =
    document.createElement(
      'div'
    );

  actions.className =
    'imageActions';


  const rerenderButton =
    document.createElement(
      'button'
    );

  rerenderButton.className =
    'imageActionButton primary';

  rerenderButton.textContent =
    '🔄 Improve / Re-render';

  rerenderButton.title =
    'Improve this image while keeping the same subject and identity';


  const downloadButton =
    document.createElement(
      'button'
    );

  downloadButton.className =
    'imageActionButton';

  downloadButton.textContent =
    '⬇️ Save image';


  actions.appendChild(
    rerenderButton
  );

  actions.appendChild(
    downloadButton
  );

  wrap.appendChild(
    actions
  );

  row.appendChild(
    wrap
  );

  chat.appendChild(
    row
  );


  /*
    Every displayed image gets its own state.

    Most importantly:

    CURRENT IMAGE =
    imageData

    ORIGINAL SOURCE =
    originalImageData || imageData

    Re-render always starts from CURRENT IMAGE.
  */

  const stateId =
    `image-${Date.now()}-${Math.random()
      .toString(36)
      .slice(2)}`;


  imageState.set(
    stateId,
    {

      currentImage:
        imageData,

      originalImage:
        originalImageData ||
        imageData,

      prompt:
        prompt || originalPrompt || '',

      originalPrompt:
        originalPrompt ||
        prompt ||
        ''

    }
  );


  rerenderButton.addEventListener(
    'click',
    async () => {

      const state =
        imageState.get(
          stateId
        );


      if (
        !state ||
        !state.currentImage
      ) {

        addTextMessage(
          'assistant',
          'I could not find the current image to re-render.'
        );

        return;

      }


      await rerenderImage(
        stateId,
        state,
        rerenderButton
      );

    }
  );


  downloadButton.addEventListener(
    'click',
    () => {

      downloadImage(
        imageData
      );

    }
  );


  scrollToBottom();


  return {
    row,
    stateId
  };

}


/* =====================================================
   IMAGE PROGRESS
===================================================== */

function showImageProgress(
  text = 'Creating image...'
) {

  progressText.textContent =
    text;

  imageProgress.classList.add(
    'show'
  );

}


function hideImageProgress() {

  imageProgress.classList.remove(
    'show'
  );

}


/* =====================================================
   GENERATE IMAGE
===================================================== */

async function generateImage(
  prompt,
  requestChatId
) {

  if (!prompt) {
    return;
  }


  const requestId =
    ++imageRequestId;


  imageBusy = true;

  sendButton.disabled =
    true;

  imageButton.disabled =
    true;


  showImageProgress(
    'Creating your image...'
  );


  try {

    const response =
      await fetch(
        `${API_BASE}/api/image`,
        {

          method:
            'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify({
              prompt
            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data?.details ||
        data?.error ||
        'Image generation failed.'
      );

    }


    if (
      requestId !== imageRequestId
    ) {

      return;

    }


    if (!data?.image) {

      throw new Error(
        'No image was returned.'
      );

    }


    /*
      IMPORTANT:

      The generated image becomes the
      current source for the next
      re-render.
    */

    addImageMessage(
      data.image,
      prompt,
      data.image,
      prompt
    );


    await saveMessage(
      'assistant',
      prompt,
      data.image,
      requestChatId
    );


  } catch (error) {

    console.error(
      'GENERATE IMAGE ERROR:',
      error
    );


    addTextMessage(
      'assistant',
      `Image generation failed:\n${error.message}`
    );

  } finally {

    imageBusy = false;

    sendButton.disabled =
      false;

    imageButton.disabled =
      false;

    hideImageProgress();

  }

}


/* =====================================================
   EDIT IMAGE
===================================================== */

async function editImage(
  image,
  prompt,
  requestChatId,
  regenerate = false
) {

  if (!image) {

    throw new Error(
      'No image supplied.'
    );

  }


  const requestId =
    ++imageRequestId;


  imageBusy = true;

  sendButton.disabled =
    true;

  imageButton.disabled =
    true;


  showImageProgress(
    regenerate
      ? 'Improving your image...'
      : 'Editing your image...'
  );


  try {

    const response =
      await fetch(
        `${API_BASE}/api/image/edit`,
        {

          method:
            'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify({

              prompt,

              image,

              regenerate

            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data?.details ||
        data?.error ||
        'Image edit failed.'
      );

    }


    if (
      requestId !== imageRequestId
    ) {

      return null;

    }


    if (!data?.image) {

      throw new Error(
        'No edited image was returned.'
      );

    }


    /*
      CRITICAL:

      The newly edited image becomes
      the source for the NEXT render.

      We do NOT send the original
      prompt back to /api/image.
    */

    addImageMessage(
      data.image,
      prompt,
      data.image,
      prompt
    );


    await saveMessage(
      'assistant',
      prompt,
      data.image,
      requestChatId
    );


    return data.image;


  } finally {

    imageBusy = false;

    sendButton.disabled =
      false;

    imageButton.disabled =
      false;

    hideImageProgress();

  }

}


/* =====================================================
   RE-RENDER / IMPROVE
===================================================== */

async function rerenderImage(
  stateId,
  state,
  button
) {

  if (
    imageBusy ||
    !state?.currentImage
  ) {

    return;

  }


  /*
    The current image is the actual source.

    We deliberately do NOT call /api/image.

    We call /api/image/edit so the AI edits
    the existing image.
  */

  const currentImage =
    state.currentImage;


  const originalPrompt =
    state.originalPrompt ||
    state.prompt ||
    'Improve this image.';


  const improvementPrompt = `
IMPROVE AND REFINE THE CURRENT IMAGE.

The supplied image is the current version
of the image.

Do NOT start over from the text prompt.

Do NOT create a completely unrelated image.

Keep the same subject, same person,
same concept and same requested changes.


ORIGINAL CREATIVE REQUEST:

${originalPrompt}


PRESERVE THE PERSON:

If there is a person in the image, preserve
their likeness as closely as possible.

Keep the SAME person.

Preserve:

- facial structure
- face shape
- facial proportions
- eyes
- eye shape
- eyebrows
- nose
- mouth
- lips
- cheeks
- jawline
- ears
- skin tone
- hair
- hairline
- hairstyle
- distinctive facial characteristics
- visible body proportions

Do NOT replace the person.

Do NOT create a generic person.

Do NOT unnecessarily beautify the person.

Do NOT unnecessarily age or de-age them.

Do NOT unnecessarily change their face.

Do NOT change their identity.


PRESERVE THE CURRENT IMAGE:

Keep the existing:

- subject
- person
- identity
- requested modification
- important composition
- clothing
- important objects
- environment
- overall concept


IMPROVE QUALITY:

Make useful improvements to:

- realism
- lighting
- shadows
- detail
- texture
- clarity
- depth
- natural skin detail
- photographic quality
- overall polish


AVOID UNNECESSARY CHANGES:

Do not redesign the image.

Do not randomly change the face.

Do not remove the user's requested change.

Do not change the concept.

Do not introduce unrelated objects.

Do not turn it into a completely different scene.


RESULT:

Create a refined version of the CURRENT
IMAGE.

It should clearly look like the same image
and the same person, but improved.

PRIORITY:

1. Preserve identity and likeness.
2. Preserve the requested modification.
3. Preserve the existing image.
4. Improve visual quality.
5. Avoid unnecessary changes.
`;


  button.disabled =
    true;

  button.textContent =
    '⏳ Improving...';


  try {

    const newImage =
      await editImage(
        currentImage,
        improvementPrompt,
        currentChatId,
        true
      );


    if (!newImage) {
      return;
    }


    /*
      Update this image's state.

      This is what makes:

      Image 1
        ↓
      Image 2
        ↓
      Image 3
        ↓
      Image 4

      work correctly.
    */

    state.currentImage =
      newImage;

    state.prompt =
      improvementPrompt;


    imageState.set(
      stateId,
      state
    );


  } catch (error) {

    console.error(
      'RENDER ERROR:',
      error
    );


    addTextMessage(
      'assistant',
      `Could not improve the image:\n${error.message}`
    );

  } finally {

    button.disabled =
      false;

    button.textContent =
      '🔄 Improve / Re-render';

  }

}


/* =====================================================
   NORMAL CHAT
===================================================== */

async function sendNormalMessage(
  text,
  requestChatId
) {

  const requestId =
    ++activeRequestId;


  try {

    const {
      data: messageRows,
      error
    } =
      await supabaseClient
        .from('messages')
        .select(
          'role,content'
        )
        .eq(
          'chat_id',
          requestChatId
        )
        .eq(
          'user_id',
          currentUser.id
        )
        .order(
          'created_at',
          {
            ascending: true
          }
        );


    if (error) {
      throw error;
    }


    const messages =
      (messageRows || [])
        .map(
          item => ({
            role:
              item.role,

            content:
              item.content || ''
          })
        )
        .slice(-30);


    const response =
      await fetch(
        `${API_BASE}/api/chat`,
        {

          method:
            'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify({

              messages,

              memory

            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data?.details ||
        data?.error ||
        'Chat request failed.'
      );

    }


    if (
      requestId !==
      activeRequestId
    ) {

      return;

    }


    const reply =
      data?.reply ||
      'Sorry, I could not generate a response.';


    addTextMessage(
      'assistant',
      reply
    );


    await saveMessage(
      'assistant',
      reply,
      null,
      requestChatId
    );


  } catch (error) {

    console.error(
      'CHAT ERROR:',
      error
    );


    addTextMessage(
      'assistant',
      `Sorry, something went wrong:\n${error.message}`
    );

  }

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage() {

  const userText =
    messageInput.value.trim();


  if (
    !userText ||
    imageBusy ||
    !currentUser
  ) {

    return;

  }


  /*
    Capture the current chat before
    anything asynchronous happens.
  */

  const requestChatId =
    await ensureChat(
      userText
    );


  addTextMessage(
    'user',
    userText
  );


  await saveMessage(
    'user',
    userText,
    null,
    requestChatId
  );


  /*
    -----------------------------------------------------
    UPLOADED IMAGE EDIT
    -----------------------------------------------------
  */

  if (selectedImageData) {

    const image =
      selectedImageData;


    clearUpload();


    messageInput.value =
      '';

    resizeTextarea();


    try {

      await editImage(
        image,
        userText,
        requestChatId,
        false
      );


    } catch (error) {

      console.error(
        'UPLOAD EDIT ERROR:',
        error
      );


      addTextMessage(
        'assistant',
        `Could not edit the image:\n${error.message}`
      );

    }


    return;

  }


  /*
    -----------------------------------------------------
    IMAGE GENERATION MODE
    -----------------------------------------------------
  */

  if (imageMode) {

    messageInput.value =
      '';

    resizeTextarea();

    setImageMode(false);


    await generateImage(
      userText,
      requestChatId
    );


    return;

  }


  /*
    -----------------------------------------------------
    NORMAL CHAT
    -----------------------------------------------------
  */

  messageInput.value =
    '';

  resizeTextarea();


  await sendNormalMessage(
    userText,
    requestChatId
  );

}


/* =====================================================
   SEND BUTTON
===================================================== */

sendButton.addEventListener(
  'click',
  sendMessage
);


/* =====================================================
   IMAGE MODE
===================================================== */

function setImageMode(
  enabled
) {

  imageMode =
    Boolean(enabled);


  if (imageMode) {

    messageInput.placeholder =
      'Describe the image you want me to create...';


    imageButton.classList.add(
      'imageModeActive'
    );


    imageButton.title =
      'Image mode on — press again to turn off';


    imageButton.setAttribute(
      'aria-pressed',
      'true'
    );


  } else {

    messageInput.placeholder =
      selectedImageData
        ? 'Describe what you want me to change...'
        : 'Message Nastivee...';


    imageButton.classList.remove(
      'imageModeActive'
    );


    imageButton.title =
      'Create image';


    imageButton.setAttribute(
      'aria-pressed',
      'false'
    );

  }

}


/* =====================================================
   IMAGE BUTTON
===================================================== */

imageButton.addEventListener(
  'click',
  () => {

    if (imageBusy) {
      return;
    }


    /*
      If an image is uploaded, the button
      should not accidentally switch to
      generation mode.

      The text box is already in edit mode.
    */

    if (selectedImageData) {

      messageInput.focus();

      return;

    }


    setImageMode(
      !imageMode
    );


    messageInput.focus();

  }
);


/* =====================================================
   UPLOAD BUTTON
===================================================== */

uploadButton.addEventListener(
  'click',
  () => {

    if (imageBusy) {
      return;
    }

    fileInput.click();

  }
);


/* =====================================================
   FILE UPLOAD
===================================================== */

fileInput.addEventListener(
  'change',
  event => {

    const file =
      event.target.files?.[0];


    if (!file) {
      return;
    }


    if (
      !file.type.startsWith(
        'image/'
      )
    ) {

      return;

    }


    selectedImageFile =
      file;


    const reader =
      new FileReader();


    reader.onload =
      () => {

        selectedImageData =
          reader.result;


        uploadThumb.src =
          selectedImageData;


        uploadName.textContent =
          file.name;


        uploadPreview.classList.add(
          'show'
        );


        imageMode =
          false;


        imageButton.classList.add(
          'imageModeActive'
        );


        imageButton.title =
          'Image uploaded — describe the edit';


        messageInput.placeholder =
          'Describe what you want me to change...';


        messageInput.focus();

      };


    reader.readAsDataURL(
      file
    );

  }
);


/* =====================================================
   CLEAR UPLOAD
===================================================== */

clearUploadButton.addEventListener(
  'click',
  clearUpload
);


function clearUpload() {

  selectedImageFile =
    null;

  selectedImageData =
    null;


  fileInput.value =
    '';


  uploadThumb.src =
    '';

  uploadName.textContent =
    '';


  uploadPreview.classList.remove(
    'show'
  );


  imageButton.classList.remove(
    'imageModeActive'
  );


  setImageMode(
    false
  );

}


/* =====================================================
   TEXTAREA
===================================================== */

messageInput.addEventListener(
  'input',
  resizeTextarea
);


function resizeTextarea() {

  messageInput.style.height =
    'auto';


  messageInput.style.height =
    Math.min(
      messageInput.scrollHeight,
      180
    ) + 'px';

}


/* =====================================================
   ENTER TO SEND
===================================================== */

messageInput.addEventListener(
  'keydown',
  event => {

    if (
      event.key === 'Enter' &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =====================================================
   SCROLL
===================================================== */

function scrollToBottom() {

  requestAnimationFrame(
    () => {

      chat.scrollTop =
        chat.scrollHeight;

    }
  );

}


/* =====================================================
   DOWNLOAD IMAGE
===================================================== */

function downloadImage(
  imageData
) {

  if (!imageData) {
    return;
  }


  const link =
    document.createElement(
      'a'
    );

  link.href =
    imageData;

  link.download =
    `nastivee-image-${Date.now()}.png`;


  document.body.appendChild(
    link
  );

  link.click();

  link.remove();

}


/* =====================================================
   LOGOUT
===================================================== */

logoutButton.addEventListener(
  'click',
  async () => {

    await supabaseClient.auth.signOut();

    currentUser =
      null;

    currentChatId =
      null;

    chats =
      [];

    imageState.clear();

    initialised =
      false;

    showAuth();

  }
);


/* =====================================================
   START
===================================================== */

updateAuthMode();

resizeTextarea();

checkSession();

</script>
