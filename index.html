<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nastivee AI</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #090614;
      color: white;
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       AUTH
    ========================= */

    #authScreen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, #32105c 0%, #120820 45%, #090614 100%);
      z-index: 1000;
      padding: 20px;
    }

    .authBox {
      width: 100%;
      max-width: 420px;
      background: rgba(24, 15, 38, 0.95);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.5);
    }

    .authLogo {
      text-align: center;
      margin-bottom: 25px;
    }

    .authLogo img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      border-radius: 18px;
      margin-bottom: 10px;
    }

    .authLogo h1 {
      margin: 0;
      font-size: 28px;
    }

    .authLogo p {
      color: #aaa;
      margin-top: 8px;
    }

    .authBox input {
      width: 100%;
      padding: 15px;
      margin-bottom: 12px;
      border: 1px solid #3b2850;
      background: #100a19;
      color: white;
      border-radius: 12px;
      outline: none;
    }

    .authBox input:focus {
      border-color: #9b5cff;
    }

    .authButton {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #8e42ff, #c45cff);
      color: white;
      font-size: 16px;
      font-weight: bold;
      margin-top: 5px;
    }

    .authButton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .authSwitch {
      margin-top: 18px;
      text-align: center;
      color: #aaa;
      font-size: 14px;
    }

    .authSwitch button {
      background: none;
      border: 0;
      color: #c06cff;
      font-weight: bold;
    }

    #authMessage {
      min-height: 20px;
      margin-top: 15px;
      text-align: center;
      color: #ff9e9e;
      font-size: 14px;
    }

    /* =========================
       APP
    ========================= */

    #app {
      display: none;
      width: 100%;
      height: 100%;
    }

    .layout {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      width: 270px;
      background: #0d0816;
      border-right: 1px solid #251735;
      display: flex;
      flex-direction: column;
      padding: 15px;
      flex-shrink: 0;
      position: relative;
      z-index: 500;
    }

    .newChatButton {
      width: 100%;
      padding: 14px;
      border: 1px solid #4a2a66;
      border-radius: 12px;
      background: #171022;
      color: white;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .newChatButton:hover {
      background: #241536;
    }

    .historyTitle {
      color: #888;
      font-size: 12px;
      text-transform: uppercase;
      margin: 8px 5px;
    }

    #chatHistory {
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }

    .historyItem {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 7px 8px 11px;
      border-radius: 10px;
      margin-bottom: 5px;
      color: #ccc;
      cursor: pointer;
      font-size: 14px;
      min-width: 0;
    }

    .historyItem:hover,
    .historyItem.active {
      background: #21132f;
      color: white;
    }

    .historyTitleText {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .deleteChatButton {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #777;
      font-size: 14px;
      cursor: pointer;
      opacity: 0;
      transition: all 0.15s ease;
    }

    .historyItem:hover .deleteChatButton,
    .historyItem.active .deleteChatButton {
      opacity: 1;
    }

    .deleteChatButton:hover {
      background: rgba(255, 70, 100, 0.15);
      color: #ff647c;
    }

    .emptyHistory {
      color: #666;
      font-size: 13px;
      padding: 10px 5px;
    }

    .sidebarBottom {
      border-top: 1px solid #251735;
      padding-top: 12px;
      margin-top: 10px;
    }

    .sidebarButton {
      width: 100%;
      padding: 11px;
      border: 0;
      background: transparent;
      color: #bbb;
      text-align: left;
      border-radius: 10px;
      margin-bottom: 4px;
    }

    .sidebarButton:hover {
      background: #1b1028;
      color: white;
    }

    /* =========================
       MOBILE SIDEBAR
    ========================= */

    .sidebarOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.58);
      z-index: 450;
    }

    .sidebarOverlay.show {
      display: block;
    }

    .mobileMenuButton {
      display: none;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid #342044;
      background: #171021;
      color: white;
      font-size: 20px;
      margin-right: 8px;
      flex-shrink: 0;
    }

    .mobileMenuButton:hover {
      background: #241536;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 50% -20%, #241039 0%, #0b0711 55%);
      position: relative;
    }

    header {
      height: 70px;
      flex-shrink: 0;
      border-bottom: 1px solid #251735;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: relative;
      z-index: 40;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: bold;
    }

    .logo img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 10px;
    }

    .headerButtons {
      display: flex;
      gap: 8px;
    }

    .headerButtons button {
      background: #171021;
      color: #ddd;
      border: 1px solid #342044;
      border-radius: 10px;
      padding: 9px 12px;
    }

    .headerButtons button:hover {
      background: #241536;
    }

    /* =========================
       MEMORY
    ========================= */

    #memoryPanel {
      display: none;
      position: absolute;
      top: 78px;
      right: 20px;
      width: 330px;
      max-width: calc(100vw - 40px);
      background: #160d21;
      border: 1px solid #43275a;
      border-radius: 16px;
      padding: 16px;
      z-index: 100;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    #memoryPanel h3 {
      margin-top: 0;
    }

    #memoryText {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      background: #0e0815;
      color: white;
      border: 1px solid #382146;
      border-radius: 10px;
      padding: 12px;
      outline: none;
    }

    #saveMemoryButton {
      margin-top: 10px;
      width: 100%;
      padding: 11px;
      border: 0;
      border-radius: 10px;
      background: #8c4bff;
      color: white;
      font-weight: bold;
    }

    /* =========================
       CHAT
    ========================= */

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
      padding-bottom: 180px;
      scroll-behavior: smooth;
    }

    .welcome {
      max-width: 700px;
      margin: 60px auto;
      text-align: center;
      color: #bbb;
    }

    .welcome h2 {
      color: white;
      font-size: 32px;
      margin-bottom: 10px;
    }

    .message {
      max-width: 850px;
      margin: 0 auto 18px;
      display: flex;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 80%;
      padding: 13px 16px;
      border-radius: 18px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user .bubble {
      background: linear-gradient(135deg, #7036d6, #913fba);
      border-bottom-right-radius: 5px;
    }

    .message.assistant .bubble {
      background: #17101f;
      border: 1px solid #2d1b3d;
      border-bottom-left-radius: 5px;
    }

    /* =========================
       IMAGES
    ========================= */

    .imageMessage {
      max-width: 850px;
      margin: 0 auto 20px;
    }

    .generatedImage {
      max-width: min(100%, 700px);
      max-height: 75vh;
      display: block;
      border-radius: 16px;
      border: 1px solid #39234b;
      margin-top: 8px;
      object-fit: contain;
      background: #10091a;
    }

    .imageActions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .imageActionButton {
      padding: 9px 12px;
      border-radius: 9px;
      border: 1px solid #43275a;
      background: #160d21;
      color: #ddd;
    }

    .imageActionButton:hover {
      background: #241433;
    }

    .imageActionButton:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* =========================
       PROGRESS
    ========================= */

    #imageProgress {
      display: none;
      position: fixed;
      bottom: 105px;
      left: 50%;
      transform: translateX(-50%);
      width: min(500px, calc(100% - 30px));
      background: #170d21;
      border: 1px solid #44265b;
      border-radius: 14px;
      padding: 13px 16px;
      z-index: 600;
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    }

    .progressTitle {
      font-size: 13px;
      color: #ddd;
      margin-bottom: 8px;
    }

    .progressBar {
      width: 100%;
      height: 6px;
      background: #2a1937;
      border-radius: 10px;
      overflow: hidden;
    }

    #progressFill {
      width: 15%;
      height: 100%;
      background: linear-gradient(90deg, #8b4cff, #d85cff);
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    /* =========================
       UPLOAD
    ========================= */

    #uploadPreview {
      display: none;
      position: absolute;
      bottom: 86px;
      left: 0;
      background: #170d21;
      border: 1px solid #42265a;
      border-radius: 12px;
      padding: 8px;
      z-index: 50;
    }

    #uploadPreview img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
    }

    #removeUpload {
      position: absolute;
      top: -7px;
      right: -7px;
      width: 22px;
      height: 22px;
      border: 0;
      border-radius: 50%;
      background: #e34b62;
      color: white;
      font-size: 12px;
    }

    /* =========================
       COMPOSER
    ========================= */

    .dock {
      position: fixed;
      bottom: 0;
      left: 270px;
      right: 0;
      padding: 15px 20px 20px;
      background: linear-gradient(
        to top,
        #0b0711 70%,
        rgba(11,7,17,0)
      );
      z-index: 20;
    }

    .composer {
      max-width: 900px;
      margin: auto;
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: #160d20;
      border: 1px solid #39234a;
      border-radius: 18px;
      padding: 8px;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      max-height: 150px;
      resize: none;
      background: transparent;
      border: 0;
      color: white;
      outline: none;
      padding: 10px;
      font-size: 15px;
    }

    #messageInput::placeholder {
      color: #777;
    }

    .dockButton {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      border: 1px solid #3b244d;
      background: #21132e;
      color: white;
      flex-shrink: 0;
    }

    .dockButton:hover {
      background: #2c1940;
    }

    .dockButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #imageButton {
      background: linear-gradient(135deg, #5d2cc9, #a341dc);
      border: 0;
      transition: all 0.2s ease;
    }

    #imageButton.imageModeActive {
      background: linear-gradient(135deg, #9b42ff, #e15cff);
      box-shadow: 0 0 18px rgba(180, 75, 255, 0.35);
      transform: scale(1.03);
    }

    #sendButton {
      background: linear-gradient(135deg, #7c3cff, #b34fff);
      border: 0;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 750px) {

      .sidebar {
        display: flex;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 285px;
        max-width: 85vw;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        box-shadow: 20px 0 50px rgba(0,0,0,0.45);
      }

      .sidebar.mobileOpen {
        transform: translateX(0);
      }

      .mobileMenuButton {
        display: block;
      }

      header {
        padding: 0 12px;
        justify-content: flex-start;
      }

      header .logo {
        flex: 1;
      }

      .dock {
        left: 0;
        padding: 10px;
      }

      .logo {
        font-size: 17px;
      }

      .logo img {
        width: 36px;
        height: 36px;
      }

      .headerButtons {
        gap: 5px;
      }

      .headerButtons button {
        padding: 8px;
        font-size: 12px;
      }

      #chat {
        padding: 15px;
        padding-bottom: 170px;
      }

      .bubble {
        max-width: 90%;
      }

      .welcome {
        margin: 40px auto;
      }

      .welcome h2 {
        font-size: 26px;
      }

      .generatedImage {
        max-width: 100%;
      }

      #memoryPanel {
        right: 10px;
        top: 72px;
        width: calc(100vw - 20px);
      }

      .deleteChatButton {
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <div id="sidebarOverlay" class="sidebarOverlay"></div>

  <!-- =========================
       AUTH
  ========================= -->

  <div id="authScreen">

    <div class="authBox">

      <div class="authLogo">

        <img
          src="IMG_0471.jpeg"
          alt="Nastivee AI"
        >

        <h1>Nastivee AI</h1>

        <p>Your personal AI assistant</p>

      </div>

      <div id="loginForm">

        <input
          id="loginEmail"
          type="email"
          placeholder="Email"
          autocomplete="email"
        >

        <input
          id="loginPassword"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
        >

        <button
          type="button"
          class="authButton"
          id="loginButton"
        >
          Login
        </button>

        <div class="authSwitch">
          Don't have an account?
          <button
            type="button"
            id="showSignupButton"
          >
            Sign up
          </button>
        </div>

      </div>

      <div
        id="signupForm"
        style="display:none;"
      >

        <input
          id="signupEmail"
          type="email"
          placeholder="Email"
          autocomplete="email"
        >

        <input
          id="signupPassword"
          type="password"
          placeholder="Password"
          autocomplete="new-password"
        >

        <input
          id="signupPasswordConfirm"
          type="password"
          placeholder="Confirm password"
          autocomplete="new-password"
        >

        <button
          type="button"
          class="authButton"
          id="signupButton"
        >
          Create account
        </button>

        <div class="authSwitch">
          Already have an account?
          <button
            type="button"
            id="showLoginButton"
          >
            Login
          </button>
        </div>

      </div>

      <div id="authMessage"></div>

    </div>

  </div>


  <!-- =========================
       APP
  ========================= -->

  <div id="app">

    <div class="layout">

      <!-- SIDEBAR -->

      <aside class="sidebar">

        <button
          type="button"
          class="newChatButton"
          id="sidebarNewChatButton"
        >
          ＋ New chat
        </button>

        <div class="historyTitle">
          Chat history
        </div>

        <div id="chatHistory"></div>

        <div class="sidebarBottom">

          <button
            type="button"
            class="sidebarButton"
            id="sidebarMemoryButton"
          >
            🧠 Memory
          </button>

          <button
            type="button"
            class="sidebarButton"
            id="logoutButton"
          >
            🚪 Log out
          </button>

        </div>

      </aside>


      <!-- MAIN -->

      <main class="main">

        <header>

          <button
            type="button"
            id="mobileMenuButton"
            class="mobileMenuButton"
            aria-label="Open menu"
          >
            ☰
          </button>

          <div class="logo">

            <img
              src="IMG_0471.jpeg"
              alt="Nastivee AI"
            >

            <span>Nastivee AI</span>

          </div>

          <div class="headerButtons">

            <button
              type="button"
              id="memoryButton"
            >
              🧠 Memory
            </button>

            <button
              type="button"
              id="newChatButton"
            >
              ＋ New
            </button>

          </div>

        </header>


        <!-- MEMORY -->

        <div id="memoryPanel">

          <h3>🧠 Memory</h3>

          <textarea
            id="memoryText"
            placeholder="Things Nastivee should remember about you..."
          ></textarea>

          <button
            type="button"
            id="saveMemoryButton"
          >
            Save memory
          </button>

        </div>


        <!-- CHAT -->

        <div id="chat">

          <div
            class="welcome"
            id="welcome"
          >

            <h2>
              What can I help you with?
            </h2>

            <p>
              Ask Nastivee anything,
              create images,
              edit photos,
              or just have a conversation.
            </p>

          </div>

        </div>

      </main>

    </div>


    <!-- IMAGE PROGRESS -->

    <div id="imageProgress">

      <div
        class="progressTitle"
        id="progressTitle"
      >
        Preparing image...
      </div>

      <div class="progressBar">

        <div id="progressFill"></div>

      </div>

    </div>


    <!-- COMPOSER -->

    <div class="dock">

      <div class="composer">

        <div id="uploadPreview">

          <button
            type="button"
            id="removeUpload"
          >
            ×
          </button>

          <img
            id="uploadPreviewImage"
            src=""
            alt="Upload preview"
          >

        </div>


        <button
          type="button"
          class="dockButton"
          id="uploadButton"
          title="Upload image"
        >
          📎
        </button>


        <textarea
          id="messageInput"
          rows="1"
          placeholder="Message Nastivee..."
        ></textarea>


        <button
          type="button"
          class="dockButton"
          id="imageButton"
          title="Create image"
          aria-label="Image mode"
          aria-pressed="false"
        >
          🖼️
        </button>


        <button
          type="button"
          class="dockButton"
          id="sendButton"
          title="Send message"
          aria-label="Send"
        >
          ➤
        </button>

      </div>

    </div>


    <input
      id="fileInput"
      type="file"
      accept="image/*"
      style="display:none;"
    >

  </div>


<script>

  /* =========================================================
     CONFIG
  ========================================================= */

  const SUPABASE_URL =
    'https://fzwqunpnohgwgwikumkt.supabase.co';

  const SUPABASE_KEY =
    'sb_publishable_kNUxEr43Kp5qVC4Evxgz0A_iCTLw7GB';

  const API_BASE =
    'https://ai-8vlt.onrender.com';

  const LIVE_SITE_URL =
    'https://ai-8vlt.onrender.com';


  /* =========================================================
     SUPABASE
  ========================================================= */

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================================
     STATE
  ========================================================= */

  let currentUser = null;
  let currentChatId = null;
  let chats = [];
  let memory = '';

  let selectedImageFile = null;
  let selectedImageData = null;

  let imageMode = false;

  const chatConversations =
    new Map();

  let initialised = false;
  let imageBusy = false;

  let loadSequence = 0;
  let activeRequestId = 0;
  let imageRequestId = 0;


  /*
    Stores the original uploaded image for the current
    browser session.

    This gives us a permanent identity reference while
    the current page is open.

    The backend upgrade will later allow this original
    reference to survive across refreshes and multiple
    edits.
  */

  const originalImageReferences =
    new Map();


  /* =========================================================
     ELEMENTS
  ========================================================= */

  const authScreen =
    document.getElementById('authScreen');

  const app =
    document.getElementById('app');

  const loginForm =
    document.getElementById('loginForm');

  const signupForm =
    document.getElementById('signupForm');

  const authMessage =
    document.getElementById('authMessage');

  const chat =
    document.getElementById('chat');

  const welcome =
    document.getElementById('welcome');

  const messageInput =
    document.getElementById('messageInput');

  const fileInput =
    document.getElementById('fileInput');

  const uploadPreview =
    document.getElementById('uploadPreview');

  const uploadPreviewImage =
    document.getElementById('uploadPreviewImage');

  const imageProgress =
    document.getElementById('imageProgress');

  const progressTitle =
    document.getElementById('progressTitle');

  const progressFill =
    document.getElementById('progressFill');

  const memoryPanel =
    document.getElementById('memoryPanel');

  const memoryText =
    document.getElementById('memoryText');

  const imageButton =
    document.getElementById('imageButton');

  const sendButton =
    document.getElementById('sendButton');

  const uploadButton =
    document.getElementById('uploadButton');

  const sidebar =
    document.querySelector('.sidebar');

  const sidebarOverlay =
    document.getElementById('sidebarOverlay');

  const mobileMenuButton =
    document.getElementById('mobileMenuButton');


  /* =========================================================
     MOBILE SIDEBAR
  ========================================================= */

  function openMobileSidebar() {

    sidebar.classList.add(
      'mobileOpen'
    );

    sidebarOverlay.classList.add(
      'show'
    );

    const email =
      document
        .getElementById('loginEmail')
        .value
        .trim();

    const password =
      document
        .getElementById('loginPassword')
        .value;


    if (!email || !password) {

      setAuthMessage(
        'Please enter your email and password.'
      );

      return;

    }


    const button =
      document.getElementById(
        'loginButton'
      );


    button.disabled = true;
    button.textContent =
      'Logging in...';


    try {

      const result =
        await supabaseClient.auth.signInWithPassword({

          email,
          password

        });


      if (result.error) {

        setAuthMessage(
          result.error.message
        );

        return;

      }


      setAuthMessage('');


    } catch (error) {

      console.error(
        'Login error:',
        error
      );

      setAuthMessage(
        error.message
      );


    } finally {

      button.disabled = false;

      button.textContent =
        'Login';

    .getElementById('loginButton')

        .getElementById('signupEmail')
        .value
        .trim();

    const password =
      document
        .getElementById('signupPassword')
        .value;

    const confirmPassword =
      document

          }

  /* =========================================================
     CONVERSATION MEMORY
  ========================================================= */

  function getConversation(
    chatId
  ) {

    if (!chatId) {
      return [];
    }


    const key =
      String(chatId);


    if (
      !chatConversations.has(key)
    ) {

      chatConversations.set(
        key,
        []
      );

    }


    return chatConversations.get(
      key
    );

  }


  function setConversation(
    chatId,
    messages
  ) {

    if (!chatId) {
      return;
    }


    chatConversations.set(
      String(chatId),
      Array.isArray(messages)
        ? messages
        : []
    );

  }


  /* =========================================================
     API
  ========================================================= */

  async function apiFetch(
    path,
    options = {}
  ) {

    const headers =
      new Headers(
        options.headers || {}
      );


    if (
      options.body &&
      !(options.body instanceof FormData)
    ) {

      headers.set(
        'Content-Type',
        'application/json'
      );

    }


    try {

      const sessionResult =
        await supabaseClient.auth.getSession();


      const token =
        sessionResult
          .data
          ?.session
          ?.access_token;


      if (token) {

        headers.set(
          'Authorization',
          `Bearer ${token}`
        );

      }

    } catch (error) {

      console.warn(
        'Token error:',
        error
      );

    }


    return fetch(
      `${API_BASE}${path}`,
      {
        ...options,
        headers
      }
    );

  }

  /* =========================================================
     CHAT HISTORY
  ========================================================= */

  function renderChatHistory() {

    const container =
      document.getElementById(
        'chatHistory'
      );


    container.innerHTML =
      '';


    if (!chats.length) {

      const empty =
        document.createElement(
          'div'
        );

      empty.className =
        'emptyHistory';

      empty.textContent =
        'No conversations yet';

      container.appendChild(
        empty
      );

      return;

    }


    chats.forEach(
      chatItem => {

        const item =
          document.createElement(
            'div'
          );


        item.className =
          'historyItem';


        if (
          String(chatItem.id) ===
          String(currentChatId)
        ) {

          item.classList.add(
            'active'
          );

        }


        const title =
          document.createElement(
            'div'
          );


        title.className =
          'historyTitleText';

        title.textContent =
          chatItem.title ||
          'New chat';


        item.appendChild(
          title
        );


        const deleteButton =
          document.createElement(
            'button'
          );


        deleteButton.type =
          'button';

        deleteButton.className =
          'deleteChatButton';

        deleteButton.textContent =
          '🗑️';

        deleteButton.title =
          'Delete conversation';


        deleteButton.addEventListener(
          'click',
          async event => {

            event.stopPropagation();

            await deleteChat(
              chatItem.id
            );

          }
        );


        item.appendChild(
          deleteButton
        );


        item.addEventListener(
          'click',
          async () => {

            if (
              String(chatItem.id) ===
              String(currentChatId)
            ) {

              closeMobileSidebar();

              return;

            }


            await loadChat(
              chatItem.id
            );


            closeMobileSidebar();

          }
        );


        container.appendChild(
          item
        );

      }
    );

  }


  /* =========================================================
     DELETE CHAT
  ========================================================= */

  async function deleteChat(
    chatId
  ) {

    if (
      !currentUser ||
      !chatId
    ) {

      return;

    }


    const chatItem =
      chats.find(
        item =>
          String(item.id) ===
          String(chatId)
      );


    const title =
      chatItem?.title ||
      'this conversation';


    if (
      !confirm(
        `Delete "${title}"?\n\nThis will permanently delete this conversation and its messages.`
      )
    ) {

      return;

    }


    activeRequestId++;
    loadSequence++;
    imageRequestId++;

    hideImageProgress();


    const messageDelete =
      await supabaseClient
        .from('messages')
        .delete()
        .eq(
          'chat_id',
          chatId
        )
        .eq(
          'user_id',
          currentUser.id
        );


    if (messageDelete.error) {

      console.error(
        'DELETE MESSAGES ERROR:',
        messageDelete.error
      );

      alert(
        'Could not delete the messages:\n\n' +
        messageDelete.error.message
      );

      return;

    }


    const chatDelete =
      await supabaseClient
        .from('chats')
        .delete()
        .eq(
          'id',
          chatId
        )
        .eq(
          'user_id',
          currentUser.id
        );


    if (chatDelete.error) {

      console.error(
        'DELETE CHAT ERROR:',
        chatDelete.error
      );

      alert(
        'Could not delete the conversation:\n\n' +
        chatDelete.error.message
      );

      return;

    }


    chatConversations.delete(
      String(chatId)
    );


    originalImageReferences.delete(
      String(chatId)
    );


    chats =
      chats.filter(
        item =>
          String(item.id) !==
          String(chatId)
      );


    if (
      String(currentChatId) ===
      String(chatId)
    ) {

      currentChatId =
        null;

      clearUpload();

      messageInput.value =
        '';

      messageInput.style.height =
        'auto';

      setImageMode(false);

      clearChatUI();

      renderChatHistory();


      if (chats.length > 0) {

        await loadChat(
          chats[0].id
        );

      }

    } else {

      renderChatHistory();

    }

  }

  ========================================================= */

  async function ensureCurrentChat(
    firstMessage
  ) {

    if (currentChatId) {

      const existing =
        chats.find(
          item =>
            String(item.id) ===
            String(currentChatId)
        );


      if (existing) {
        return true;
      }

    }


    if (!currentUser) {
      return false;
    }


    const title =
      firstMessage
        .trim()
        .slice(0, 50) ||
      'New chat';


    const result =
      await supabaseClient
        .from('chats')
        .insert({

          user_id:
            currentUser.id,

          title:
            title

        })
        .select('*')
        .single();


    if (result.error) {

      console.error(
        'CREATE CHAT ERROR:',
        result.error
      );

      alert(
        'Could not create chat:\n\n' +
        result.error.message
      );

      return false;

    }


    currentChatId =
      result.data.id;


    chats.unshift(
      result.data
    );


    setConversation(
      currentChatId,
      []
    );


    renderChatHistory();


    return true;

  }


  /* =========================================================
     LOAD CHAT
  ========================================================= */

  async function loadChat(
    chatId
  ) {

    if (
      !chatId ||
      !currentUser
    ) {

      return;

    }


    const thisLoad =
      ++loadSequence;


    const requestedChatId =
      String(chatId);


    activeRequestId++;
    imageRequestId++;

    hideImageProgress();


    try {

      const chatResult =
        await supabaseClient
          .from('chats')
          .select('*')
          .eq(
            'id',
            chatId
          )
          .eq(
            'user_id',
            currentUser.id
          )
          .maybeSingle();


      if (
        thisLoad !==
        loadSequence
      ) {

        return;

      }


      if (chatResult.error) {

        console.error(
          'CHAT VERIFY ERROR:',
          chatResult.error
        );

        return;

      }


      if (!chatResult.data) {

        console.error(
          'CHAT NOT FOUND:',
          chatId
        );

        return;

      }


      const messageResult =
        await supabaseClient
          .from('messages')
          .select('*')
          .eq(
            'chat_id',
            chatId
          )
          .eq(
            'user_id',
            currentUser.id
          )
          .order(
            'created_at',
            {
              ascending: true
            }
          );


      if (
        thisLoad !==
        loadSequence
      ) {

        return;

      }


      if (messageResult.error) {

        console.error(
          'MESSAGE LOAD ERROR:',
          messageResult.error
        );

        return;

      }


      const messages =
        messageResult.data || [];


      const conversation =
        [];


      messages.forEach(
        message => {

          if (
            !message.image_url &&
            (
              message.role === 'user' ||
              message.role === 'assistant'
            )
          ) {

            conversation.push({

              role:
                message.role,

              content:
                message.content || ''

            });

          }

        }
      );


      setConversation(
        requestedChatId,
        conversation
      );


      currentChatId =
        chatId;


      clearUpload();

      setImageMode(false);

      clearChatUI();


      /*
        When loading a saved image, image_url is itself
        used as the source image.

        This means the Re-render button can continue
        working after a page refresh, provided the
        stored image is a usable data URL.
      */

      let latestImageForRerender =
        null;


      messages.forEach(
        message => {

          if (message.image_url) {

            latestImageForRerender =
              message.image_url;


            addImageMessage(
              message.image_url,
              message.content || '',
              message.image_url,
              message.content || ''
            );

          } else if (
            message.role === 'user' ||
            message.role === 'assistant'
          ) {

            addTextMessage(
              message.role,
              message.content || ''
            );

          }

        }
      );


      /*
        Store the latest image as the current source.
      */

      if (latestImageForRerender) {

        originalImageReferences.set(
          requestedChatId,
          latestImageForRerender
        );

      }


      renderChatHistory();


      requestAnimationFrame(
        () => {

          chat.scrollTop =
            chat.scrollHeight;

        }
      );


    } catch (error) {

      console.error(
        'LOAD CHAT ERROR:',
        error
      );

    }

  }

  /* =========================================================

  ========================================================= */

  async function saveMessage(
    role,
    content,
    imageUrl = null,
    chatIdOverride = null
  ) {

    const targetChatId =
      chatIdOverride ||
      currentChatId;


    if (
      !currentUser ||
      !targetChatId
    ) {

      console.error(
        'SAVE MESSAGE FAILED — missing user/chat:',
        {
          user:
            currentUser?.id,

          chatId:
            targetChatId
        }
      );

      return false;

    }


    console.log(
      'ATTEMPTING MESSAGE SAVE:',
      {
        chat_id:
          targetChatId,

        user_id:
          currentUser.id,

        role:
          role,

        content:
          content,

        hasImage:
          Boolean(imageUrl)
      }
    );


    try {

      const result =
        await supabaseClient
          .from('messages')
          .insert({

            chat_id:
              targetChatId,

            user_id:
              currentUser.id,

            role:
              role,

            content:
              content || '',

            image_url:
              imageUrl || null

          });


      if (result.error) {

        console.error(
          '================================'
        );

        console.error(
          'SUPABASE MESSAGE SAVE ERROR:',
          result.error
        );

        console.error(
          'ERROR CODE:',
          result.error.code
        );

        console.error(
          'ERROR MESSAGE:',
          result.error.message
        );

        console.error(
          'ERROR DETAILS:',
          result.error.details
        );

        console.error(
          'ERROR HINT:',
          result.error.hint
        );

        console.error(
          '================================'
        );


        if (
          String(currentChatId) ===
          String(targetChatId)
        ) {

          addTextMessage(
            'assistant',
            `Supabase save error:\n${result.error.message}`
          );

        }


        return false;

      }


      console.log(
        'MESSAGE SAVED SUCCESSFULLY:',
        targetChatId
      );


      return true;


    } catch (error) {

      console.error(
        'MESSAGE SAVE EXCEPTION:',
        error
      );


      if (
        String(currentChatId) ===
        String(targetChatId)
      ) {

        addTextMessage(
          'assistant',
          `Message save error:\n${error.message}`
        );

      }


      return false;

    }

  }


  /* =========================================================
     UPDATE CHAT TITLE
  ========================================================= */

  async function updateChatTitle(
    text,
    chatIdOverride = null
  ) {

    const targetChatId =
      chatIdOverride ||
      currentChatId;


    if (!targetChatId) {
      return;
    }


    const existing =
      chats.find(
        item =>
          String(item.id) ===
          String(targetChatId)
      );


    if (
      existing &&
      existing.title &&
      existing.title !== 'New chat'
    ) {

      return;

    }


    const title =
      text
        .trim()
        .slice(0, 50) ||
      'New chat';


    const result =
      await supabaseClient
        .from('chats')
        .update({
          title
        })
        .eq(
          'id',
          targetChatId
        )
        .eq(
          'user_id',
          currentUser.id
        );


    if (result.error) {

      console.error(
        'TITLE UPDATE ERROR:',
        result.error
      );

      return;

    }


    if (existing) {

      existing.title =
        title;

    }


    renderChatHistory();

  }


  /* =========================================================
     TEXT MESSAGE
  ========================================================= */

  function addTextMessage(
    role,
    text
  ) {

    welcome.style.display =
      'none';


    const wrapper =
      document.createElement(
        'div'
      );


    wrapper.className =
      `message ${role}`;


    const bubble =
      document.createElement(
        'div'
      );


    bubble.className =
      'bubble';


    bubble.textContent =
      text || '';


    wrapper.appendChild(
      bubble
    );


    chat.appendChild(
      wrapper
    );


    chat.scrollTop =
      chat.scrollHeight;


    return bubble;

  }


  /* =========================================================
     IMAGE MESSAGE
  ========================================================= */

  function addImageMessage(
    imageUrl,
    prompt,
    sourceImageData = null,
    originalPrompt = ''
  ) {

    welcome.style.display =
      'none';


    const wrapper =
      document.createElement(
        'div'
      );


    wrapper.className =
      'imageMessage';


    const img =
      document.createElement(
        'img'
      );


    img.className =
      'generatedImage';


    img.src =
      imageUrl;


    img.alt =
      prompt ||
      'Generated image';


    wrapper.appendChild(
      img
    );


    if (prompt) {

      const caption =
        document.createElement(
          'div'
        );


      caption.style.marginTop =
        '8px';

      caption.style.color =
        '#aaa';

      caption.style.fontSize =
        '13px';

      caption.textContent =
        prompt;


      wrapper.appendChild(
        caption
      );

    }


    const actions =
      document.createElement(
        'div'
      );


    actions.className =
      'imageActions';


    /* =========================
       RE-RENDER
    ========================= */

    const rerenderButton =
      document.createElement(
        'button'
      );


    rerenderButton.type =
      'button';

    rerenderButton.className =
      'imageActionButton';

    rerenderButton.textContent =
      '🔄 Improve / Re-render';


    /*
      If no source was explicitly supplied,
      use the image currently being displayed.

      This is important because every new version
      should become the source for the next version.
    */

    const usableSource =
      sourceImageData ||
      imageUrl ||
      null;


    rerenderButton.disabled =
      !usableSource;


    if (usableSource) {

      rerenderButton.addEventListener(
        'click',
        async () => {

          if (imageBusy) {
            return;
          }


          await rerenderImage({

            sourceImage:
              usableSource,

            prompt:
              originalPrompt ||
              prompt ||
              '',

            currentImage:
              imageUrl

          });

        }
      );

    } else {

      rerenderButton.title =
        'This image has no usable source image.';

    }


    actions.appendChild(
      rerenderButton
    );


    /* =========================
       DOWNLOAD
    ========================= */

    const downloadButton =
      document.createElement(
        'button'
      );


    downloadButton.type =
      'button';

    downloadButton.className =
      'imageActionButton';

    downloadButton.textContent =
      '⬇️ Save image';


    downloadButton.addEventListener(
      'click',
      () => {

        const link =
          document.createElement(
            'a'
          );


        link.href =
          imageUrl;

        link.download =
          'nastivee-image.png';

        link.target =
          '_blank';


        document.body.appendChild(
          link
        );

        link.click();

        link.remove();

      }
    );


    actions.appendChild(
      downloadButton
    );


    wrapper.appendChild(
      actions
    );


    chat.appendChild(
      wrapper
    );


    chat.scrollTop =
      chat.scrollHeight;


    return wrapper;

  }


  /* =========================================================
     IMAGE PROGRESS
  ========================================================= */

  function showImageProgress(
    title,
    percent
  ) {

    imageProgress.style.display =
      'block';

    progressTitle.textContent =
      title;

    progressFill.style.width =
      `${percent}%`;

  }


  function hideImageProgress() {

    imageProgress.style.display =
      'none';

    progressFill.style.width =
      '15%';

  }


  function setImageButtonsBusy(
    busy
  ) {

    imageBusy =
      busy;

    imageButton.disabled =
      busy;

    sendButton.disabled =
      busy;

    uploadButton.disabled =
      busy;

  }


  /* =========================================================
     GENERATE IMAGE
  ========================================================= */

  async function generateImage(
    prompt,
    chatIdOverride = null,
    requestImageId = null,
    requestId = null
  ) {

    if (imageBusy) {
      return;
    }


    const targetChatId =
      chatIdOverride ||
      currentChatId;


    if (!targetChatId) {
      return;
    }


    const thisImageRequest =
      requestImageId ||
      ++imageRequestId;


    const thisRequestId =
      requestId ||
      ++activeRequestId;


    setImageButtonsBusy(true);


    showImageProgress(
      'Preparing image...',
      15
    );


    let timer1;
    let timer2;


    try {

      timer1 =
        setTimeout(
          () => {

            if (
              thisImageRequest !==
                imageRequestId ||
              String(currentChatId) !==
                String(targetChatId)
            ) {

              return;

            }


            showImageProgress(
              'Creating your image...',
              45
            );

          },
          700
        );


      timer2 =
        setTimeout(
          () => {

            if (
              thisImageRequest !==
                imageRequestId ||
              String(currentChatId) !==
                String(targetChatId)
            ) {

              return;

            }


            showImageProgress(
              'Rendering details...',
              70
            );

          },
          1800
        );


      const response =
        await apiFetch(
          '/api/image',
          {

            method:
              'POST',

            body:
              JSON.stringify({

                prompt:
                  prompt.trim()

              })

          }
        );


      let data;


      try {

        data =
          await response.json();

      } catch {

        throw new Error(
          'Invalid response from image server.'
        );

      }


      if (!response.ok) {

        throw new Error(
          data.error ||
          data.message ||
          `Image generation failed (${response.status})`
        );

      }


      if (!data.image) {

        throw new Error(
          'No image was returned.'
        );

      }


      /*
        Save generated image.
      */

      const saved =
        await saveMessage(
          'assistant',
          prompt,
          data.image,
          targetChatId
        );


      if (!saved) {

        console.error(
          'GENERATED IMAGE COULD NOT BE SAVED:',
          targetChatId
        );

        return;

      }


      /*
        IMPORTANT:
        The generated image itself becomes the source
        for the next re-render.
      */

      originalImageReferences.set(
        String(targetChatId),
        data.image
      );


      if (
        thisImageRequest ===
          imageRequestId &&
        String(currentChatId) ===
          String(targetChatId) &&
        thisRequestId ===
          activeRequestId
      ) {

        showImageProgress(
          'Finishing image...',
          95
        );


        addImageMessage(
          data.image,
          prompt,
          data.image,
          prompt
        );


        hideImageProgress();

      } else {

        console.log(
          'IMAGE FINISHED IN BACKGROUND CHAT:',
          targetChatId
        );

      }


    } catch (error) {

      console.error(
        'IMAGE ERROR:',
        error
      );


      if (
        thisImageRequest ===
          imageRequestId &&
        String(currentChatId) ===
          String(targetChatId)
      ) {

        hideImageProgress();


        addTextMessage(
          'assistant',
          `Image error:\n${error.message}`
        );

      }


    } finally {

      clearTimeout(timer1);
      clearTimeout(timer2);


      if (
        thisImageRequest ===
        imageRequestId
      ) {

        hideImageProgress();

        setImageButtonsBusy(
          false
        );

      }

    }

  }


  /* =========================================================
     EDIT IMAGE
  ========================================================= */

  async function editImage(
    imageData,
    prompt,
    chatIdOverride = null,
    identityImageData = null
  ) {

    if (imageBusy) {
      return;
    }


    const targetChatId =
      chatIdOverride ||
      currentChatId;


    if (!targetChatId) {
      return;
    }


    /*
      imageData = the current image being edited.

      identityImageData = the original uploaded image.

      The backend currently accepts one image, so for now
      we send imageData. The backend upgrade will allow
      both to be supplied so identity can be preserved
      across many generations.
    */

    const thisImageRequest =
      ++imageRequestId;


    setImageButtonsBusy(true);


    showImageProgress(
      'Preparing your image...',
      15
    );


    let timer1;
    let timer2;


    try {

      timer1 =
        setTimeout(
          () => {

            if (
              thisImageRequest !==
                imageRequestId ||
              String(currentChatId) !==
                String(targetChatId)
            ) {

              return;

            }


            showImageProgress(
              'Understanding your edit...',
              40
            );

          },
          600
        );


      timer2 =
        setTimeout(
          () => {

            if (
              thisImageRequest !==
                imageRequestId ||
              String(currentChatId) !==
                String(targetChatId)
            ) {

              return;

            }


            showImageProgress(
              'Rendering changes...',
              70
            );

          },
          1500
        );


      /*
        For now the existing backend receives the current
        image exactly as before.
      */

      const response =
        await apiFetch(
          '/api/image/edit',
          {

            method:
              'POST',

            body:
              JSON.stringify({

                image:
                  imageData,

                prompt:
                  prompt

              })

          }
        );


      let data;


      try {

        data =
          await response.json();

      } catch {

        throw new Error(
          'Invalid response from image server.'
        );

      }


      if (!response.ok) {

        throw new Error(
          data.error ||
          data.message ||
          `Image edit failed (${response.status})`
        );

      }


      if (!data.image) {

        throw new Error(
          'No edited image was returned.'
        );

      }


      /*
        Save the NEWEST image.
      */

      const saved =
        await saveMessage(
          'assistant',
          prompt,
          data.image,
          targetChatId
        );


      if (!saved) {

        console.error(
          'EDITED IMAGE COULD NOT BE SAVED:',
          targetChatId
        );

        return;

      }


      /*
        MOST IMPORTANT PART:

        The newly edited image becomes the source
        for the NEXT re-render.

        Therefore:

        Original
          ↓
        Edit 1
          ↓
        Edit 2
          ↓
        Edit 3
          ↓
        Edit 4

        Each step works from the image immediately
        before it.
      */

      originalImageReferences.set(
        String(targetChatId),
        data.image
      );


      if (
        thisImageRequest ===
          imageRequestId &&
        String(currentChatId) ===
          String(targetChatId)
      ) {

        showImageProgress(
          'Finishing your image...',
          95
        );


        addImageMessage(
          data.image,
          prompt,
          data.image,
          prompt
        );


        hideImageProgress();

      }


    } catch (error) {

      console.error(
        'IMAGE EDIT ERROR:',
        error
      );


      if (
        thisImageRequest ===
          imageRequestId &&
        String(currentChatId) ===
          String(targetChatId)
      ) {

        hideImageProgress();


        addTextMessage(
          'assistant',
          `Image edit error:\n${error.message}`
        );

      }


    } finally {

      clearTimeout(timer1);
      clearTimeout(timer2);


      if (
        thisImageRequest ===
        imageRequestId
      ) {

        hideImageProgress();

        setImageButtonsBusy(
          false
        );

      }

    }

  }


  /* =========================================================
     RERENDER / IMPROVE IMAGE
  ========================================================= */

  async function rerenderImage({
    sourceImage,
    prompt,
    currentImage = null
  }) {

    if (!sourceImage) {

      addTextMessage(
        'assistant',
        'There is no source image available for this re-render.'
      );

      return;

    }


    /*
      If possible, always use the latest image associated
      with this chat.

      This prevents accidentally going back to an older
      image when several versions exist.
    */

    const storedLatest =
      currentChatId
        ? originalImageReferences.get(
            String(currentChatId)
          )
        : null;


    const latestSource =
      storedLatest ||
      sourceImage ||
      currentImage;


    /*
      This is deliberately an IMPROVEMENT prompt.

      It tells the image model not to throw away the
      current design and start again.
    */

    const improvedPrompt =
`IMPROVE AND REFINE THE EXISTING IMAGE.

This is an EDIT of the supplied image.

DO NOT create a completely new image from scratch.

DO NOT restart the design from the original text prompt.

The supplied image is the CURRENT VERSION and must remain
the primary visual reference.

Original creative request:
${prompt || 'Improve the image.'}

Your task is to improve the current image while keeping
the same subject, same person if present, same overall
creative intention and recognisable visual identity.

KEEP EVERYTHING THAT IS ALREADY WORKING.

Improve only where useful:
- realism
- image quality
- lighting
- shadows
- depth
- detail
- sharpness
- texture
- composition
- proportions
- background quality
- colour balance
- professional finish

Do not make unnecessary changes.

PERSON / FACE PRESERVATION:

If the image contains a person, preserve their likeness
as closely as possible.

Keep:
- facial structure
- face shape
- eyes
- eye spacing
- eyebrows
- nose
- mouth
- lips
- cheeks
- jawline
- chin
- ears
- skin tone
- hair
- hairline
- facial hair
- distinctive facial characteristics
- body proportions
- recognisable features

DO NOT replace the person's face.

DO NOT substantially redesign the person's face.

DO NOT make the person look like a different person.

The final result should clearly look like the SAME person
and the SAME image, professionally improved.

If there is already a specific edit or creative direction
in the image, preserve it.

If the original request asked for something to be changed,
keep that change.

The priority is:

1. Preserve the person's identity and likeness.
2. Preserve the current image.
3. Preserve the original creative intention.
4. Improve quality and realism.
5. Avoid unnecessary changes.

Create a refined improved version of the supplied image.`;


    await editImage(
      latestSource,
      improvedPrompt,
      currentChatId,
      originalImageReferences.get(
        String(currentChatId)
      ) || latestSource
    );

  }


  /* =========================================================
     NORMAL SEND
  ========================================================= */

  async function sendMessage() {

    if (imageBusy) {
      return;
    }


    const text =
      messageInput.value.trim();


    if (
      !text &&
      !selectedImageData
    ) {

      messageInput.focus();

      return;

    }


    /*
      IMAGE CREATION MODE
    */

    if (
      imageMode &&
      !selectedImageData &&
      text
    ) {

      await sendImageFromChatBox(
        text
      );

      return;

    }


    const userText =
      text ||
      'Please edit this image.';


    const chatReady =
      await ensureCurrentChat(
        userText
      );


    if (!chatReady) {

      return;

    }


    const requestChatId =
      currentChatId;


    const requestId =
      ++activeRequestId;


    const conversation =
      getConversation(
        requestChatId
      );


    addTextMessage(
      'user',
      userText
    );


    conversation.push({

      role:
        'user',

      content:
        userText

    });


    const saved =
      await saveMessage(
        'user',
        userText,
        null,
        requestChatId
      );


    if (!saved) {

      return;

    }


    await updateChatTitle(
      userText,
      requestChatId
    );


    /*
      IMAGE EDIT
    */

    if (selectedImageData) {

      const image =
        selectedImageData;


      /*
        Keep the original uploaded photo as the
        identity reference for this browser session.
      */

      if (
        !originalImageReferences.has(
          String(requestChatId)
        )
      ) {

        originalImageReferences.set(
          String(requestChatId),
          image
        );

      }


      clearUpload();


      messageInput.value =
        '';

      messageInput.style.height =
        'auto';


      await editImage(
        image,
        userText,
        requestChatId,
        image
      );


      return;

    }


    /*
      NORMAL AI CHAT
    */

    messageInput.value =
      '';

    messageInput.style.height =
      'auto';


    try {

      const response =
        await apiFetch(
          '/api/chat',
          {

            method:
              'POST',

            body:
              JSON.stringify({

                messages:
                  conversation.slice(-30),

                memory:
                  memory

              })

          }
        );


      let data;


      try {

        data =
          await response.json();

      } catch {

        throw new Error(
          'Invalid response from chat server.'
        );

      }


      if (!response.ok) {

        throw new Error(
          data.error ||
          data.message ||
          `Chat request failed (${response.status})`
        );

      }


      const answer =
        data.reply ||
        data.message ||
        'I could not generate a response.';


      const assistantSaved =
        await saveMessage(
          'assistant',
          answer,
          null,
          requestChatId
        );


      if (!assistantSaved) {

        console.error(
          'ASSISTANT MESSAGE WAS NOT SAVED:',
          requestChatId
        );

      }


      conversation.push({

        role:
          'assistant',

        content:
          answer

      });


      if (
        String(currentChatId) ===
          String(requestChatId) &&
        requestId ===
          activeRequestId
      ) {

        addTextMessage(
          'assistant',
          answer
        );

      }


    } catch (error) {

      console.error(
        'CHAT ERROR:',
        error
      );


      if (
        String(currentChatId) ===
          String(requestChatId) &&
        requestId ===
          activeRequestId
      ) {

        addTextMessage(
          'assistant',
          `Error:\n${error.message}`
        );

      }

    }

  }


  /* =========================================================
     IMAGE CREATION FROM CHAT BOX
  ========================================================= */

  async function sendImageFromChatBox(
    prompt
  ) {

    if (
      !prompt ||
      imageBusy
    ) {

      return;

    }


    /*
      Create chat first.
    */

    const chatReady =
      await ensureCurrentChat(
        prompt
      );


    if (!chatReady) {

      return;

    }


    /*
      Lock everything to this chat.
    */

    const targetChatId =
      currentChatId;


    const requestId =
      ++activeRequestId;


    const thisImageRequest =
      ++imageRequestId;


    const conversation =
      getConversation(
        targetChatId
      );


    /*
      SHOW PROMPT
    */

    addTextMessage(
      'user',
      prompt
    );


    /*
      STORE PROMPT LOCALLY
    */

    conversation.push({

      role:
        'user',

      content:
        prompt

    });


    /*
      SAVE IMAGE PROMPT
    */

    const saved =
      await saveMessage(
        'user',
        prompt,
        null,
        targetChatId
      );


    if (!saved) {

      console.error(
        'IMAGE PROMPT WAS NOT SAVED:',
        targetChatId
      );

      return;

    }


    await updateChatTitle(
      prompt,
      targetChatId
    );


    messageInput.value =
      '';

    messageInput.style.height =
      'auto';


    setImageMode(false);


    /*
      GENERATE
    */

    await generateImage(
      prompt,
      targetChatId,
      thisImageRequest,
      requestId
    );

  }


  /* =========================================================
     SEND BUTTON
  ========================================================= */

  sendButton.addEventListener(
    'click',
    sendMessage
  );


  /* =========================================================
     UPLOAD
  ========================================================= */

  uploadButton.addEventListener(
    'click',
    () => {

      if (!imageBusy) {

        fileInput.click();

      }

    }
  );


  fileInput.addEventListener(
    'change',
    event => {

      const file =
        event.target.files?.[0];


      if (!file) {
        return;
      }


      if (
        !file.type.startsWith(
          'image/'
        )
      ) {

        alert(
          'Please select an image.'
        );

        return;

      }


      selectedImageFile =
        file;


      const reader =
        new FileReader();


      reader.onload =
        () => {

          selectedImageData =
            reader.result;


          uploadPreviewImage.src =
            selectedImageData;


          uploadPreview.style.display =
            'block';


          messageInput.placeholder =
            'Describe what you want me to change...';


          imageButton.classList.add(
            'imageModeActive'
          );


          messageInput.focus();

        };


      reader.readAsDataURL(
        file
      );

    }
  );


  /* =========================================================
     CLEAR UPLOAD
  ========================================================= */

  function clearUpload() {

    selectedImageFile =
      null;

    selectedImageData =
      null;

    fileInput.value =
      '';

    uploadPreview.style.display =
      'none';

    uploadPreviewImage.src =
      '';


    messageInput.placeholder =
      imageMode
        ? 'Describe the image you want me to create...'
        : 'Message Nastivee...';

  }


  document
    .getElementById('removeUpload')
    .addEventListener(
      'click',
      clearUpload
    );


  /* =========================================================
     ENTER TO SEND
  ========================================================= */

  messageInput.addEventListener(
    'keydown',
    event => {

      if (
        event.key === 'Enter' &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


  /* =========================================================
     TEXTAREA RESIZE
  ========================================================= */

  messageInput.addEventListener(
    'input',
    () => {

      messageInput.style.height =
        'auto';


      messageInput.style.height =
        `${Math.min(
          messageInput.scrollHeight,
          150
        )}px`;

    }
  );


  /* =========================================================
     LOGOUT
  ========================================================= */

  document
    .getElementById('logoutButton')
    .addEventListener(
      'click',
      async () => {

        activeRequestId++;
        loadSequence++;
        imageRequestId++;

        hideImageProgress();

        imageBusy =
          false;


        await supabaseClient.auth.signOut();


        currentUser =
          null;

        currentChatId =
          null;

        chats =
          [];

        memory =
          '';

        chatConversations.clear();

        originalImageReferences.clear();

        initialised =
          false;

        imageMode =
          false;

        clearUpload();

        setImageMode(false);

        clearChatUI();

        showAuthScreen();

      }
    );


  /* =========================================================
     START
  ========================================================= */

  checkSession();

</script>

</body>
</html>
