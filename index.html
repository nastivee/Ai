<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="AI Lab"><link rel="manifest" href="manifest.webmanifest"><title>AI Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;display:flex;flex-direction:column}.head{padding:calc(18px + env(safe-area-inset-top)) 18px 14px;border-bottom:1px solid #29324a;background:#111827;position:sticky;top:0;z-index:2}.title{font-size:22px;font-weight:750}.sub{font-size:13px;color:#9ca3af;margin-top:3px}.chat{flex:1;padding:16px;overflow:auto}.msg{max-width:88%;padding:12px 14px;margin:9px 0;border-radius:17px;white-space:pre-wrap;line-height:1.45}.ai{background:#171f33;border:1px solid #29324a}.user{margin-left:auto;background:#334155}.bottom{padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #29324a;background:#111827}.inputrow{display:flex;gap:8px;align-items:flex-end}textarea{flex:1;min-height:48px;max-height:140px;resize:none;background:#0f172a;color:#fff;border:1px solid #334155;border-radius:14px;padding:12px;font:inherit;font-size:16px;outline:none}button{min-height:46px;border:0;border-radius:13px;padding:10px 15px;background:#4f46e5;color:white;font-weight:700;font-size:15px}button.secondary{background:#263148}.actions{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}.status{font-size:12px;color:#9ca3af;margin-top:7px}</style></head><body><main class="app"><header class="head"><div class="title">AI Lab</div><div class="sub">Experimental self-improvement assistant</div></header><section id="chat" class="chat" aria-live="polite"><div class="msg ai">Hello boss 👋\n\nYour AI Lab is connected to the AI backend. Ask me anything.</div></section><footer class="bottom"><div class="inputrow"><textarea id="input" rows="1" placeholder="Message your AI…" aria-label="Message"></textarea><button id="send" type="button">Send</button></div><div class="actions"><button id="improve" class="secondary" type="button">Improve last</button><button id="clear" class="secondary" type="button">New chat</button></div><div id="status" class="status">AI backend: connected</div></footer></main><script>
const BACKEND='https://ai-8vlt.onrender.com';
const chat=document.getElementById('chat'),input=document.getElementById('input'),send=document.getElementById('send'),improve=document.getElementById('improve'),clear=document.getElementById('clear'),status=document.getElementById('status');let lastQ='',lastA='';
function add(text,kind){const d=document.createElement('div');d.className='msg '+kind;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
async function sendMsg(){const q=input.value.trim();if(!q)return;add(q,'user');input.value='';input.style.height='auto';status.textContent='AI Lab is thinking…';send.disabled=true;try{const r=await fetch(BACKEND+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||('HTTP '+r.status));lastQ=q;lastA=data.answer||'No response received.';add(lastA,'ai');status.textContent='AI backend: connected';}catch(e){console.error(e);add('I could not connect to the AI backend. Make sure the Render service is running and its OPENAI_API_KEY is configured.','ai');status.textContent='Connection error';}finally{send.disabled=false;input.focus()}}
send.onclick=sendMsg;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,140)+'px'});
improve.onclick=async()=>{if(!lastA){add('There is no previous answer to improve yet.','ai');return}status.textContent='Reviewing the last answer…';try{const r=await fetch(BACKEND+'/api/improve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:lastQ,answer:lastA})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||('HTTP '+r.status));add(data.improvement||'No improvement returned.','ai');status.textContent='Improvement review complete';}catch(e){console.error(e);add('The improvement review could not connect to the backend.','ai');status.textContent='Connection error'}};
clear.onclick=()=>{chat.innerHTML='';lastQ='';lastA='';add('New conversation started, boss.','ai');status.textContent='AI backend: connected'};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
