<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AI Flare Mobile</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, sans-serif;
background: #0f172a;
color: #f8fafc;
padding: 16px;
display: flex;
flex-direction: column;
min-height: 100vh;
gap: 12px;
}
header { text-align: center; margin-top: 4px; }
h1 { font-size: 1.3rem; color: #38bdf8; margin-bottom: 2px; }
p { font-size: 0.8rem; color: #94a3b8; }
.container {
display: flex;
flex-direction: column;
gap: 12px;
max-width: 500px;
width: 100%;
margin: 0 auto;
flex: 1;
}
textarea {
width: 100%;
height: 140px;
background: #1e293b;
color: #e2e8f0;
border: 1px solid #334155;
border-radius: 12px;
padding: 12px;
font-family: ui-monospace, monospace;
font-size: 0.85rem;
resize: vertical;
-webkit-appearance: none;
}
textarea:focus {
outline: none;
border-color: #38bdf8;
}
.status-bar {
display: flex;
justify-content: space-between;
align-items: center;
font-size: 0.75rem;
color: #64748b;
padding: 0 4px;
}
.badge {
background: #0369a1;
color: #e0f2fe;
padding: 2px 8px;
border-radius: 12px;
font-size: 0.7rem;
font-weight: 600;
}
.preview {
flex: 1;
background: #1e293b;
border: 1px dashed #475569;
border-radius: 12px;
padding: 16px;
display: flex;
align-items: center;
justify-content: center;
min-height: 240px;
overflow: auto;
}
.preview svg { max-width: 100%; height: auto; }
.preview img { max-width: 100%; height: auto; }
</style>
</head>
<body>
<header>
<h1>AI Flare Mobile</h1>
<p>Live Automatic SVG & Image Parser</p>
</header>
<div class="container">
<textarea id="input" placeholder="Paste SVG code, <img> tag, or AI response here..." oninput="autoRender()"></textarea>
<div class="status-bar">
<span>Auto-detect active</span>
<span class="badge" id="statusBadge">Idle</span>
</div>
<div class="preview" id="preview">
<span style="color: #64748b;">Paste code above to render automatically</span>
</div>
</div>
<script>
function autoRender() {
const val = document.getElementById('input').value.trim();
const preview = document.getElementById('preview');
const badge = document.getElementById('statusBadge');
if (!val) {
preview.innerHTML = '<span style="color: #64748b;">Paste code above to render automatically</span>';
badge.textContent = 'Idle';
badge.style.background = '#334155';
return;
}
if (val.startsWith('<img') || val.includes('data:image/svg+xml')) {
preview.innerHTML = val;
badge.textContent = 'Rendered <img>';
badge.style.background = '#0284c7';
return;
}
const match = val.match(/<svg[\s\S]*?</svg>/i);
if (match) {
preview.innerHTML = match[0];
badge.textContent = 'Rendered SVG';
badge.style.background = '#15803d';
} else {
preview.innerHTML = '<span style="color: #f87171;">Waiting for valid <svg> or <img> tag...</span>';
badge.textContent = 'Searching...';
badge.style.background = '#b45309';
}
}
</script>
</body>
</html>
