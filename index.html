<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09051a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Nastivee AI Bot">
<link rel="manifest" href="manifest.webmanifest"><title>Nastivee AI Bot</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070511;color:#f8f7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{background:radial-gradient(circle at 50% -10%,#32206d 0,#100b24 34%,#070511 72%);}.app{max-width:760px;margin:auto;min-height:100vh;display:flex;flex-direction:column;position:relative}.head{padding:calc(15px + env(safe-area-inset-top)) 17px 13px;border-bottom:1px solid rgba(157,124,255,.2);background:rgba(9,5,26,.78);backdrop-filter:blur(18px);position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px}.avatar{width:48px;height:48px;border-radius:16px;background:linear-gradient(145deg,#8b5cf6,#3b82f6);display:grid;place-items:center;box-shadow:0 8px 30px rgba(124,58,237,.35);font-size:27px}.title{font-size:20px;font-weight:800;letter-spacing:-.3px}.sub{font-size:12px;color:#b7b0ce;margin-top:2px}.online{margin-left:auto;font-size:11px;color:#b8ffd9;display:flex;align-items:center;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 10px #34d399}.chat{flex:1;padding:18px 15px 20px;overflow:auto}.msg{max-width:88%;padding:13px 15px;margin:10px 0;border-radius:20px;white-space:pre-wrap;line-height:1.5;box-shadow:0 5px 22px rgba(0,0,0,.16)}.ai{background:linear-gradient(145deg,rgba(32,24,61,.95),rgba(18,16,38,.95));border:1px solid rgba(139,92,246,.22)}.user{margin-left:auto;background:linear-gradient(145deg,#6845d8,#4266db);border:1px solid rgba(255,255,255,.12)}.bottom{padding:10px 13px calc(12px + env(safe-area-inset-bottom));border-top:1px solid rgba(157,124,255,.18);background:rgba(9,5,26,.82);backdrop-filter:blur(18px)}.inputrow{display:flex;gap:8px;align-items:flex-end}textarea{flex:1;min-height:50px;max-height:140px;resize:none;background:rgba(20,15,40,.95);color:#fff;border:1px solid rgba(139,92,246,.3);border-radius:17px;padding:13px 14px;font:inherit;font-size:16px;outline:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}textarea:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.12)}button{min-height:48px;border:0;border-radius:15px;padding:10px 16px;background:linear-gradient(135deg,#8b5cf6,#4f46e5);color:white;font-weight:750;font-size:15px;box-shadow:0 7px 20px rgba(79,70,229,.28)}button:disabled{opacity:.55}.actions{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}.actions button{background:rgba(37,28,65,.9);border:1px solid rgba(139,92,246,.2);box-shadow:none;font-size:13px;min-height:40px}.status{font-size:11px;color:#9f97b9;margin-top:7px;text-align:center}@media(max-width:380px){.actions button{flex:1;padding:8px 6px}.online{display:none}}
</style></head>
<body><main class="app"><header class="head"><div class="avatar" aria-label="Nastivee AI Bot">🤖</div><div><div class="title">Nastivee AI Bot</div><div class="sub">Your personal AI assistant</div></div><div class="online"><span class="dot"></span>Online</div></header>
<section id="chat" class="chat" aria-live="polite"><div class="msg ai">Hello boss 👋\n\nI'm Nastivee AI Bot. I'm ready to chat, help you think things through and work on ideas with you.</div></section>
<footer class="bottom"><div class="inputrow"><textarea id="input" rows="1" placeholder="Talk to Nastivee…" aria-label="Message"></textarea><button id="send" type="button">Send</button></div><div class="actions"><button id="improve" type="button">Improve last</button><button id="clear" type="button">New chat</button></div><div id="status" class="status">AI backend: connected</div></footer></main>
<script>
const BACKEND='https://ai-8vlt.onrender.com';const chat=document.getElementById('chat'),input=document.getElementById('input'),send=document.getElementById('send'),improve=document.getElementById('improve'),clear=document.getElementById('clear'),status=document.getElementById('status');let lastQ='',lastA='';
function add(text,kind){const d=document.createElement('div');d.className='msg '+kind;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
async function sendMsg(){const q=input.value.trim();if(!q)return;add(q,'user');input.value='';input.style.height='auto';status.textContent='Nastivee is thinking…';send.disabled=true;try{const r=await fetch(BACKEND+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||('HTTP '+r.status));lastQ=q;lastA=data.answer||'No response received.';add(lastA,'ai');status.textContent='Nastivee is online';}catch(e){console.error(e);add('I could not connect to Nastivee right now. Please check the backend.','ai');status.textContent='Connection error'}finally{send.disabled=false;input.focus()}}
send.onclick=sendMsg;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,140)+'px'});
improve.onclick=()=>{if(!lastA){add('There is no previous answer to improve yet.','ai');return}add('Improvement review:\n\n• Check correctness\n• Find missing information\n• Strengthen the reasoning\n• Produce a better candidate\n\nFor the full improvement workflow, the backend can be extended further.','ai')};
clear.onclick=()=>{chat.innerHTML='';lastQ='';lastA='';add('New conversation started, boss.','ai');status.textContent='Nastivee is online'};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
