<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Nastivee AI</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --header-h: 65px;
  --dock-h: 90px;
  --sidebar-w: 285px;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(160deg, #241044, #0b0615);
  background-attachment: fixed;
  color: white;
  min-height: 100vh;
}

button,
textarea {
  font: inherit;
}

.app {
  min-height: 100vh;
  display: flex;
}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {
  width: var(--sidebar-w);
  height: 100vh;
  flex-shrink: 0;
  background: rgba(10,5,20,.96);
  border-right: 1px solid rgba(255,255,255,.08);
  display: flex;
  flex-direction: column;
  position: fixed;
  left: 0;
  top: 0;
  z-index: 30;
}

.sidebarTop {
  padding: 15px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.sidebarLogo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 19px;
  font-weight: bold;
  margin-bottom: 15px;
}

.sidebarLogo img {
  width: 38px;
  height: 38px;
  object-fit: contain;
  border-radius: 9px;
}

.newChatSideButton {
  width: 100%;
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.07);
  color: white;
  padding: 11px 13px;
  border-radius: 11px;
  cursor: pointer;
  text-align: left;
}

.newChatSideButton:hover {
  background: rgba(255,255,255,.12);
}

.chatHistory {
  flex: 1;
  overflow-y: auto;
  padding: 12px 9px;
}

.historyLabel {
  color: #91879f;
  font-size: 12px;
  font-weight: bold;
  padding: 8px 9px;
  text-transform: uppercase;
}

.chatItem {
  display: flex;
  align-items: center;
  gap: 7px;
  width: 100%;
  padding: 10px 9px;
  margin-bottom: 3px;
  border-radius: 9px;
  color: #eee;
  background: transparent;
  cursor: pointer;
  text-align: left;
}

.chatItem:hover {
  background: rgba(255,255,255,.07);
}

.chatItem.active {
  background: rgba(124,60,255,.25);
}

.chatItemTitle {
  flex: 1;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 14px;
}

.deleteChat {
  opacity: 0;
  border: 0;
  background: transparent;
  color: #aaa;
  cursor: pointer;
  padding: 3px 5px;
  border-radius: 6px;
}

.chatItem:hover .deleteChat {
  opacity: 1;
}

.deleteChat:hover {
  color: white;
  background: rgba(255,255,255,.1);
}

.sidebarBottom {
  padding: 12px;
  border-top: 1px solid rgba(255,255,255,.08);
}

.sidebarMemoryButton {
  width: 100%;
  border: 0;
  background: rgba(255,255,255,.06);
  color: white;
  padding: 10px;
  border-radius: 10px;
  cursor: pointer;
}

/* =====================================================
   MAIN
===================================================== */

.mainArea {
  width: 100%;
  min-height: 100vh;
  margin-left: var(--sidebar-w);
}

.appInner {
  max-width: 1000px;
  min-height: 100vh;
  margin: auto;
  display: flex;
  flex-direction: column;
}

/* =====================================================
   HEADER
===================================================== */

header {
  height: var(--header-h);
  padding: 0 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(10,5,20,.8);
  border-bottom: 1px solid rgba(255,255,255,.08);
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 20px;
  font-weight: bold;
}

.logo img {
  width: 42px;
  height: 42px;
  object-fit: contain;
  border-radius: 10px;
}

.headerButtons {
  display: flex;
  gap: 7px;
}

.headerButtons button {
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(255,255,255,.07);
  color: white;
  padding: 8px 11px;
  border-radius: 10px;
  cursor: pointer;
}

.menuButton {
  display: none;
}

/* =====================================================
   MEMORY
===================================================== */

.memoryPanel {
  display: none;
  margin: 10px 15px;
  padding: 13px;
  border-radius: 13px;
  background: rgba(255,255,255,.06);
}

.memoryPanel.open {
  display: block;
}

.memoryTitle {
  font-weight: bold;
  margin-bottom: 7px;
}

.memoryContent {
  white-space: pre-line;
  color: #ddd;
  font-size: 14px;
}

/* =====================================================
   CHAT
===================================================== */

#chat {
  flex: 1;
  padding: 20px 14px;
  padding-bottom: calc(var(--dock-h) + 24px);
}

.message {
  display: flex;
  margin-bottom: 15px;
  scroll-margin-top: calc(var(--header-h) + 10px);
}

.message.user {
  justify-content: flex-end;
}

.bubble {
  max-width: 85%;
  padding: 11px 14px;
  border-radius: 16px;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.message.user .bubble {
  background: linear-gradient(135deg, #743cff, #5020a7);
  border-bottom-right-radius: 5px;
}

.message.assistant .bubble {
  background: rgba(255,255,255,.07);
  border-bottom-left-radius: 5px;
}

/* =====================================================
   IMAGE
===================================================== */

.imageCard {
  width: min(100%, 650px);
  padding: 8px;
  border-radius: 17px;
  background: rgba(255,255,255,.06);
}

.imageCard img {
  width: 100%;
  display: block;
  border-radius: 12px;
}

.imageActions {
  margin-top: 9px;
}

.rerenderButton {
  border: 0;
  padding: 10px 15px;
  border-radius: 11px;
  background: linear-gradient(135deg, #7d43ff, #5521b7);
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.rerenderButton:disabled {
  opacity: .55;
}

/* =====================================================
   DOCK
===================================================== */

.dock {
  position: fixed;
  left: var(--sidebar-w);
  right: 0;
  bottom: 0;
  display: flex;
  justify-content: center;
  padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
  background: linear-gradient(transparent, rgba(8,5,16,.97) 22%);
  z-index: 7;
}

.dockInner {
  width: min(100%, 970px);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* =====================================================
   PROGRESS
===================================================== */

.imageProgress {
  display: none;
  padding: 14px;
  border-radius: 14px;
  background: rgba(36,20,64,.97);
  border: 1px solid rgba(124,60,255,.3);
}

.imageProgress.open {
  display: block;
}

.progressTop {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 8px;
}

.progressSpinner {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  border: 3px solid rgba(255,255,255,.2);
  border-top-color: white;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

.imageProgress.done .progressSpinner {
  display: none;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.progressTitle {
  font-weight: bold;
}

.progressStage {
  font-size: 13px;
  color: #d8ccec;
  margin-bottom: 9px;
}

.progressBar {
  height: 7px;
  background: rgba(255,255,255,.1);
  border-radius: 10px;
  overflow: hidden;
}

.progressFill {
  height: 100%;
  width: 5%;
  background: linear-gradient(90deg,#8b5cff,#c18cff);
  transition: width .7s ease;
}

.imageProgress.closing .progressFill {
  transition: width var(--drain-ms, 1000ms) linear;
  width: 0 !important;
}

.imageProgress.failed {
  border-color: rgba(249,115,22,.6);
}

.imageProgress.failed .progressFill {
  background: #f97316;
}

/* =====================================================
   UPLOAD
===================================================== */

.uploadPreview {
  display: none;
  align-items: flex-start;
  gap: 2px;
  align-self: flex-start;
}

.uploadPreview.open {
  display: flex;
}

.uploadPreview img {
  width: 75px;
  height: 75px;
  object-fit: cover;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,.2);
}

.removePhoto {
  border: 0;
  background: none;
  color: white;
  font-size: 34px;
  line-height: 1;
  padding: 0 10px;
  cursor: pointer;
}

/* =====================================================
   COMPOSER
===================================================== */

.composer {
  display: flex;
  align-items: flex-end;
  gap: 7px;
  padding: 8px;
  border-radius: 16px;
  background: rgba(26,15,47,.97);
  border: 1px solid rgba(255,255,255,.1);
}

.composer.imageMode {
  border-color: rgba(139,92,246,.65);
}

.composer textarea {
  flex: 1;
  min-height: 43px;
  max-height: 140px;
  resize: none;
  padding: 11px;
  border: 0;
  outline: 0;
  background: transparent;
  color: white;
}

.composer textarea::placeholder {
  color: #9b91a9;
}

.actionButton {
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  border: 0;
  border-radius: 11px;
  background: rgba(255,255,255,.08);
  color: white;
  cursor: pointer;
}

.sendButton {
  background: linear-gradient(135deg,#743cff,#5420b5);
}

.actionButton:disabled {
  opacity: .5;
}

/* =====================================================
   MOBILE SIDEBAR
===================================================== */

.sidebarOverlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 25;
}

.sidebarOverlay.open {
  display: block;
}

@media(max-width:700px) {

  .sidebar {
    transform: translateX(-100%);
    transition: transform .25s ease;
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .mainArea {
    margin-left: 0;
  }

  .dock {
    left: 0;
  }

  .menuButton {
    display: block;
  }

  .logo span {
    font-size: 18px;
  }

  .headerButtons button {
    padding: 7px 9px;
  }

  .bubble {
    max-width: 92%;
  }

  #chat {
    padding-left: 9px;
    padding-right: 9px;
  }
}

@media(min-width:701px) {

  .sidebarOverlay {
    display: none !important;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside id="sidebar" class="sidebar">

  <div class="sidebarTop">

    <div class="sidebarLogo">
      <img src="IMG_0471.jpeg" alt="Nastivee AI">
      <span>Nastivee AI</span>
    </div>

    <button
      id="newChatSideButton"
      class="newChatSideButton"
    >
      ＋ New Chat
    </button>

  </div>

  <div
    id="chatHistory"
    class="chatHistory"
  ></div>

  <div class="sidebarBottom">

    <button
      id="sidebarMemoryButton"
      class="sidebarMemoryButton"
    >
      🧠 Memory
    </button>

  </div>

</aside>

<div
  id="sidebarOverlay"
  class="sidebarOverlay"
></div>


<!-- =====================================================
     MAIN
===================================================== -->

<div class="mainArea">

<div class="appInner">

<header>

  <div class="logo">

    <button
      id="menuButton"
      class="headerButtons button menuButton"
      style="border:0;background:transparent;color:white;font-size:22px;"
    >
      ☰
    </button>

    <img
      src="IMG_0471.jpeg"
      alt="Nastivee AI"
    >

    <span>Nastivee AI</span>

  </div>

  <div class="headerButtons">

    <button id="memoryButton">
      🧠 Memory
    </button>

    <button id="newChatButton">
      ＋ New
    </button>

  </div>

</header>


<div
  id="memoryPanel"
  class="memoryPanel"
>

  <div class="memoryTitle">
    Long-term memory
  </div>

  <div
    id="memoryContent"
    class="memoryContent"
  >
    No saved memories yet.
  </div>

</div>


<main id="chat"></main>


<!-- =====================================================
     DOCK
===================================================== -->

<div id="dock" class="dock">

<div class="dockInner">

  <div
    id="uploadPreview"
    class="uploadPreview"
  >

    <img
      id="uploadPreviewImage"
      src=""
      alt="Uploaded image"
    >

    <button
      id="removePhoto"
      class="removePhoto"
      title="Remove photo"
      aria-label="Remove photo"
    >
      ×
    </button>

  </div>


  <div
    id="imageProgress"
    class="imageProgress"
  >

    <div class="progressTop">

      <div class="progressSpinner"></div>

      <div
        id="progressTitle"
        class="progressTitle"
      >
        Creating your image…
      </div>

    </div>

    <div
      id="progressStage"
      class="progressStage"
    >
      Preparing…
    </div>

    <div class="progressBar">

      <div
        id="progressFill"
        class="progressFill"
      ></div>

    </div>

  </div>


  <div
    id="composer"
    class="composer"
  >

    <button
      id="uploadButton"
      class="actionButton"
      title="Upload image"
    >
      📷
    </button>

    <button
      id="imageButton"
      class="actionButton"
      title="Image mode"
    >
      🎨
    </button>

    <textarea
      id="messageInput"
      placeholder="Message Nastivee…"
      rows="1"
    ></textarea>

    <button
      id="sendButton"
      class="actionButton sendButton"
      title="Send"
    >
      ➤
    </button>

    <input
      id="fileInput"
      type="file"
      accept="image/*"
      hidden
    >

  </div>

</div>
</div>

</div>
</div>

<script>

/* =====================================================
   CONFIG
===================================================== */

const API_BASE =
  'https://ai-8vlt.onrender.com';

const OLD_CONVERSATION_KEY =
  'nastivee_conversation_v3';

const CHATS_KEY =
  'nastivee_chats_v1';

const ACTIVE_CHAT_KEY =
  'nastivee_active_chat_v1';

const MEMORY_KEY =
  'nastivee_long_term_memory_v1';


/* =====================================================
   STATE
===================================================== */

let chats = [];
let activeChatId = null;

let conversation = [];
let memory = {};

let imageMode = false;
let selectedPhoto = null;

let chatBusy = false;
let imageBusy = false;

let progressTimer = null;
let progressCloseTimer = null;

let messageCount = 0;

let lastImage = {
  sourceImage: null,
  prompt: '',
  wasEdit: false
};


/* =====================================================
   ELEMENTS
===================================================== */

const chat =
  document.getElementById('chat');

const dock =
  document.getElementById('dock');

const messageInput =
  document.getElementById('messageInput');

const sendButton =
  document.getElementById('sendButton');

const imageButton =
  document.getElementById('imageButton');

const uploadButton =
  document.getElementById('uploadButton');

const fileInput =
  document.getElementById('fileInput');

const composer =
  document.getElementById('composer');

const memoryButton =
  document.getElementById('memoryButton');

const sidebarMemoryButton =
  document.getElementById('sidebarMemoryButton');

const memoryPanel =
  document.getElementById('memoryPanel');

const memoryContent =
  document.getElementById('memoryContent');

const newChatButton =
  document.getElementById('newChatButton');

const newChatSideButton =
  document.getElementById('newChatSideButton');

const imageProgress =
  document.getElementById('imageProgress');

const progressTitle =
  document.getElementById('progressTitle');

const progressStage =
  document.getElementById('progressStage');

const progressFill =
  document.getElementById('progressFill');

const uploadPreview =
  document.getElementById('uploadPreview');

const uploadPreviewImage =
  document.getElementById('uploadPreviewImage');

const removePhoto =
  document.getElementById('removePhoto');

const sidebar =
  document.getElementById('sidebar');

const sidebarOverlay =
  document.getElementById('sidebarOverlay');

const menuButton =
  document.getElementById('menuButton');

const chatHistory =
  document.getElementById('chatHistory');


/* =====================================================
   DOCK HEIGHT
===================================================== */

function updateDockHeight() {

  document.documentElement.style.setProperty(
    '--dock-h',
    `${dock.offsetHeight}px`
  );

}

if ('ResizeObserver' in window) {

  new ResizeObserver(
    updateDockHeight
  ).observe(dock);

}

window.addEventListener(
  'resize',
  updateDockHeight
);


/* =====================================================
   CHAT STORAGE
===================================================== */

function createChat(title = 'New chat') {

  return {
    id:
      `chat_${Date.now()}_${Math.random()
        .toString(36)
        .slice(2, 8)}`,

    title,

    createdAt:
      Date.now(),

    updatedAt:
      Date.now(),

    messages: []
  };

}


function saveChats() {

  try {

    localStorage.setItem(
      CHATS_KEY,
      JSON.stringify(chats)
    );

    localStorage.setItem(
      ACTIVE_CHAT_KEY,
      activeChatId || ''
    );

  } catch (error) {

    console.warn(
      'Could not save chats:',
      error
    );

  }

}


function loadChats() {

  try {

    const stored =
      localStorage.getItem(CHATS_KEY);

    if (stored) {

      chats =
        JSON.parse(stored);

    }

  } catch {

    chats = [];

  }


  /*
     Migrate the old single conversation
     into the new chat system.
  */

  if (!chats.length) {

    let oldConversation = [];

    try {

      oldConversation =
        JSON.parse(
          localStorage.getItem(
            OLD_CONVERSATION_KEY
          )
        ) || [];

    } catch {

      oldConversation = [];

    }


    if (oldConversation.length) {

      const migrated =
        createChat(
          makeChatTitle(oldConversation)
        );

      migrated.messages =
        oldConversation;

      chats.push(migrated);

    } else {

      chats.push(
        createChat('New chat')
      );

    }

    saveChats();

  }


  activeChatId =
    localStorage.getItem(
      ACTIVE_CHAT_KEY
    );


  if (
    !activeChatId ||
    !chats.some(
      chat => chat.id === activeChatId
    )
  ) {

    activeChatId =
      chats[0].id;

    saveChats();

  }

}


/* =====================================================
   CHAT TITLE
===================================================== */

function makeChatTitle(messages) {

  const firstUserMessage =
    messages.find(
      message =>
        message.role === 'user' &&
        typeof message.content === 'string'
    );

  if (!firstUserMessage) {
    return 'New chat';
  }

  let title =
    firstUserMessage.content
      .replace(/\s+/g, ' ')
      .trim();

  if (!title) {
    return 'New chat';
  }

  if (title.length > 32) {
    title =
      title.substring(0, 32).trim() + '…';
  }

  return title;

}


function updateChatTitle() {

  const current =
    getActiveChat();

  if (!current) return;

  const title =
    makeChatTitle(
      current.messages
    );

  if (title !== 'New chat') {

    current.title =
      title;

  }

}


/* =====================================================
   ACTIVE CHAT
===================================================== */

function getActiveChat() {

  return chats.find(
    chat =>
      chat.id === activeChatId
  );

}


function saveActiveConversation() {

  const current =
    getActiveChat();

  if (!current) return;

  current.messages =
    conversation;

  current.updatedAt =
    Date.now();

  updateChatTitle();

  saveChats();

  renderChatHistory();

}


/* =====================================================
   LOAD CHAT
===================================================== */

function openChat(id) {

  if (chatBusy || imageBusy) {
    return;
  }

  const selected =
    chats.find(
      chat => chat.id === id
    );

  if (!selected) return;

  activeChatId =
    id;

  conversation =
    selected.messages || [];

  messageCount =
    0;

  selectedPhoto =
    null;

  fileInput.value =
    '';

  uploadPreview.classList.remove(
    'open'
  );

  lastImage = {
    sourceImage: null,
    prompt: '',
    wasEdit: false
  };

  setImageMode(false);

  chat.innerHTML = '';

  restoreConversation();

  saveChats();

  renderChatHistory();

  closeSidebar();

}


function createNewChat() {

  if (chatBusy || imageBusy) {
    return;
  }

  const newChat =
    createChat();

  chats.unshift(
    newChat
  );

  activeChatId =
    newChat.id;

  conversation =
    [];

  messageCount =
    0;

  selectedPhoto =
    null;

  fileInput.value =
    '';

  uploadPreview.classList.remove(
    'open'
  );

  lastImage = {
    sourceImage: null,
    prompt: '',
    wasEdit: false
  };

  setImageMode(false);

  chat.innerHTML = '';

  addMessage(
    'assistant',
    'Hi 👋 I’m Nastivee. What would you like to do?',
    { silent: true }
  );

  saveActiveConversation();

  renderChatHistory();

  closeSidebar();

}


/* =====================================================
   DELETE CHAT
===================================================== */

function deleteChat(id, event) {

  event.stopPropagation();

  if (chats.length === 1) {

    chats[0] =
      createChat();

    activeChatId =
      chats[0].id;

    conversation =
      [];

    chat.innerHTML = '';

    messageCount =
      0;

    addMessage(
      'assistant',
      'Hi 👋 I’m Nastivee. What would you like to do?',
      { silent: true }
    );

  } else {

    chats =
      chats.filter(
        item =>
          item.id !== id
      );

    if (activeChatId === id) {

      activeChatId =
        chats[0].id;

      conversation =
        chats[0].messages || [];

      chat.innerHTML = '';

      messageCount =
        0;

      restoreConversation();

    }

  }

  saveChats();

  renderChatHistory();

}


/* =====================================================
   RENDER SIDEBAR
===================================================== */

function renderChatHistory() {

  chatHistory.innerHTML = '';

  if (!chats.length) {
    return;
  }

  const sorted =
    [...chats].sort(
      (a, b) =>
        b.updatedAt - a.updatedAt
    );


  const label =
    document.createElement('div');

  label.className =
    'historyLabel';

  label.textContent =
    'Chats';

  chatHistory.appendChild(
    label
  );


  sorted.forEach(
    item => {

      const row =
        document.createElement('div');

      row.className =
        'chatItem';

      if (
        item.id === activeChatId
      ) {

        row.classList.add(
          'active'
        );

      }


      const icon =
        document.createElement('span');

      icon.textContent =
        '💬';


      const title =
        document.createElement('div');

      title.className =
        'chatItemTitle';

      title.textContent =
        item.title ||
        'New chat';


      const deleteButton =
        document.createElement('button');

      deleteButton.className =
        'deleteChat';

      deleteButton.textContent =
        '×';

      deleteButton.title =
        'Delete chat';

      deleteButton.addEventListener(
        'click',
        event =>
          deleteChat(
            item.id,
            event
          )
      );


      row.appendChild(icon);
      row.appendChild(title);
      row.appendChild(deleteButton);


      row.addEventListener(
        'click',
        () =>
          openChat(item.id)
      );


      chatHistory.appendChild(
        row
      );

    }
  );

}


/* =====================================================
   LOAD MEMORY
===================================================== */

try {

  memory =
    JSON.parse(
      localStorage.getItem(
        MEMORY_KEY
      )
    ) || {};

} catch {

  memory = {};

}


/* =====================================================
   MEMORY STORAGE
===================================================== */

function saveMemory() {

  try {

    localStorage.setItem(
      MEMORY_KEY,
      JSON.stringify(memory)
    );

  } catch {}

}


/* =====================================================
   MEMORY
===================================================== */

function extractMemory(text) {

  if (!text) return;

  let match;


  match =
    text.match(
      /my\s+(?:dog|dogs|puppy)(?:'s)?\s+(?:name\s+is|is\s+called|is\s+named)\s+([A-Za-z][A-Za-z0-9_-]{1,30})/i
    );

  if (match) {

    memory.dogName =
      match[1];

  }


  match =
    text.match(
      /my\s+name\s+is\s+([A-Za-z][A-Za-z0-9_-]{1,30})/i
    );

  if (match) {

    memory.userName =
      match[1];

  }


  match =
    text.match(
      /(?:my\s+dog|my\s+puppy)\s+is\s+a\s+([A-Za-z][A-Za-z -]{2,30})/i
    );

  if (match) {

    memory.dogBreed =
      match[1].trim();

  }


  saveMemory();
  renderMemory();

}


function renderMemory() {

  const entries = [];


  if (memory.userName) {

    entries.push(
      `Your name: ${memory.userName}`
    );

  }


  if (memory.dogName) {

    entries.push(
      `Dog's name: ${memory.dogName}`
    );

  }


  if (memory.dogBreed) {

    entries.push(
      `Dog breed: ${memory.dogBreed}`
    );

  }


  if (memory.favourites) {

    entries.push(
      `Favourites: ${memory.favourites}`
    );

  }


  memoryContent.textContent =
    entries.length
      ? entries.join('\n')
      : 'No saved memories yet.';

}


/* =====================================================
   API
===================================================== */

async function apiFetch(
  path,
  options = {}
) {

  const response =
    await fetch(
      `${API_BASE}${path}`,
      {
        ...options,

        headers: {
          'Content-Type':
            'application/json',

          ...(options.headers || {})
        }
      }
    );


  const text =
    await response.text();


  let data;


  try {

    data =
      text
        ? JSON.parse(text)
        : {};

  } catch {

    throw new Error(
      text ||
      `Server returned HTTP ${response.status}`
    );

  }


  if (!response.ok) {

    throw new Error(
      data.details ||
      data.error ||
      `HTTP ${response.status}`
    );

  }


  return data;

}


/* =====================================================
   MESSAGE WRAPPER
===================================================== */

function createMessageWrapper(role) {

  const wrapper =
    document.createElement('div');

  messageCount++;

  wrapper.id =
    `msg-${messageCount}`;

  wrapper.className =
    `message ${role}`;

  return wrapper;

}


/* =====================================================
   CHAT MESSAGE
===================================================== */

function addMessage(
  role,
  content,
  options = {}
) {

  const wrapper =
    createMessageWrapper(role);


  const bubble =
    document.createElement('div');

  bubble.className =
    'bubble';

  bubble.textContent =
    content;


  wrapper.appendChild(
    bubble
  );

  chat.appendChild(
    wrapper
  );


  if (!options.silent) {

    showMessage(
      wrapper
    );

  }


  return wrapper;

}


/* =====================================================
   IMAGE MESSAGE
===================================================== */

function addImageMessage(
  imageUrl,
  sourceImage,
  prompt,
  wasEdit,
  options = {}
) {

  const wrapper =
    createMessageWrapper(
      'assistant'
    );


  const card =
    document.createElement('div');

  card.className =
    'imageCard';


  const img =
    document.createElement('img');

  img.src =
    imageUrl;

  img.alt =
    'Nastivee AI image';


  const actions =
    document.createElement('div');

  actions.className =
    'imageActions';


  const button =
    document.createElement('button');

  button.className =
    'rerenderButton';

  button.textContent =
    '🔄 Re-render';


  button.addEventListener(
    'click',
    () => {

      rerenderImage(
        button,
        sourceImage,
        prompt,
        wasEdit
      );

    }
  );


  if (
    wasEdit &&
    !sourceImage
  ) {

    button.disabled =
      true;

    button.title =
      'Upload the original image again to re-render';

  }


  actions.appendChild(
    button
  );

  card.appendChild(
    img
  );

  card.appendChild(
    actions
  );

  wrapper.appendChild(
    card
  );

  chat.appendChild(
    wrapper
  );


  if (!options.silent) {

    showMessage(
      wrapper
    );

    img.addEventListener(
      'load',
      () =>
        showMessage(wrapper),
      { once: true }
    );

  }


  return wrapper;

}


/* =====================================================
   SCROLL
===================================================== */

function showMessage(element) {

  requestAnimationFrame(
    () => {

      element.scrollIntoView({
        block: 'start',
        behavior: 'smooth'
      });

    }
  );

}


function scrollToBottom() {

  requestAnimationFrame(
    () => {

      window.scrollTo(
        0,
        document.documentElement
          .scrollHeight
      );

    }
  );

}


/* =====================================================
   PROGRESS
===================================================== */

function startImageProgress(
  isRerender
) {

  clearInterval(
    progressTimer
  );

  clearTimeout(
    progressCloseTimer
  );


  imageProgress.classList.remove(
    'closing',
    'done',
    'failed'
  );

  imageProgress.classList.add(
    'open'
  );


  progressTitle.textContent =
    isRerender
      ? 'Re-rendering your image…'
      : 'Creating your image…';


  const stages =
    isRerender

      ? [
          [
            'Preparing your original photo…',
            8
          ],

          [
            'Using your original photo for likeness…',
            25
          ],

          [
            'Reworking your original request…',
            45
          ],

          [
            'Creating a fresh variation…',
            68
          ],

          [
            'Finishing the new image…',
            88
          ]
        ]

      : [
          [
            'Preparing your request…',
            10
          ],

          [
            'Understanding your image instructions…',
            28
          ],

          [
            'Creating your image…',
            58
          ],

          [
            'Finishing the image…',
            85
          ]
        ];


  let index =
    0;


  progressStage.textContent =
    stages[0][0];

  progressFill.style.width =
    `${stages[0][1]}%`;


  progressTimer =
    setInterval(
      () => {

        index++;


        if (
          index >=
          stages.length
        ) {

          clearInterval(
            progressTimer
          );

          return;

        }


        progressStage.textContent =
          stages[index][0];

        progressFill.style.width =
          `${stages[index][1]}%`;

      },
      1600
    );

}


function closeProgressAfter(ms) {

  clearTimeout(
    progressCloseTimer
  );


  imageProgress.style.setProperty(
    '--drain-ms',
    `${ms}ms`
  );


  requestAnimationFrame(
    () => {

      requestAnimationFrame(
        () => {

          imageProgress.classList.add(
            'closing'
          );

        }
      );

    }
  );


  progressCloseTimer =
    setTimeout(
      () => {

        imageProgress.classList.remove(
          'open',
          'closing',
          'done',
          'failed'
        );

        progressFill.style.width =
          '5%';

      },
      ms
    );

}


function finishImageProgress() {

  clearInterval(
    progressTimer
  );

  imageProgress.classList.add(
    'done'
  );

  progressStage.textContent =
    'Done ✓';

  progressFill.style.width =
    '100%';

  closeProgressAfter(
    1200
  );

}


function failImageProgress() {

  clearInterval(
    progressTimer
  );

  imageProgress.classList.add(
    'done',
    'failed'
  );

  progressStage.textContent =
    'Something went wrong.';

  progressFill.style.width =
    '100%';

  closeProgressAfter(
    2000
  );

}


/* =====================================================
   CHAT HISTORY FOR API
===================================================== */

function chatHistoryForApi() {

  return conversation

    .filter(
      message =>
        message.type !== 'image' &&
        typeof message.content === 'string'
    )

    .slice(-30)

    .map(
      message => ({
        role:
          message.role,

        content:
          message.content
      })
    );

}


/* =====================================================
   NORMAL CHAT
===================================================== */

async function sendMessage() {

  const text =
    messageInput.value.trim();


  if (!text) return;

  if (
    chatBusy ||
    imageBusy
  ) return;


  if (imageMode) {

    messageInput.value =
      '';

    resizeInput();

    await createImage(
      text
    );

    return;

  }


  chatBusy =
    true;

  sendButton.disabled =
    true;


  addMessage(
    'user',
    text
  );


  conversation.push({
    role:
      'user',

    content:
      text
  });


  extractMemory(
    text
  );


  messageInput.value =
    '';

  resizeInput();


  saveActiveConversation();


  const thinking =
    createMessageWrapper(
      'assistant'
    );


  const thinkingBubble =
    document.createElement(
      'div'
    );

  thinkingBubble.className =
    'bubble';

  thinkingBubble.textContent =
    'Nastivee is thinking…';


  thinking.appendChild(
    thinkingBubble
  );

  chat.appendChild(
    thinking
  );


  try {

    const data =
      await apiFetch(
        '/api/chat',
        {
          method:
            'POST',

          body:
            JSON.stringify({
              messages:
                chatHistoryForApi(),

              memory
            })
        }
      );


    thinking.remove();


    addMessage(
      'assistant',
      data.reply
    );


    conversation.push({
      role:
        'assistant',

      content:
        data.reply
    });


    saveActiveConversation();


  } catch (error) {

    thinking.remove();


    addMessage(
      'assistant',
      `Sorry, something went wrong: ${error.message}`
    );

  } finally {

    chatBusy =
      false;

    sendButton.disabled =
      false;

  }

}


/* =====================================================
   CREATE IMAGE
===================================================== */

async function createImage(
  prompt
) {

  if (imageBusy) return;


  imageBusy =
    true;

  sendButton.disabled =
    true;


  const wasEdit =
    !!selectedPhoto;


  const sourceImage =
    selectedPhoto;


  const originalPrompt =
    prompt;


  addMessage(
    'user',
    prompt
  );


  conversation.push({
    role:
      'user',

    content:
      prompt
  });


  saveActiveConversation();


  startImageProgress(
    false
  );


  try {

    let data;


    if (wasEdit) {

      data =
        await apiFetch(
          '/api/image/edit',
          {
            method:
              'POST',

            body:
              JSON.stringify({
                prompt:
                  originalPrompt,

                image:
                  sourceImage,

                regenerate:
                  false
              })
          }
        );

    } else {

      data =
        await apiFetch(
          '/api/image',
          {
            method:
              'POST',

            body:
              JSON.stringify({
                prompt:
                  originalPrompt,

                regenerate:
                  false
              })
          }
        );

    }


    finishImageProgress();


    lastImage = {
      sourceImage,
      prompt:
        originalPrompt,
      wasEdit
    };


    addImageMessage(
      data.image,
      sourceImage,
      originalPrompt,
      wasEdit
    );


    conversation.push({
      role:
        'assistant',

      type:
        'image',

      content:
        data.image
    });


    saveActiveConversation();


  } catch (error) {

    failImageProgress();


    addMessage(
      'assistant',
      `Image generation failed: ${error.message}`
    );

  } finally {

    imageBusy =
      false;

    sendButton.disabled =
      false;

  }

}


/* =====================================================
   RE-RENDER
===================================================== */

async function rerenderImage(
  button,
  sourceImage,
  originalPrompt,
  wasEdit
) {

  if (imageBusy) return;


  if (
    wasEdit &&
    !sourceImage
  ) {

    addMessage(
      'assistant',
      'Please upload the original photo again before re-rendering.'
    );

    return;

  }


  imageBusy =
    true;

  button.disabled =
    true;

  button.textContent =
    '⏳ Re-rendering…';


  startImageProgress(
    true
  );


  try {

    let data;


    if (wasEdit) {

      data =
        await apiFetch(
          '/api/image/edit',
          {
            method:
              'POST',

            body:
              JSON.stringify({
                prompt:
                  originalPrompt,

                image:
                  sourceImage,

                regenerate:
                  true
              })
          }
        );

    } else {

      data =
        await apiFetch(
          '/api/image',
          {
            method:
              'POST',

            body:
              JSON.stringify({
                prompt:
                  originalPrompt,

                regenerate:
                  true
              })
          }
        );

    }


    finishImageProgress();


    lastImage = {
      sourceImage,
      prompt:
        originalPrompt,
      wasEdit
    };


    addImageMessage(
      data.image,
      sourceImage,
      originalPrompt,
      wasEdit
    );


    conversation.push({
      role:
        'assistant',

      type:
        'image',

      content:
        data.image
    });


    saveActiveConversation();


  } catch (error) {

    failImageProgress();


    addMessage(
      'assistant',
      `Re-render failed: ${error.message}`
    );

  } finally {

    imageBusy =
      false;

    button.disabled =
      false;

    button.textContent =
      '🔄 Re-render';

  }

}


/* =====================================================
   IMAGE MODE
===================================================== */

function setImageMode(
  enabled
) {

  imageMode =
    enabled;


  if (imageMode) {

    composer.classList.add(
      'imageMode'
    );

    imageButton.textContent =
      '🖼️';

    messageInput.placeholder =
      selectedPhoto
        ? 'Describe what you want changed…'
        : 'Describe the image you want…';

  } else {

    composer.classList.remove(
      'imageMode'
    );

    imageButton.textContent =
      '🎨';

    messageInput.placeholder =
      'Message Nastivee…';

  }

}


imageButton.addEventListener(
  'click',
  () => {

    setImageMode(
      !imageMode
    );

  }
);


/* =====================================================
   UPLOAD
===================================================== */

uploadButton.addEventListener(
  'click',
  () => {

    fileInput.click();

  }
);


fileInput.addEventListener(
  'change',
  () => {

    const file =
      fileInput.files?.[0];


    if (!file) return;


    const reader =
      new FileReader();


    reader.onload =
      () => {

        selectedPhoto =
          reader.result;


        setImageMode(
          true
        );


        uploadPreviewImage.src =
          selectedPhoto;


        uploadPreview.classList.add(
          'open'
        );


        messageInput.placeholder =
          'Describe what you want changed…';

      };


    reader.readAsDataURL(
      file
    );

  }
);


/* =====================================================
   REMOVE PHOTO
===================================================== */

removePhoto.addEventListener(
  'click',
  () => {

    selectedPhoto =
      null;

    fileInput.value =
      '';

    uploadPreview.classList.remove(
      'open'
    );


    messageInput.placeholder =
      imageMode
        ? 'Describe the image you want…'
        : 'Message Nastivee…';

  }
);

   TEXTAREA RESIZE
===================================================== */

    'auto';

  messageInput.style.height =
    `${Math.min(
      messageInput.scrollHeight,
      140
    )}px`;

}


messageInput.addEventListener(
  'input',
  resizeInput
);


/* =====================================================
   RESTORE CONVERSATION
===================================================== */

function restoreConversation() {

  if (!conversation.length) {

    addMessage(
      'assistant',
      'Hi 👋 I’m Nastivee. What would you like to do?',
      { silent: true }
    );

    return;

  }


  conversation.forEach(
    message => {

      if (
        message.type === 'image'
      ) {

        addImageMessage(
          message.content,
          null,
          '',
          false,
          {
            silent:
              true
          }
        );

      } else {

        addMessage(
          message.role === 'user'
            ? 'user'
            : 'assistant',

          message.content,

          {
            silent:
              true
          }
        );

      }

    }
  );


  scrollToBottom();

}

  getActiveChat();


if (active) {

  conversation =
    active.messages || [];

}


renderChatHistory();

renderMemory();

restoreConversation();

updateDockHeight();
