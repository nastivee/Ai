<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nastivee AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#10081d;
  --panel:#180d29;
  --panel2:#211139;
  --purple:#8b5cf6;
  --purple2:#a78bfa;
  --text:#f7f2ff;
  --muted:#aaa0bd;
  --border:rgba(255,255,255,.09);
  --dock-h:100px;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}


/* =========================
   AUTH
========================= */

.authScreen{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 50% 15%,rgba(139,92,246,.22),transparent 38%),
    var(--bg);
}

.authCard{
  width:100%;
  max-width:420px;
  padding:34px 28px 30px;
  border:1px solid var(--border);
  border-radius:24px;
  background:rgba(24,13,41,.96);
  box-shadow:0 25px 80px rgba(0,0,0,.45);
}

.authLogo{
  display:flex;
  justify-content:center;
  margin-bottom:18px;
}

.authLogo img{
  width:76px;
  height:76px;
  object-fit:contain;
  border-radius:18px;
}

.authTitle{
  text-align:center;
  font-size:25px;
  font-weight:800;
}

.authSubtitle{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  margin:8px 0 22px;
  line-height:1.5;
}

.authError{
  display:none;
  margin-bottom:15px;
  padding:11px 13px;
  border-radius:12px;
  background:rgba(239,68,68,.13);
  border:1px solid rgba(239,68,68,.35);
  color:#ff9b9b;
  font-size:14px;
  line-height:1.4;
}

.authError.open{
  display:block;
}

.authField{
  margin-bottom:15px;
}

.authField label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  color:#d8d0e3;
}

.authField input{
  width:100%;
  height:50px;
  padding:0 15px;
  border:1px solid var(--border);
  border-radius:13px;
  outline:none;
  background:#10081d;
  color:white;
}

.authField input:focus{
  border-color:var(--purple);
  box-shadow:0 0 0 3px rgba(139,92,246,.12);
}

.authButton{
  width:100%;
  height:50px;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,#8b5cf6,#6d3eea);
  color:white;
  font-weight:700;
}

.authButton:disabled{
  opacity:.65;
  cursor:not-allowed;
}

.authSwitch{
  margin-top:18px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
}

.authSwitch button{
  border:0;
  background:none;
  color:var(--purple2);
  font-weight:700;
}


/* =========================
   APP
========================= */

#app{
  min-height:100vh;
}

.sidebar{
  position:fixed;
  top:0;
  left:0;
  bottom:0;
  width:275px;
  z-index:1000;
  display:flex;
  flex-direction:column;
  padding:16px;
  background:#130a20;
  border-right:1px solid var(--border);
  transition:transform .25s ease;
}

.sidebarTop{
  flex:1;
  min-height:0;
}

.sidebarLogo{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 5px 20px;
  font-weight:800;
  font-size:19px;
}

.sidebarLogo img{
  width:37px;
  height:37px;
  object-fit:contain;
  border-radius:10px;
}

.newChatSideButton{
  width:100%;
  padding:12px 14px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--panel2);
  color:white;
  text-align:left;
  font-weight:700;
}

.newChatSideButton:hover{
  background:#2b1747;
}

.chatHistory{
  overflow-y:auto;
  margin-top:18px;
  padding-bottom:10px;
}

.historyLabel{
  padding:0 9px 8px;
  color:#81768f;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.chatItem{
  display:flex;
  align-items:center;
  gap:9px;
  min-height:44px;
  padding:8px 9px;
  margin-bottom:4px;
  border-radius:10px;
  color:#dcd4e8;
  cursor:pointer;
}

.chatItem:hover,
.chatItem.active{
  background:#26143d;
}

.chatItemTitle{
  flex:1;
  min-width:0;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:14px;
}

.deleteChat{
  flex:none;
  border:0;
  background:none;
  color:#786d87;
  font-size:20px;
  padding:0 3px;
}

.deleteChat:hover{
  color:#ff8e8e;
}

.sidebarBottom{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding-top:12px;
  border-top:1px solid var(--border);
}

.sidebarMemoryButton,
.logoutButton{
  width:100%;
  padding:11px 12px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#cfc5dc;
  text-align:left;
}

.sidebarMemoryButton:hover,
.logoutButton:hover{
  background:#26143d;
}

.mainArea{
  margin-left:275px;
  min-height:100vh;
}

.appInner{
  min-height:100vh;
}

header{
  position:sticky;
  top:0;
  z-index:50;
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:rgba(16,8,29,.9);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--border);
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:bold;
}

.logo img{
  width:42px;
  height:42px;
  object-fit:contain;
  border-radius:10px;
}

.headerButtons{
  display:flex;
  gap:8px;
}

.headerButtons button,
#menuButton{
  border:1px solid var(--border);
  border-radius:10px;
  padding:8px 12px;
  background:#1d1030;
  color:white;
}

#menuButton{
  display:none;
}

.memoryPanel{
  display:none;
  margin:15px auto;
  max-width:850px;
  padding:15px;
  border:1px solid var(--border);
  border-radius:15px;
  background:var(--panel);
}

.memoryPanel.open{
  display:block;
}

.memoryContent{
  white-space:pre-wrap;
  color:#cbc1d5;
  font-size:14px;
  line-height:1.6;
}

#chat{
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding:25px 20px calc(var(--dock-h) + 30px);
}

.message{
  display:flex;
  margin:0 0 18px;
}

.message.user{
  justify-content:flex-end;
}

.bubble{
  max-width:min(78%,700px);
  padding:12px 15px;
  border-radius:17px;
  line-height:1.55;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.message.assistant .bubble{
  background:#211139;
  border:1px solid var(--border);
}

.message.user .bubble{
  background:linear-gradient(135deg,#7546df,#6133c5);
}


/* =========================
   IMAGES
========================= */

.imageCard{
  max-width:700px;
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:18px;
  background:#180d29;
}

.imageCard img{
  display:block;
  width:100%;
  max-height:750px;
  object-fit:contain;
  background:#08050d;
}

.imageActions{
  padding:10px;
}

.rerenderButton{
  width:100%;
  padding:10px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#261441;
  color:white;
  font-weight:650;
}

.rerenderButton:hover{
  background:#332052;
}

.rerenderButton:disabled{
  opacity:.55;
  cursor:not-allowed;
}


/* =========================
   DOCK
========================= */

.dock{
  position:fixed;
  left:275px;
  right:0;
  bottom:0;
  z-index:100;
  padding:10px 18px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(
    to top,
    rgba(16,8,29,1) 55%,
    rgba(16,8,29,.88)
  );
  backdrop-filter:blur(14px);
}

.dockInner{
  max-width:900px;
  margin:auto;
}

.uploadPreview{
  display:none;
  align-items:center;
  gap:10px;
  width:max-content;
  max-width:100%;
  margin-bottom:8px;
  padding:7px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#1d1030;
}

.uploadPreview.open{
  display:flex;
}

.uploadPreviewImage{
  width:55px;
  height:55px;
  border-radius:8px;
  object-fit:cover;
}

.removePhoto{
  border:0;
  background:none;
  color:#ff9696;
  font-size:20px;
}

.composer{
  display:flex;
  align-items:flex-end;
  gap:7px;
  padding:7px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:17px;
  background:#1b0e2b;
  box-shadow:0 10px 35px rgba(0,0,0,.3);
}

.composer button{
  flex:none;
}

.uploadButton,
.imageButton,
.sendButton{
  width:40px;
  height:40px;
  border:0;
  border-radius:11px;
  background:#291642;
  color:white;
}

.sendButton{
  background:linear-gradient(135deg,#8b5cf6,#6736d0);
}

.sendButton:disabled{
  opacity:.5;
}

.messageInput{
  flex:1;
  min-width:0;
  max-height:140px;
  min-height:40px;
  padding:10px 8px;
  resize:none;
  outline:none;
  border:0;
  background:transparent;
  color:white;
  line-height:20px;
}

.messageInput::placeholder{
  color:#82778e;
}

#fileInput{
  display:none;
}


/* =========================
   PROGRESS
========================= */

.imageProgress{
  display:none;
  max-width:900px;
  margin:0 auto 9px;
  padding:11px 13px;
  border:1px solid rgba(139,92,246,.28);
  border-radius:13px;
  background:#1b0e2b;
}

.imageProgress.open{
  display:block;
}

.progressTitle{
  font-size:13px;
  font-weight:700;
}

.progressStage{
  margin-top:3px;
  color:#a99db8;
  font-size:12px;
}

.progressFillWrap{
  height:5px;
  margin-top:9px;
  overflow:hidden;
  border-radius:99px;
  background:#30203f;
}

.progressFill{
  width:5%;
  height:100%;
  border-radius:99px;
  background:linear-gradient(
    90deg,
    #7c3aed,
    #a78bfa
  );
  transition:width .5s ease;
}


/* =========================
   OVERLAY
========================= */

.sidebarOverlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:900;
  background:rgba(0,0,0,.55);
}

.sidebarOverlay.open{
  display:block;
}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .sidebar{
    transform:translateX(-100%);
    width:285px;
    box-shadow:20px 0 50px rgba(0,0,0,.35);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .mainArea{
    margin-left:0;
  }

  .dock{
    left:0;
  }

  #menuButton{
    display:block;
    margin-right:4px;
  }

  header{
    padding:0 12px;
    gap:8px;
  }

  header .logo{
    font-size:17px;
    flex:1;
  }

  header .logo img{
    width:36px;
    height:36px;
  }

  .headerButtons button{
    padding:8px 9px;
  }

  #memoryButton{
    display:none;
  }

  #chat{
    padding-left:12px;
    padding-right:12px;
  }

  .bubble{
    max-width:88%;
  }

  .imageCard{
    width:100%;
  }

  .authCard{
    padding:28px 20px;
  }

}

</style>
</head>

<body>

<!-- =================================================
     AUTH SCREEN
================================================= -->

<div id="authScreen" class="authScreen">

  <div class="authCard">

    <div class="authLogo">

        src="IMG_0471.jpeg"

<!-- =================================================

        <div class="logo">

          <img

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  'https://fzwqunpnohgwgwikumkt.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_kNUxEr43Kp5qVC4Evxgz0A_iCTLw7GB';

let supabaseClient = null;


/* =====================================================
   CONFIG
===================================================== */

const API_BASE =
  'https://ai-8vlt.onrender.com';

const OLD_CONVERSATION_KEY =
  'nastivee_conversation_v3';

const CHATS_KEY =
  'nastivee_chats_v1';

const ACTIVE_CHAT_KEY =
  'nastivee_active_chat_v1';

const MEMORY_KEY =
  'nastivee_long_term_memory_v1';


/* =====================================================
   SUPABASE INITIALISE
===================================================== */

if (
  window.supabase &&
  typeof window.supabase.createClient === 'function'
) {

  supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

}


/* =====================================================
   STATE
===================================================== */

let chats = [];
let activeChatId = null;
let conversation = [];

let memory = {};

let imageMode = false;
let selectedPhoto = null;

let chatBusy = false;
let imageBusy = false;

let progressTimer = null;
let progressCloseTimer = null;

let messageCount = 0;

let currentUser = null;
let authMode = 'login';

let cloudSyncBusy = false;
let userInitialising = false;


/* =====================================================
   ELEMENTS
===================================================== */

const authScreen =
  document.getElementById('authScreen');

const authTitle =
  document.getElementById('authTitle');

const authSubtitle =
  document.getElementById('authSubtitle');

const authEmail =
  document.getElementById('authEmail');

const authPassword =
  document.getElementById('authPassword');

const authSubmit =
  document.getElementById('authSubmit');

const authSwitchButton =
  document.getElementById('authSwitchButton');

const authSwitchText =
  document.getElementById('authSwitchText');

const authError =
  document.getElementById('authError');

const logoutButton =
  document.getElementById('logoutButton');

const chat =
  document.getElementById('chat');

const dock =
  document.getElementById('dock');

const messageInput =
  document.getElementById('messageInput');

const sendButton =
  document.getElementById('sendButton');

const imageButton =
  document.getElementById('imageButton');

const uploadButton =
  document.getElementById('uploadButton');

const fileInput =
  document.getElementById('fileInput');

const composer =
  document.getElementById('composer');

const memoryButton =
  document.getElementById('memoryButton');

const sidebarMemoryButton =
  document.getElementById('sidebarMemoryButton');

const memoryPanel =
  document.getElementById('memoryPanel');

const memoryContent =
  document.getElementById('memoryContent');

const newChatButton =
  document.getElementById('newChatButton');

const newChatSideButton =
  document.getElementById('newChatSideButton');

const imageProgress =
  document.getElementById('imageProgress');

const progressTitle =
  document.getElementById('progressTitle');

const progressStage =
  document.getElementById('progressStage');

const progressFill =
  document.getElementById('progressFill');

const uploadPreview =
  document.getElementById('uploadPreview');

const uploadPreviewImage =
  document.getElementById('uploadPreviewImage');

const removePhoto =
  document.getElementById('removePhoto');

const sidebar =
  document.getElementById('sidebar');

const sidebarOverlay =
  document.getElementById('sidebarOverlay');

const menuButton =
  document.getElementById('menuButton');

const chatHistory =
  document.getElementById('chatHistory');


/* =====================================================
   AUTH ERROR
===================================================== */

function showAuthError(message){

  authError.textContent =
    message || 'Something went wrong.';

  authError.classList.add('open');

}


function clearAuthError(){

  authError.textContent = '';

  authError.classList.remove('open');

}


/* =====================================================
   AUTH MODE
===================================================== */

function updateAuthMode(
  clearError = true
){

  if(clearError){
    clearAuthError();
  }

  if(authMode === 'login'){

    authTitle.textContent =
      'Welcome to Nastivee';

    authSubtitle.textContent =
      'Sign in to save your chats and memory.';

    authSubmit.textContent =
      'Log in';

    authSwitchText.textContent =
      "Don't have an account?";

    authSwitchButton.textContent =
      'Sign up';

    authPassword.autocomplete =
      'current-password';

  }else{

    authTitle.textContent =
      'Create your Nastivee account';

    authSubtitle.textContent =
      'Create an account to save your chats in the cloud.';

    authSubmit.textContent =
      'Create account';

    authSwitchText.textContent =
      'Already have an account?';

    authSwitchButton.textContent =
      'Log in';

    authPassword.autocomplete =
      'new-password';

  }

}


/* =====================================================
   AUTH SWITCH
===================================================== */

authSwitchButton.addEventListener(
  'click',
  function(){

    authMode =
      authMode === 'login'
        ? 'signup'
        : 'login';

    updateAuthMode();

  }
);


/* =====================================================
   AUTH SUBMIT
===================================================== */

async function handleAuthSubmit(){

  clearAuthError();

  if(!supabaseClient){

    showAuthError(
      'Nastivee could not load its login service. Please refresh the page.'
    );

    return;

  }


  const email =
    authEmail.value.trim();

  const password =
    authPassword.value;


  if(!email || !password){

    showAuthError(
      'Please enter your email and password.'
    );

    return;

  }


  if(password.length < 6){

    showAuthError(
      'Your password must be at least 6 characters.'
    );

    return;

  }


  authSubmit.disabled = true;

  authSubmit.textContent =
    authMode === 'login'
      ? 'Logging in…'
      : 'Creating account…';


  try{

    if(authMode === 'login'){

      const result =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });


      if(result.error){
        throw result.error;
      }


      if(!result.data?.session){

        throw new Error(
          'Login succeeded but no session was returned. Please try again.'
        );

      }


      currentUser =
        result.data.user;


      await initialiseUser(
        currentUser
      );


    }else{

      const result =
        await supabaseClient.auth.signUp({
          email,
          password
        });


      if(result.error){
        throw result.error;
      }


      if(result.data?.session){

        currentUser =
          result.data.user;

        await initialiseUser(
          currentUser
        );

      }else{

        showAuthError(
          'Account created. Check your email and click the confirmation link before logging in.'
        );

      }

    }

  }catch(error){

    console.error(
      'NASTIVEE AUTH ERROR:',
      error
    );


    let message =
      error?.message ||
      'Authentication failed.';


    const lower =
      message.toLowerCase();


    if(
      lower.includes(
        'email not confirmed'
      )
    ){

      message =
        'Your email has not been confirmed yet. Check your email for the Supabase confirmation link.';

    }


    if(
      lower.includes(
        'invalid login credentials'
      )
    ){

      message =
        'The email or password is incorrect.';

    }


    if(
      lower.includes(
        'user already registered'
      )
    ){

      message =
        'An account with this email already exists. Try logging in instead.';

    }


    showAuthError(
      message
    );

  }finally{

    authSubmit.disabled =
      false;

    /*
       Do NOT call updateAuthMode()
       here because it clears errors.
    */

    if(!currentUser){

      authSubmit.textContent =
        authMode === 'login'
          ? 'Log in'
          : 'Create account';

    }

  }

}

);

/* =====================================================
   LOCAL MEMORY
===================================================== */

function loadLocalMemory(){

  try{

    memory =
      JSON.parse(
        localStorage.getItem(
          MEMORY_KEY
        )
      ) || {};

  }catch{

    memory = {};

  }

}


function saveMemory(){

  try{

    localStorage.setItem(
      MEMORY_KEY,
      JSON.stringify(memory)
    );

  }catch(error){

    console.warn(
      'Memory local save failed:',
      error
    );

  }

  saveCloudMemory();

}


function extractMemory(text){

  if(!text){
    return;
  }


  let match;


  match =
    text.match(
      /my\s+(?:dog|dogs|puppy)(?:'s)?\s+(?:name\s+is|is called|is named)\s+([A-Za-z][A-Za-z0-9_-]{1,30})/i
    );


  if(match){

    memory.dogName =
      match[1];

  }


  match =
    text.match(
      /my\s+name\s+is\s+([A-Za-z][A-Za-z0-9_-]{1,30})/i
    );


  if(match){

    memory.userName =
      match[1];

  }


  match =
    text.match(
      /(?:my\s+dog|my\s+puppy)\s+is\s+a\s+([A-Za-z][A-Za-z -]{2,30})/i
    );


  if(match){

    memory.dogBreed =
      match[1].trim();

  }


  saveMemory();
  renderMemory();

}


function renderMemory(){

  const entries = [];


  if(memory.userName){

    entries.push(
      `Your name: ${memory.userName}`
    );

  }


  if(memory.dogName){

    entries.push(
      `Dog's name: ${memory.dogName}`
    );

  }


  if(memory.dogBreed){

    entries.push(
      `Dog breed: ${memory.dogBreed}`
    );

  }


  memoryContent.textContent =
    entries.length
      ? entries.join('\n')
      : 'No saved memories yet.';

}


/* =====================================================
   CLOUD MEMORY
===================================================== */

async function loadCloudMemory(){

  if(!currentUser){
    return;
  }


  try{

    const result =
      await supabaseClient
        .from('profiles')
        .select('memory')
        .eq(
          'id',
          currentUser.id
        )
        .maybeSingle();


    if(result.error){

      console.warn(
        'Cloud memory unavailable:',
        result.error.message
      );

      return;

    }


    if(
      result.data &&
      result.data.memory
    ){

      memory =
        result.data.memory;

      try{

        localStorage.setItem(
          MEMORY_KEY,
          JSON.stringify(memory)
        );

      }catch{}

      renderMemory();

    }

  }catch(error){

    console.warn(
      'Cloud memory failed:',
      error
    );

  }

}


async function saveCloudMemory(){

  if(!currentUser){
    return;
  }


  try{

    const result =
      await supabaseClient
        .from('profiles')
        .upsert({
          id:currentUser.id,
          memory
        });


    if(result.error){

      console.warn(
        'Cloud memory save failed:',
        result.error.message
      );

    }

  }catch(error){

    );

}

){

/* =====================================================
   LOCAL CHAT STORAGE
===================================================== */

function saveChats(){

  try{

    localStorage.setItem(
      CHATS_KEY,
      JSON.stringify(chats)
    );

    localStorage.setItem(
      ACTIVE_CHAT_KEY,
      activeChatId || ''
    );

  }catch(error){

    console.warn(
      'Chat storage failed:',
      error
    );

  }

}


function loadLocalChats(){

  try{

    const stored =
      localStorage.getItem(
        CHATS_KEY
      );


    chats =
      stored
        ? JSON.parse(stored)
        : [];

  }catch{

    chats = [];

  }


  if(!Array.isArray(chats)){
    chats = [];
  }


  if(!chats.length){

    let oldConversation = [];


    try{

      oldConversation =
        JSON.parse(
          localStorage.getItem(
            OLD_CONVERSATION_KEY
          )
        ) || [];

    }catch{

      oldConversation = [];

    }


    if(oldConversation.length){

      const migrated =
        createChat(
          makeChatTitle(
            oldConversation
          )
        );

      migrated.messages =
        oldConversation;

      chats.push(
        migrated
      );

    }else{

      chats.push(
        createChat()
      );

    }

  }


  activeChatId =
    localStorage.getItem(
      ACTIVE_CHAT_KEY
    );


  if(
    !activeChatId ||
    !chats.some(
      c =>
        c.id === activeChatId
    )
  ){

    activeChatId =
      chats[0].id;

  }


  saveChats();

}


/* =====================================================
   CLOUD CHATS
===================================================== */

async function loadCloudChats(){

  if(!currentUser){
    return;
  }


  const result =
    await supabaseClient
      .from('chats')
      .select('*')
      .eq(
        'user_id',
        currentUser.id
      )
      .order(
        'updated_at',
        {
          ascending:false
        }
      );


  if(result.error){

    throw result.error;

  }


  const cloudChats =
    result.data || [];


  if(!cloudChats.length){

    for(
      const localChat
      of chats
    ){

      await uploadChat(
        localChat
      );

    }

    return;

  }


  const loaded = [];


  for(
    const cloudChat
    of cloudChats
  ){

    const messageResult =
      await supabaseClient
        .from('messages')
        .select('*')
        .eq(
          'chat_id',
          cloudChat.id
        )
        .eq(
          'user_id',
          currentUser.id
        )
        .order(
          'created_at',
          {
            ascending:true
          }
        );


    const cloudMessages =
      messageResult.data || [];


    loaded.push({

      id:
        cloudChat.id,

      title:
        cloudChat.title ||
        'New chat',

      createdAt:
        new Date(
          cloudChat.created_at
        ).getTime(),

      updatedAt:
        new Date(
          cloudChat.updated_at
        ).getTime(),

      messages:
        cloudMessages.map(
          m => ({

            role:
              m.role,

            type:
              m.type ||
              'text',

            content:
              m.content

          })
        )

    });

  }


  chats =
    loaded;


  activeChatId =
    chats[0]?.id ||
    null;


  conversation =
    getActiveChat()?.messages ||
    [];


  saveChats();

  renderChatHistory();

  chat.innerHTML = '';

  restoreConversation();

}


/* =====================================================
   CLOUD UPLOAD
===================================================== */

async function uploadChat(
  chatObject
){

  if(!currentUser){
    return;
  }


  const chatResult =
    await supabaseClient
      .from('chats')
      .upsert({

        id:
          chatObject.id,

        user_id:
          currentUser.id,

        title:
          chatObject.title ||
          'New chat',

        created_at:
          new Date(
            chatObject.createdAt ||
            Date.now()
          ).toISOString(),

        updated_at:
          new Date(
            chatObject.updatedAt ||
            Date.now()
          ).toISOString()

      });


  if(chatResult.error){

    throw chatResult.error;

  }


  await supabaseClient
    .from('messages')
    .delete()
    .eq(
      'chat_id',
      chatObject.id
    )
    .eq(
      'user_id',
      currentUser.id
    );


  const messages =
    (chatObject.messages || [])
      .map(
        message => ({

          chat_id:
            chatObject.id,

          user_id:
            currentUser.id,

          role:
            message.role,

          type:
            message.type ||
            'text',

          content:
            message.content ||
            ''

        })
      );


  if(messages.length){

    const result =
      await supabaseClient
        .from('messages')
        .insert(
          messages
        );


    if(result.error){

      console.warn(
        'Message upload failed:',
        result.error
      );

    }

  }

}


async function syncActiveChat(){

  if(
    !currentUser ||
    cloudSyncBusy
  ){
    return;
  }


  const current =
    getActiveChat();


  if(!current){
    return;
  }


  cloudSyncBusy = true;


  try{

    await uploadChat(
      current
    );

    await saveCloudMemory();

  }catch(error){

    console.warn(
      'Cloud sync failed:',
      error
    );

  }finally{

    cloudSyncBusy = false;

  }

}


/* =====================================================
   CHAT TITLE
===================================================== */

function makeChatTitle(
  messages
){

  const first =
    messages.find(
      m =>
        m.role === 'user' &&
        typeof m.content === 'string'
    );


  if(!first){
    return 'New chat';
  }


  let title =
    first.content
      .replace(
        /\s+/g,
        ' '
      )
      .trim();


  if(!title){
    return 'New chat';
  }


  if(title.length > 32){

    title =
      title.substring(
        0,
        32
      ).trim() + '…';

  }


  return title;

}


function updateChatTitle(){

  const current =
    getActiveChat();


  if(!current){
    return;
  }


  const title =
    makeChatTitle(
      current.messages
    );


  if(title !== 'New chat'){

    current.title =
      title;

  }

}


/* =====================================================
   ACTIVE CHAT
===================================================== */

function getActiveChat(){

  return chats.find(
    c =>
      c.id === activeChatId
  );

}


function saveActiveConversation(){

  const current =
    getActiveChat();


  if(!current){
    return;
  }


  current.messages =
    conversation;


  current.updatedAt =
    Date.now();


  updateChatTitle();

  saveChats();

  renderChatHistory();

  syncActiveChat();

}


/* =====================================================
   CHAT HISTORY UI
===================================================== */

function renderChatHistory(){

  chatHistory.innerHTML = '';


  const sorted =
    [...chats].sort(
      (a,b) =>
        b.updatedAt -
        a.updatedAt
    );


  if(sorted.length){

    const label =
      document.createElement(
        'div'
      );

    label.className =
      'historyLabel';

    label.textContent =
      'Chats';

    chatHistory.appendChild(
      label
    );

  }


  sorted.forEach(
    item => {

      const row =
        document.createElement(
          'div'
        );

      row.className =
        'chatItem';


      if(
        item.id === activeChatId
      ){

        row.classList.add(
          'active'
        );

      }


      const icon =
        document.createElement(
          'span'
        );

      icon.textContent =
        '💬';


      const title =
        document.createElement(
          'div'
        );

      title.className =
        'chatItemTitle';

      title.textContent =
        item.title ||
        'New chat';


      const del =
        document.createElement(
          'button'
        );

      del.className =
        'deleteChat';

      del.textContent =
        '×';

      del.title =
        'Delete chat';


      del.addEventListener(
        'click',
        function(event){

          event.stopPropagation();

          deleteChat(
            item.id
          );

        }
      );


      row.appendChild(
        icon
      );

      row.appendChild(
        title
      );

      row.appendChild(
        del
      );


      row.addEventListener(
        'click',
        function(){

          openChat(
            item.id
          );

        }
      );


      chatHistory.appendChild(
        row
      );

    }
  );

}

/* =====================================================
   DELETE CHAT
===================================================== */

async function deleteChat(id){

  if(
    chatBusy ||
    imageBusy
  ){
    return;
  }


  if(currentUser){

    try{

      await supabaseClient
        .from('messages')
        .delete()
        .eq(
          'chat_id',
          id
        )
        .eq(
          'user_id',
          currentUser.id
        );


      await supabaseClient
        .from('chats')
        .delete()
        .eq(
          'id',
          id
        )
        .eq(
          'user_id',
          currentUser.id
        );

    }catch(error){

      console.warn(
        'Cloud delete failed:',
        error
      );

    }

  }


  chats =
    chats.filter(
      c =>
        c.id !== id
    );


  if(!chats.length){

    const newChatObject =
      createChat();

    chats.push(
      newChatObject
    );

    activeChatId =
      newChatObject.id;

    conversation = [];

    chat.innerHTML = '';

    addMessage(
      'assistant',
      'Hi 👋 I’m Nastivee. What would you like to do?',
      {
        silent:true
      }
    );

  }else if(
    activeChatId === id
  ){

    activeChatId =
      chats[0].id;

    conversation =
      chats[0].messages || [];

    chat.innerHTML = '';

    restoreConversation();

  }


  saveChats();

  renderChatHistory();

}

/* =====================================================
   API
===================================================== */

async function apiFetch(
  path,
  options={}
){

  const headers = {

    'Content-Type':
      'application/json',

    ...(options.headers || {})

  };


  if(supabaseClient){

    try{

      const result =
        await supabaseClient.auth.getSession();


      const token =
        result.data?.session?.access_token;


      if(token){

        headers.Authorization =
          `Bearer ${token}`;

      }

    }catch(error){

      console.warn(
        'Could not get access token:',
        error
      );

    }

  }


  const response =
    await fetch(
      `${API_BASE}${path}`,
      {
        ...options,
        headers
      }
    );


  const text =
    await response.text();


  let data;


  try{

    data =
      text
        ? JSON.parse(text)
        : {};

  }catch{

    throw new Error(
      text ||
      `Server returned HTTP ${response.status}`
    );

  }


  if(!response.ok){

    throw new Error(
      data.details ||
      data.error ||
      `HTTP ${response.status}`
    );

  }


  return data;

}


/* =====================================================
   SEND CHAT
===================================================== */

function chatHistoryForApi(){

  return conversation
    .filter(
      m =>
        m.type !== 'image' &&
        typeof m.content === 'string'
    )
    .slice(-30)
    .map(
      m => ({

        role:
          m.role,

        content:
          m.content

      })
    );

}


async function sendMessage(){

  const text =
    messageInput.value.trim();


  if(!text){
    return;
  }


  if(
    chatBusy ||
    imageBusy
  ){
    return;
  }


  if(imageMode){

    messageInput.value = '';

    resizeInput();

    await createImage(
      text
    );

    return;

  }


  chatBusy = true;

  sendButton.disabled = true;


  addMessage(
    'user',
    text
  );


  conversation.push({

    role:'user',

    content:text

  });


  extractMemory(
    text
  );


  messageInput.value = '';

  resizeInput();

  saveActiveConversation();


  const thinking =
    addMessage(
      'assistant',
      'Nastivee is thinking…'
    );


  try{

    const data =
      await apiFetch(
        '/api/chat',
        {

          method:'POST',

          body:
            JSON.stringify({

              messages:
                chatHistoryForApi(),

              memory

            })

        }
      );


    thinking.remove();


    addMessage(
      'assistant',
      data.reply ||
      'I did not receive a response.'
    );


    conversation.push({

      role:'assistant',

      content:
        data.reply ||
        ''

    });


    saveActiveConversation();

  }catch(error){

    thinking.remove();


    addMessage(
      'assistant',
      `Sorry, something went wrong: ${error.message}`
    );

  }finally{

    chatBusy = false;

    sendButton.disabled = false;

  }

}


sendButton.addEventListener(
  'click',
  sendMessage
);


/* =====================================================
   IMAGE PROGRESS
===================================================== */

function startImageProgress(
  rerender
){

  clearInterval(
    progressTimer
  );

  clearTimeout(
    progressCloseTimer
  );


  imageProgress.classList.add(
    'open'
  );


  progressTitle.textContent =
    rerender
      ? 'Re-rendering your image…'
      : 'Creating your image…';


  const stages =
    rerender

      ? [

          [
            'Preparing your original photo…',
            10
          ],

          [
            'Using your original photo for likeness…',
            28
          ],

          [
            'Reworking your request…',
            48
          ],

          [
            'Creating a fresh variation…',
            70
          ],

          [
            'Finishing the new image…',
            90
          ]

        ]

      : [

          [
            'Preparing your request…',
            10
          ],

          [
            'Understanding your image instructions…',
            30
          ],

          [
            'Creating your image…',
            65
          ],

          [
            'Finishing the image…',
            90
          ]

        ];


  let index = 0;


  progressStage.textContent =
    stages[0][0];


  progressFill.style.width =
    `${stages[0][1]}%`;


  progressTimer =
    setInterval(
      function(){

        index++;


        if(
          index >=
          stages.length
        ){

          clearInterval(
            progressTimer
          );

          return;

        }


        progressStage.textContent =
          stages[index][0];

        progressFill.style.width =
          `${stages[index][1]}%`;

      },
      1600
    );

}


function finishImageProgress(){

  clearInterval(
    progressTimer
  );


  progressStage.textContent =
    'Done ✓';


  progressFill.style.width =
    '100%';


  progressCloseTimer =
    setTimeout(
      function(){

        imageProgress.classList.remove(
          'open'
        );

      },
      1200
    );

}


function failImageProgress(){

  clearInterval(
    progressTimer
  );


  progressStage.textContent =
    'Something went wrong.';


  progressFill.style.width =
    '100%';


  progressCloseTimer =
    setTimeout(
      function(){

        imageProgress.classList.remove(
          'open'
        );

      },
      2000
    );

}


/* =====================================================
   IMAGE GENERATION
===================================================== */

async function createImage(
  prompt
){

  if(imageBusy){
    return;
  }


  imageBusy = true;

  sendButton.disabled = true;


  const sourceImage =
    selectedPhoto;

  const wasEdit =
    !!sourceImage;


  addMessage(
    'user',
    prompt
  );


  conversation.push({

    role:'user',

    content:prompt

  });


  saveActiveConversation();


  startImageProgress(
    false
  );


  try{

    let data;


    if(sourceImage){

      data =
        await apiFetch(
          '/api/image/edit',
          {

            method:'POST',

            body:
              JSON.stringify({

                prompt,

                image:
                  sourceImage,

                regenerate:false

              })

          }
        );

    }else{

      data =
        await apiFetch(
          '/api/image',
          {

            method:'POST',

            body:
              JSON.stringify({

                prompt,

                regenerate:false

              })

          }
        );

    }


    finishImageProgress();


    addImageMessage(
      data.image,
      sourceImage,
      prompt,
      wasEdit
    );


    conversation.push({

      role:'assistant',

      type:'image',

      content:data.image

    });


    saveActiveConversation();

  }catch(error){

    failImageProgress();


    addMessage(
      'assistant',
      `Image generation failed: ${error.message}`
    );

  }finally{

    imageBusy = false;

    sendButton.disabled = false;

  }

}


/* =====================================================
   RE-RENDER
===================================================== */

async function rerenderImage(
  button,
  sourceImage,
  originalPrompt,
  wasEdit
){

  if(imageBusy){
    return;
  }


  if(
    wasEdit &&
    !sourceImage
  ){

    addMessage(
      'assistant',
      'Please upload the original photo again before re-rendering.'
    );

    return;

  }


  imageBusy = true;

  button.disabled = true;

  button.textContent =
    '⏳ Re-rendering…';


  startImageProgress(
    true
  );


  /*
     Tell the image model to create
     a fresh variation while retaining
     the original intent.
  */

  const rerenderPrompt =
    `${originalPrompt}

Create a fresh variation of this image while keeping the user's original intent. Preserve important subject identity, facial appearance, composition requirements and key details from the original request. Do not unnecessarily change the person's likeness.`;

  
  try{

    let data;


    if(wasEdit){

      data =
        await apiFetch(
          '/api/image/edit',
          {

            method:'POST',

            body:
              JSON.stringify({

                prompt:
                  rerenderPrompt,

                image:
                  sourceImage,

                regenerate:true

              })

          }
        );

    }else{

      data =
        await apiFetch(
          '/api/image',
          {

            method:'POST',

            body:
              JSON.stringify({

                prompt:
                  rerenderPrompt,

                regenerate:true

              })

          }
        );

    }


    finishImageProgress();


    addImageMessage(
      data.image,
      sourceImage,
      originalPrompt,
      wasEdit
    );


    conversation.push({

      role:'assistant',

      type:'image',

      content:data.image

    });


    saveActiveConversation();

  }catch(error){

    failImageProgress();


    addMessage(
      'assistant',
      `Re-render failed: ${error.message}`
    );

  }finally{

    imageBusy = false;

    button.disabled = false;

    button.textContent =
      '🔄 Re-render';

  }

}


/* =====================================================
   IMAGE MODE
===================================================== */

function setImageMode(
  enabled
){

  imageMode =
    enabled;


  if(enabled){

    composer.classList.add(
      'imageMode'
    );


    imageButton.textContent =
      '🖼️';


    messageInput.placeholder =
      selectedPhoto
        ? 'Describe what you want changed…'
        : 'Describe the image you want…';

  }else{

    composer.classList.remove(
      'imageMode'
    );


    imageButton.textContent =
      '🎨';


    messageInput.placeholder =
      'Message Nastivee…';

  }

}


imageButton.addEventListener(
  'click',
  function(){

    setImageMode(
      !imageMode
    );

  }
);


/* =====================================================
   UPLOAD IMAGE
===================================================== */

uploadButton.addEventListener(
  'click',
  function(){

    fileInput.click();

  }
);


fileInput.addEventListener(
  'change',
  function(){

    const file =
      fileInput.files?.[0];


    if(!file){
      return;
    }


    if(
      !file.type.startsWith(
        'image/'
      )
    ){

      return;

    }


    const reader =
      new FileReader();


    reader.onload =
      function(){

        selectedPhoto =
          reader.result;


        uploadPreviewImage.src =
          selectedPhoto;


        uploadPreview.classList.add(
          'open'
        );


        setImageMode(
          true
        );

      };


    reader.readAsDataURL(
      file
    );

  }
);


/* =====================================================
   REMOVE UPLOAD
===================================================== */

removePhoto.addEventListener(
  'click',
  function(){

    selectedPhoto = null;

    fileInput.value = '';

    uploadPreview.classList.remove(
      'open'
    );


    messageInput.placeholder =
      imageMode
        ? 'Describe the image you want…'
        : 'Message Nastivee…';

  }
);

}


memoryButton.addEventListener(

/* =====================================================
   MOBILE SIDEBAR
===================================================== */

  sidebar.classList.add(
    'open'
  );

  sidebarOverlay.classList.add(
    'open'
  );

}


function closeSidebar(){

  sidebar.classList.remove(
    'open'
  );

  sidebarOverlay.classList.remove(
    'open'
  );

}


menuButton.addEventListener(
  'click',
  openSidebar
);

  'click',
  closeSidebar
);


/* =====================================================
   TEXTAREA
===================================================== */

function resizeInput(){

  messageInput.style.height =
    'auto';


  messageInput.style.height =
    `${Math.min(
      messageInput.scrollHeight,
      140
    )}px`;


  updateDockHeight();

}


messageInput.addEventListener(
  'input',
  resizeInput
);


messageInput.addEventListener(
  'keydown',
  function(event){

    if(
      event.key === 'Enter' &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =====================================================
   DOCK HEIGHT
===================================================== */

function updateDockHeight(){

  if(!dock){
    return;
  }


  document.documentElement
    .style
    .setProperty(
      '--dock-h',
      `${dock.offsetHeight}px`
    );

}


window.addEventListener(
  'resize',
  updateDockHeight
);


/* =====================================================
   RESTORE CHAT
===================================================== */

function restoreConversation(){

  messageCount = 0;


  if(!conversation.length){

    addMessage(
      'assistant',
      'Hi 👋 I’m Nastivee. What would you like to do?',
      {
        silent:true
      }
    );

    return;

  }


  conversation.forEach(
    message => {

      if(
        message.type === 'image'
      ){

        addImageMessage(
          message.content,
          null,
          '',
          false,
          {
            silent:true
          }
        );

      }else{

        addMessage(
          message.role === 'user'
            ? 'user'
            : 'assistant',

          message.content,

          {
            silent:true
          }

        );

      }

    }
  );


  setTimeout(
    function(){

      window.scrollTo(
        0,
        document.documentElement.scrollHeight
      );

    },
    50
  );

}


/* =====================================================
   INITIALISE USER
===================================================== */

async function initialiseUser(
  user
){

  if(user){

    currentUser =
      user;

  }


  if(!currentUser){
    return;
  }


  if(userInitialising){

    return;

  }


  userInitialising = true;


  authScreen.classList.add(
    'hidden'
  );


  try{

    await loadCloudMemory();

    await loadCloudChats();

  }catch(error){

    console.error(
      'Cloud initialisation failed:',
      error
    );


    /*
       Cloud failure should NOT stop
       the user using Nastivee.
    */

    loadLocalMemory();

    loadLocalChats();

    renderMemory();

    renderChatHistory();

    const active =
      getActiveChat();


    conversation =
      active?.messages ||
      [];


    chat.innerHTML = '';

    restoreConversation();

  }finally{

    userInitialising =
      false;

  }


  updateDockHeight();

}


/* =====================================================
   AUTH STATE
===================================================== */

if(supabaseClient){

  supabaseClient.auth.onAuthStateChange(
    async function(
      event,
      session
    ){

      console.log(
        'SUPABASE AUTH:',
        event
      );


      if(
        event === 'SIGNED_IN' &&
        session
      ){

        currentUser =
          session.user;


        await initialiseUser(
          currentUser
        );

      }


      if(
        event === 'SIGNED_OUT'
      ){

        currentUser = null;

      }

    }
  );

}


/* =====================================================
   START APP
===================================================== */

async function startApp(){

  console.log(
    'NASTIVEE STARTING'
  );


  updateAuthMode(
    false
  );


  loadLocalMemory();

  loadLocalChats();

  renderChatHistory();

  renderMemory();

  updateDockHeight();


  if(!supabaseClient){

    authScreen.classList.remove(
      'hidden'
    );


    showAuthError(
      'Nastivee could not load its login service. Please refresh the page.'
    );


    return;

  }


  try{

    const result =
      await supabaseClient.auth.getSession();


    if(result.error){

      console.error(
        'SESSION ERROR:',
        result.error
      );


      authScreen.classList.remove(
        'hidden'
      );


      showAuthError(
        result.error.message ||
        'Could not check your login session.'
      );


      return;

    }


    if(
      result.data?.session
    ){

      currentUser =
        result.data.session.user;


      await initialiseUser(
        currentUser
      );

    }else{

      authScreen.classList.remove(
        'hidden'
      );

    }

  }catch(error){

    console.error(
      'START ERROR:',
      error
    );


    authScreen.classList.remove(
      'hidden'
    );


    showAuthError(
      error.message ||
      'Nastivee could not start correctly.'
    );

  }

}


/* =====================================================
   START
===================================================== */

startApp();

</script>
