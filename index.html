<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#12091f"
  >

  <title>Nastivee AI</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background:
        radial-gradient(
          circle at top,
          #32104f 0%,
          #160a25 45%,
          #09050f 100%
        );
      color: white;
    }

    body {
      overflow: hidden;
    }

    button,
    textarea {
      font-family: inherit;
    }

    .app {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 65px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      background: rgba(13, 7, 22, 0.88);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .logo {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo span {
      color: #c76cff;
    }

    .header-buttons {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .new-chat,
    .memory-button {
      border: none;
      color: white;
      background: rgba(255,255,255,0.08);
      padding: 9px 13px;
      border-radius: 12px;
      font-size: 13px;
      cursor: pointer;
    }

    .new-chat:active,
    .memory-button:active {
      transform: scale(.96);
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 14px 125px;
      scroll-behavior: smooth;
    }

    .welcome {
      text-align: center;
      max-width: 650px;
      margin: 65px auto 30px;
      padding: 0 15px;
    }

    .welcome h1 {
      margin: 0 0 10px;
      font-size: 34px;
      letter-spacing: -1px;
    }

    .welcome p {
      margin: 0;
      color: rgba(255,255,255,.6);
      line-height: 1.5;
    }

    .message-row {
      width: 100%;
      display: flex;
      margin: 12px 0;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.assistant {
      justify-content: flex-start;
    }

    .message {
      max-width: 82%;
      padding: 12px 15px;
      border-radius: 18px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 15px;
    }

    .message.user {
      background:
        linear-gradient(
          135deg,
          #873cff,
          #c84fff
        );
      border-bottom-right-radius: 5px;
    }

    .message.assistant {
      background:
        rgba(255,255,255,.08);
      border:
        1px solid rgba(255,255,255,.06);
      border-bottom-left-radius: 5px;
    }

    .image-message {
      max-width: 92%;
      padding: 8px;
    }

    .generated-image {
      display: block;
      width: 100%;
      max-width: 520px;
      border-radius: 18px;
      box-shadow:
        0 15px 50px rgba(0,0,0,.35);
    }

    .image-actions {
      display: flex;
      gap: 8px;
      margin-top: 9px;
      flex-wrap: wrap;
    }

    .image-action {
      border: none;
      background:
        rgba(255,255,255,.1);
      color: white;
      border-radius: 10px;
      padding: 8px 11px;
      cursor: pointer;
      font-size: 12px;
    }

    .image-action:hover {
      background:
        rgba(255,255,255,.16);
    }

    .input-area {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      padding: 10px 12px 14px;
      background:
        linear-gradient(
          to top,
          rgba(9,5,15,1),
          rgba(9,5,15,.94),
          rgba(9,5,15,0)
        );
    }

    .composer {
      max-width: 900px;
      margin: auto;
      background:
        rgba(32,18,47,.96);
      border:
        1px solid rgba(255,255,255,.1);
      border-radius: 19px;
      padding: 8px;
      display: flex;
      align-items: flex-end;
      gap: 7px;
      box-shadow:
        0 10px 40px rgba(0,0,0,.35);
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 42px;
      max-height: 140px;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 15px;
      padding: 11px 9px;
      line-height: 20px;
    }

    textarea::placeholder {
      color:
        rgba(255,255,255,.42);
    }

    .icon-button,
    .send-button {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border: none;
      border-radius: 13px;
      color: white;
      cursor: pointer;
      font-size: 18px;
    }

    .icon-button {
      background:
        rgba(255,255,255,.08);
    }

    .icon-button.active {
      background:
        linear-gradient(
          135deg,
          #873cff,
          #c84fff
        );
    }

    .icon-button:disabled,
    .send-button:disabled {
      opacity: .45;
      cursor: default;
    }

    .send-button {
      background:
        linear-gradient(
          135deg,
          #873cff,
          #c84fff
        );
    }

    .image-panel {
      display: none;
      max-width: 900px;
      margin: 0 auto 8px;
      padding: 10px;
      background:
        rgba(32,18,47,.96);
      border:
        1px solid rgba(255,255,255,.08);
      border-radius: 15px;
    }

    .image-panel.show {
      display: block;
    }

    .image-panel-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .image-panel-subtitle {
      color:
        rgba(255,255,255,.55);
      font-size: 12px;
      margin-bottom: 10px;
    }

    .photo-preview {
      display: none;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .photo-preview.show {
      display: flex;
    }

    .photo-preview img {
      width: 55px;
      height: 55px;
      object-fit: cover;
      border-radius: 10px;
    }

    .remove-photo {
      border: none;
      background:
        rgba(255,80,80,.15);
      color: #ff8d8d;
      border-radius: 8px;
      padding: 7px 10px;
      cursor: pointer;
    }

    .typing {
      display: flex;
      gap: 5px;
      padding: 5px 3px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #c76cff;
      animation:
        bounce 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes bounce {

      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: .4;
      }

      30% {
        transform: translateY(-5px);
        opacity: 1;
      }

    }

    /* MEMORY PANEL */

    .memory-panel {
      display: none;
      position: fixed;
      z-index: 50;
      top: 70px;
      right: 12px;
      width: min(360px, calc(100vw - 24px));
      max-height: 70vh;
      overflow-y: auto;
      background:
        rgba(25,13,38,.98);
      border:
        1px solid rgba(255,255,255,.12);
      border-radius: 17px;
      padding: 15px;
      box-shadow:
        0 20px 60px rgba(0,0,0,.5);
    }

    .memory-panel.show {
      display: block;
    }

    .memory-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .memory-subtitle {
      font-size: 12px;
      color: rgba(255,255,255,.5);
      margin-bottom: 13px;
      line-height: 1.4;
    }

    .memory-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px;
      margin-bottom: 7px;
      background:
        rgba(255,255,255,.06);
      border-radius: 11px;
    }

    .memory-item-text {
      font-size: 13px;
      line-height: 1.4;
      word-break: break-word;
    }

    .memory-delete {
      flex-shrink: 0;
      border: none;
      background:
        rgba(255,80,80,.12);
      color: #ff9292;
      border-radius: 7px;
      padding: 4px 7px;
      cursor: pointer;
    }

    .no-memory {
      color: rgba(255,255,255,.45);
      font-size: 13px;
      padding: 10px 0;
    }

    @media (max-width: 600px) {

      .header {
        height: 60px;
        padding: 0 10px;
      }

      .logo {
        font-size: 19px;
      }

      .new-chat,
      .memory-button {
        padding: 8px 9px;
        font-size: 12px;
      }

      .welcome {
        margin-top: 40px;
      }

      .welcome h1 {
        font-size: 28px;
      }

      .message {
        max-width: 89%;
        font-size: 14px;
      }

      .chat {
        padding-left: 9px;
        padding-right: 9px;
      }

      .composer {
        border-radius: 17px;
      }

      .icon-button,
      .send-button {
        width: 40px;
        height: 40px;
      }

    }

  </style>

</head>


<body>

<div class="app">


  <!-- HEADER -->

  <header class="header">

    <div class="logo">
      Nastivee <span>AI</span>
    </div>

    <div class="header-buttons">

      <button
        class="memory-button"
        id="memoryButton"
        type="button"
      >
        🧠 Memory
      </button>

      <button
        class="new-chat"
        id="newChat"
        type="button"
      >
        + New chat
      </button>

    </div>

  </header>


  <!-- MEMORY PANEL -->

  <div
    class="memory-panel"
    id="memoryPanel"
  >

    <div class="memory-title">
      🧠 Nastivee Memory
    </div>

    <div class="memory-subtitle">
      Things Nastivee has saved about you.
      These memories stay on this device.
    </div>

    <div id="memoryList"></div>

  </div>


  <!-- CHAT -->

  <main
    class="chat"
    id="chat"
  >

    <div
      class="welcome"
      id="welcome"
    >

      <h1>
        What can I help with?
      </h1>

      <p>
        Chat, ask questions, joke around,
        or create an image.
      </p>

    </div>

  </main>


  <!-- INPUT -->

  <div class="input-area">


    <!-- IMAGE PANEL -->

    <div
      class="image-panel"
      id="imagePanel"
    >

      <div class="image-panel-title">
        Create an image
      </div>

      <div class="image-panel-subtitle">
        Describe an image, or upload a photo
        to edit it.
      </div>


      <div
        class="photo-preview"
        id="photoPreview"
      >

        <img
          id="photoPreviewImage"
          alt="Selected photo"
        >

        <button
          class="remove-photo"
          id="removePhoto"
          type="button"
        >
          Remove photo
        </button>

      </div>

    </div>


    <!-- COMPOSER -->

    <div class="composer">


      <button
        class="icon-button"
        id="imageButton"
        title="Create image"
        type="button"
      >
        🎨
      </button>


      <button
        class="icon-button"
        id="uploadButton"
        title="Upload photo"
        type="button"
      >
        📷
      </button>


      <input
        type="file"
        id="photoInput"
        accept="image/*"
        style="display:none"
      >


      <textarea
        id="messageInput"
        placeholder="Message Nastivee..."
        rows="1"
        autocomplete="off"
        spellcheck="true"
      ></textarea>


      <button
        class="send-button"
        id="sendButton"
        type="button"
        title="Send"
      >
        ➤
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const chat =
  document.getElementById('chat');

const welcome =
  document.getElementById('welcome');

const messageInput =
  document.getElementById('messageInput');

const sendButton =
  document.getElementById('sendButton');

const imageButton =
  document.getElementById('imageButton');

const uploadButton =
  document.getElementById('uploadButton');

const photoInput =
  document.getElementById('photoInput');

const imagePanel =
  document.getElementById('imagePanel');

const photoPreview =
  document.getElementById('photoPreview');

const photoPreviewImage =
  document.getElementById('photoPreviewImage');

const removePhoto =
  document.getElementById('removePhoto');

const newChat =
  document.getElementById('newChat');

const memoryButton =
  document.getElementById('memoryButton');

const memoryPanel =
  document.getElementById('memoryPanel');

const memoryList =
  document.getElementById('memoryList');


/* =========================================================
   STORAGE
========================================================= */

const MEMORY_KEY =
  'nastivee_conversation_v3';

const LONG_MEMORY_KEY =
  'nastivee_long_term_memory_v1';


let conversation = [];

let memory = {};

let imageMode = false;

let selectedPhoto = null;

let lastImagePrompt = '';

let lastImageWasEdit = false;

let lastEditedPhoto = null;

let imageBusy = false;


/* =========================================================
   LOAD CONVERSATION
========================================================= */

function loadConversation() {

  try {

    const saved =
      localStorage.getItem(
        MEMORY_KEY
      );

    if (!saved) {

      conversation = [];

      return;

    }

    const parsed =
      JSON.parse(saved);

    if (!Array.isArray(parsed)) {

      conversation = [];

      return;

    }

    conversation =
      parsed.filter(item => {

        return (
          item &&
          (
            item.role === 'user' ||
            item.role === 'assistant'
          ) &&
          typeof item.content === 'string' &&
          item.content.trim()
        );

      });

    conversation =
      conversation.slice(-100);

  } catch (error) {

    console.error(
      'CONVERSATION LOAD ERROR:',
      error
    );

    conversation = [];

  }

}


/* =========================================================
   SAVE CONVERSATION
========================================================= */

function saveConversation() {

  try {

    conversation =
      conversation.slice(-100);

    localStorage.setItem(

      MEMORY_KEY,

      JSON.stringify(
        conversation
      )

    );

  } catch (error) {

    console.error(
      'CONVERSATION SAVE ERROR:',
      error
    );

  }

}


/* =========================================================
   LOAD LONG-TERM MEMORY
========================================================= */

function loadMemory() {

  try {

    const saved =
      localStorage.getItem(
        LONG_MEMORY_KEY
      );

    if (!saved) {

      memory = {};

      return;

    }

    const parsed =
      JSON.parse(saved);

    if (
      parsed &&
      typeof parsed === 'object' &&
      !Array.isArray(parsed)
    ) {

      memory = parsed;

    } else {

      memory = {};

    }

  } catch (error) {

    console.error(
      'MEMORY LOAD ERROR:',
      error
    );

    memory = {};

  }

}


/* =========================================================
   SAVE LONG-TERM MEMORY
========================================================= */

function saveMemory() {

  try {

    localStorage.setItem(

      LONG_MEMORY_KEY,

      JSON.stringify(
        memory
      )

    );

  } catch (error) {

    console.error(
      'MEMORY SAVE ERROR:',
      error
    );

  }

}


/* =========================================================
   AUTOMATIC MEMORY DETECTION
========================================================= */

function rememberFromMessage(message) {

  const text =
    message.trim();


  /* DOG NAME */

  let match =
    text.match(
      /my\s+(?:dog|dogs|puppy)'?s?\s+(?:name\s+is|is\s+called|is\s+named)\s+([A-Za-z][A-Za-z0-9_-]{1,30})/i
    );


  if (match) {

    memory.dog_name =
      match[1];

  }


  /* MY DOG IS CALLED */

  match =
    text.match(
      /my\s+dog\s+(?:is\s+called|is\s+named)\s+([A-Za-z][A-Za-z0-9_-]{1,30})/i
    );


  if (match) {

    memory.dog_name =
      match[1];

  }


  /* DOG BREED */

  match =
    text.match(
      /my\s+(?:dog|puppy)\s+is\s+(?:a\s+)?(siberian husky|husky|golden retriever|labrador|german shepherd|french bulldog|bulldog|staffy|staffordshire bull terrier|border collie|beagle|rottweiler|poodle)/i
    );


  if (match) {

    memory.dog_breed =
      match[1];

  }


  /* USER NAME */

  match =
    text.match(
      /(?:my\s+name\s+is|i\s+am|i'm)\s+([A-Za-z][A-Za-z'-]{1,30})/i
    );


  if (
    match &&
    !/^(happy|fine|good|okay|ok|tired|hungry|sad|angry|bored|going)$/i.test(
      match[1]
    )
  ) {

    memory.user_name =
      match[1];

  }


  /* FAVOURITES */

  match =
    text.match(
      /my\s+(?:favourite|favorite)\s+([A-Za-z ]{2,25})\s+is\s+([^.!?]{1,80})/i
    );


  if (match) {

    const category =
      match[1]
        .trim()
        .toLowerCase()
        .replace(/\s+/g, '_');

    const value =
      match[2]
        .trim();

    if (
      category &&
      value
    ) {

      memory[
        `favourite_${category}`
      ] =
        value;

    }

  }


  saveMemory();

  renderMemory();

}


/* =========================================================
   MEMORY DISPLAY
========================================================= */

function renderMemory() {

  memoryList.innerHTML =
    '';


  const entries =
    Object.entries(
      memory
    );


  if (!entries.length) {

    const empty =
      document.createElement('div');

    empty.className =
      'no-memory';

    empty.textContent =
      'Nothing saved yet. Tell me something about yourself.';

    memoryList.appendChild(
      empty
    );

    return;

  }


  entries.forEach(
    ([key, value]) => {

      const item =
        document.createElement('div');

      item.className =
        'memory-item';


      const text =
        document.createElement('div');

      text.className =
        'memory-item-text';


      const readableKey =
        key
          .replace(/_/g, ' ')
          .replace(/\b\w/g, char =>
            char.toUpperCase()
          );


      text.textContent =
        `${readableKey}: ${value}`;


      const deleteButton =
        document.createElement('button');

      deleteButton.className =
        'memory-delete';

      deleteButton.textContent =
        '×';

      deleteButton.type =
        'button';


      deleteButton.onclick =
        () => {

          delete memory[key];

          saveMemory();

          renderMemory();

        };


      item.appendChild(
        text
      );

      item.appendChild(
        deleteButton
      );


      memoryList.appendChild(
        item
      );

    }
  );

}


/* =========================================================
   RESTORE CHAT
========================================================= */

function restoreConversation() {

  if (!conversation.length) {

    return;

  }


  welcome.style.display =
    'none';


  conversation.forEach(item => {

    addMessageToScreen(
      item.role,
      item.content
    );

  });


  scrollToBottom();

}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessageToScreen(
  role,
  content
) {

  const row =
    document.createElement('div');

  row.className =
    `message-row ${role}`;


  const bubble =
    document.createElement('div');

  bubble.className =
    `message ${role}`;


  bubble.textContent =
    content;


  row.appendChild(
    bubble
  );


  chat.appendChild(
    row
  );


  return bubble;

}


/* =========================================================
   ADD IMAGE
========================================================= */

function addImageToScreen(
  imageData,
  prompt
) {

  welcome.style.display =
    'none';


  const row =
    document.createElement('div');

  row.className =
    'message-row assistant';


  const wrapper =
    document.createElement('div');

  wrapper.className =
    'message image-message';


  const image =
    document.createElement('img');

  image.className =
    'generated-image';

  image.src =
    imageData;

  image.alt =
    prompt ||
    'Generated image';


  const actions =
    document.createElement('div');

  actions.className =
    'image-actions';


  const download =
    document.createElement('button');

  download.className =
    'image-action';

  download.textContent =
    '⬇ Download';

  download.type =
    'button';


  download.onclick =
    () => {

      const link =
        document.createElement('a');

      link.href =
        imageData;

      link.download =
        'nastivee-image.png';

      document.body.appendChild(
        link
      );

      link.click();

      link.remove();

    };


  const regenerate =
    document.createElement('button');

  regenerate.className =
    'image-action';

  regenerate.textContent =
    '↻ Regenerate';

  regenerate.type =
    'button';


  regenerate.onclick =
    () => {

      if (imageBusy) {

        return;

      }

      createImg(
        lastImagePrompt,
        true
      );

    };


  actions.appendChild(
    download
  );

  actions.appendChild(
    regenerate
  );


  wrapper.appendChild(
    image
  );

  wrapper.appendChild(
    actions
  );


  row.appendChild(
    wrapper
  );


  chat.appendChild(
    row
  );


  scrollToBottom();

}


/* =========================================================
   TYPING INDICATOR
========================================================= */

function showTyping() {

  hideTyping();


  const row =
    document.createElement('div');

  row.className =
    'message-row assistant';

  row.id =
    'typingMessage';


  const bubble =
    document.createElement('div');

  bubble.className =
    'message assistant';


  bubble.innerHTML = `

    <div class="typing">

      <span></span>
      <span></span>
      <span></span>

    </div>

  `;


  row.appendChild(
    bubble
  );

  chat.appendChild(
    row
  );


  scrollToBottom();

}


function hideTyping() {

  const typing =
    document.getElementById(
      'typingMessage'
    );


  if (typing) {

    typing.remove();

  }

}


/* =========================================================
   SCROLL
========================================================= */

function scrollToBottom() {

  requestAnimationFrame(() => {

    chat.scrollTop =
      chat.scrollHeight;

  });

}


/* =========================================================
   FILE READER
========================================================= */

function fileToDataURL(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () => {

          resolve(
            reader.result
          );

        };


      reader.onerror =
        () => {

          reject(
            new Error(
              'Could not read the selected image.'
            )
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

  const message =
    messageInput.value.trim();


  if (!message) {

    return;

  }


  if (imageMode) {

    await createImg(
      message,
      false
    );

    return;

  }


  messageInput.value =
    '';

  autoResize();


  welcome.style.display =
    'none';


  /* SAVE IMPORTANT FACTS FIRST */

  rememberFromMessage(
    message
  );


  addMessageToScreen(
    'user',
    message
  );


  conversation.push({

    role:
      'user',

    content:
      message

  });


  saveConversation();


  sendButton.disabled =
    true;


  showTyping();


  try {

    const history =
      conversation
        .slice(0, -1)
        .slice(-100);


    const response =
      await fetch(

        '/api/chat',

        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'application/json'

          },

          body:
            JSON.stringify({

              message,

              history,

              memory

            })

        }

      );


    const data =
      await response.json();


    hideTyping();


    if (!response.ok) {

      throw new Error(

        data.error ||
        'Chat request failed.'

      );

    }


    const reply =
      data.reply ||
      data.answer ||
      'Sorry, I could not generate a response.';


    addMessageToScreen(
      'assistant',
      reply
    );


    conversation.push({

      role:
        'assistant',

      content:
        reply

    });


    saveConversation();


  } catch (error) {

    hideTyping();


    console.error(
      'CHAT ERROR:',
      error
    );


    addMessageToScreen(

      'assistant',

      `Sorry, something went wrong: ${error.message}`

    );


    const last =
      conversation[
        conversation.length - 1
      ];


    if (
      last &&
      last.role === 'user' &&
      last.content === message
    ) {

      conversation.pop();

    }


    saveConversation();


  } finally {

    sendButton.disabled =
      false;

    messageInput.focus();

  }

}


/* =========================================================
   IMAGE CREATION / EDITING
========================================================= */

async function createImg(
  customPrompt = null,
  isRegenerate = false
) {

  if (imageBusy) {

    return;

  }


  const prompt =
    customPrompt !== null
      ? customPrompt.trim()
      : messageInput.value.trim();


  if (!prompt) {

    return;

  }


  imageBusy =
    true;


  sendButton.disabled =
    true;

  imageButton.disabled =
    true;

  uploadButton.disabled =
    true;


  welcome.style.display =
    'none';


  if (!isRegenerate) {

    lastImagePrompt =
      prompt;

  }


  let photoData =
    null;


  try {

    if (
      isRegenerate &&
      lastImageWasEdit &&
      lastEditedPhoto
    ) {

      photoData =
        lastEditedPhoto;

    }

    else if (
      selectedPhoto
    ) {

      photoData =
        await fileToDataURL(
          selectedPhoto
        );

    }


    if (!isRegenerate) {

      addMessageToScreen(
        'user',
        prompt
      );

    }


    showTyping();


    const endpoint =
      photoData
        ? '/api/image/edit'
        : '/api/image';


    const body =
      photoData

        ? {

            prompt,

            image:
              photoData,

            regenerate:
              isRegenerate

          }

        : {

            prompt,

            regenerate:
              isRegenerate

          };


    const response =
      await fetch(

        endpoint,

        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'application/json'

          },

          body:
            JSON.stringify(body)

        }

      );


    const data =
      await response.json();


    hideTyping();


    if (!response.ok) {

      throw new Error(

        data.error ||
        'Image request failed.'

      );

    }


    if (!data.image) {

      throw new Error(
        'No image was returned.'
      );

    }


    if (
      photoData &&
      !isRegenerate
    ) {

      lastEditedPhoto =
        photoData;

    }


    if (!isRegenerate) {

      lastImageWasEdit =
        !!photoData;

    }


    addImageToScreen(
      data.image,
      prompt
    );


  } catch (error) {

    hideTyping();


    console.error(
      'IMAGE ERROR:',
      error
    );


    addMessageToScreen(

      'assistant',

      `Sorry, I couldn't create that image: ${error.message}`

    );


  } finally {

    imageBusy =
      false;

    sendButton.disabled =
      false;

    imageButton.disabled =
      false;

    uploadButton.disabled =
      false;

    messageInput.value =
      '';

    autoResize();

    messageInput.focus();

  }

}


/* =========================================================
   IMAGE BUTTON
========================================================= */

imageButton.onclick =
  () => {

    imageMode =
      !imageMode;


    imageButton.classList.toggle(
      'active',
      imageMode
    );


    imagePanel.classList.toggle(
      'show',
      imageMode
    );


    if (imageMode) {

      messageInput.placeholder =
        selectedPhoto
          ? 'Describe how you want to edit the photo...'
          : 'Describe the image you want...';

    } else {

      messageInput.placeholder =
        'Message Nastivee...';

    }

  };


/* =========================================================
   UPLOAD
========================================================= */

uploadButton.onclick =
  () => {

    photoInput.click();

  };


photoInput.onchange =
  () => {

    const file =
      photoInput.files?.[0];


    if (!file) {

      return;

    }


    if (
      !file.type.startsWith('image/')
    ) {

      alert(
        'Please select an image file.'
      );

      photoInput.value =
        '';

      return;

    }


    selectedPhoto =
      file;


    imageMode =
      true;


    imageButton.classList.add(
      'active'
    );


    imagePanel.classList.add(
      'show'
    );


    messageInput.placeholder =
      'Describe how you want to edit the photo...';


    const reader =
      new FileReader();


    reader.onload =
      () => {

        photoPreviewImage.src =
          reader.result;

        photoPreview.classList.add(
          'show'
        );

      };


    reader.readAsDataURL(
      file
    );

  };


/* =========================================================
   REMOVE PHOTO
========================================================= */

removePhoto.onclick =
  () => {

    selectedPhoto =
      null;

    lastEditedPhoto =
      null;

    lastImageWasEdit =
      false;

    photoInput.value =
      '';

    photoPreview.classList.remove(
      'show'
    );


    if (imageMode) {

      messageInput.placeholder =
        'Describe the image you want...';

    }

  };


/* =========================================================
   MEMORY BUTTON
========================================================= */

memoryButton.onclick =
  () => {

    memoryPanel.classList.toggle(
      'show'
    );

    renderMemory();

  };


/* =========================================================
   CLOSE MEMORY WHEN CLICKING OUTSIDE
========================================================= */

document.addEventListener(
  'click',
  event => {

    if (
      !memoryPanel.contains(event.target) &&
      !memoryButton.contains(event.target)
    ) {

      memoryPanel.classList.remove(
        'show'
      );

    }

  }
);


/* =========================================================
   NEW CHAT
========================================================= */

newChat.onclick =
  () => {

    const confirmed =
      confirm(

        'Start a new chat?\n\nYour saved long-term memories will NOT be deleted.'

      );


    if (!confirmed) {

      return;

    }


    conversation =
      [];


    localStorage.removeItem(
      MEMORY_KEY
    );


    selectedPhoto =
      null;

    lastImagePrompt =
      '';

    lastImageWasEdit =
      false;

    lastEditedPhoto =
      null;


    photoInput.value =
      '';


    photoPreview.classList.remove(
      'show'
    );


    chat.innerHTML =
      '';


    chat.appendChild(
      welcome
    );


    welcome.style.display =
      'block';


    imageMode =
      false;


    imageButton.classList.remove(
      'active'
    );


    imagePanel.classList.remove(
      'show'
    );


    messageInput.placeholder =
      'Message Nastivee...';


    messageInput.value =
      '';


    autoResize();

    messageInput.focus();

  };


/* =========================================================
   ENTER TO SEND
========================================================= */

messageInput.addEventListener(
  'keydown',
  event => {

    if (
      event.key === 'Enter' &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================================================
   AUTO RESIZE
========================================================= */

function autoResize() {

  messageInput.style.height =
    'auto';


  const newHeight =
    Math.min(
      messageInput.scrollHeight,
      140
    );


  messageInput.style.height =
    `${newHeight}px`;

}


messageInput.addEventListener(
  'input',
  autoResize
);


/* =========================================================
   SEND BUTTON
========================================================= */

sendButton.onclick =
  () => {

    sendMessage();

  };


/* =========================================================
   STARTUP
========================================================= */

loadMemory();

loadConversation();

restoreConversation();

renderMemory();

autoResize();

messageInput.focus();

</script>

</body>
