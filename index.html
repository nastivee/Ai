<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nastivee AI</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #090614;
      color: white;
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       AUTH
    ========================= */

    #authScreen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, #32105c 0%, #120820 45%, #090614 100%);
      z-index: 1000;
      padding: 20px;
    }

    .authBox {
      width: 100%;
      max-width: 420px;
      background: rgba(24, 15, 38, 0.95);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.5);
    }

    .authLogo {
      text-align: center;
      margin-bottom: 25px;
    }

    .authLogo img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      border-radius: 18px;
      margin-bottom: 10px;
    }

    .authLogo h1 {
      margin: 0;
      font-size: 28px;
    }

    .authLogo p {
      color: #aaa;
      margin-top: 8px;
    }

    .authBox input {
      width: 100%;
      padding: 15px;
      margin-bottom: 12px;
      border: 1px solid #3b2850;
      background: #100a19;
      color: white;
      border-radius: 12px;
      outline: none;
    }

    .authBox input:focus {
      border-color: #9b5cff;
    }

    .authButton {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #8e42ff, #c45cff);
      color: white;
      font-size: 16px;
      font-weight: bold;
      margin-top: 5px;
    }

    .authButton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .authSwitch {
      margin-top: 18px;
      text-align: center;
      color: #aaa;
      font-size: 14px;
    }

    .authSwitch button {
      background: none;
      border: 0;
      color: #c06cff;
      font-weight: bold;
    }

    #authMessage {
      min-height: 20px;
      margin-top: 15px;
      text-align: center;
      color: #ff9e9e;
      font-size: 14px;
    }

    /* =========================
       APP
    ========================= */

    #app {
      display: none;
      width: 100%;
      height: 100%;
    }

    .layout {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      width: 270px;
      background: #0d0816;
      border-right: 1px solid #251735;
      display: flex;
      flex-direction: column;
      padding: 15px;
      flex-shrink: 0;
      position: relative;
      z-index: 500;
    }

    .newChatButton {
      width: 100%;
      padding: 14px;
      border: 1px solid #4a2a66;
      border-radius: 12px;
      background: #171022;
      color: white;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .newChatButton:hover {
      background: #241536;
    }

    .historyTitle {
      color: #888;
      font-size: 12px;
      text-transform: uppercase;
      margin: 8px 5px;
    }

    #chatHistory {
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }

    .historyItem {
      padding: 11px;
      border-radius: 10px;
      margin-bottom: 5px;
      color: #ccc;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .historyItem:hover,
    .historyItem.active {
      background: #21132f;
      color: white;
    }

    .emptyHistory {
      color: #666;
      font-size: 13px;
      padding: 10px 5px;
    }

    .sidebarBottom {
      border-top: 1px solid #251735;
      padding-top: 12px;
      margin-top: 10px;
    }

    .sidebarButton {
      width: 100%;
      padding: 11px;
      border: 0;
      background: transparent;
      color: #bbb;
      text-align: left;
      border-radius: 10px;
      margin-bottom: 4px;
    }

    .sidebarButton:hover {
      background: #1b1028;
      color: white;
    }

    /* =========================
       MOBILE SIDEBAR
    ========================= */

    .sidebarOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.58);
      z-index: 450;
    }

    .sidebarOverlay.show {
      display: block;
    }

    .mobileMenuButton {
      display: none;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid #342044;
      background: #171021;
      color: white;
      font-size: 20px;
      margin-right: 8px;
      flex-shrink: 0;
    }

    .mobileMenuButton:hover {
      background: #241536;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 50% -20%, #241039 0%, #0b0711 55%);
      position: relative;
    }

    header {
      height: 70px;
      flex-shrink: 0;
      border-bottom: 1px solid #251735;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: relative;
      z-index: 40;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: bold;
    }

    .logo img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 10px;
    }

    .headerButtons {
      display: flex;
      gap: 8px;
    }

    .headerButtons button {
      background: #171021;
      color: #ddd;
      border: 1px solid #342044;
      border-radius: 10px;
      padding: 9px 12px;
    }

    .headerButtons button:hover {
      background: #241536;
    }

    /* =========================
       MEMORY
    ========================= */

    #memoryPanel {
      display: none;
      position: absolute;
      top: 78px;
      right: 20px;
      width: 330px;
      max-width: calc(100vw - 40px);
      background: #160d21;
      border: 1px solid #43275a;
      border-radius: 16px;
      padding: 16px;
      z-index: 100;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    #memoryPanel h3 {
      margin-top: 0;
    }

    #memoryText {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      background: #0e0815;
      color: white;
      border: 1px solid #382146;
      border-radius: 10px;
      padding: 12px;
      outline: none;
    }

    #saveMemoryButton {
      margin-top: 10px;
      width: 100%;
      padding: 11px;
      border: 0;
      border-radius: 10px;
      background: #8c4bff;
      color: white;
      font-weight: bold;
    }

    /* =========================
       CHAT
    ========================= */

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
      padding-bottom: 180px;
      scroll-behavior: smooth;
    }

    .welcome {
      max-width: 700px;
      margin: 60px auto;
      text-align: center;
      color: #bbb;
    }

    .welcome h2 {
      color: white;
      font-size: 32px;
      margin-bottom: 10px;
    }

    .message {
      max-width: 850px;
      margin: 0 auto 18px;
      display: flex;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 80%;
      padding: 13px 16px;
      border-radius: 18px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user .bubble {
      background: linear-gradient(135deg, #7036d6, #913fba);
      border-bottom-right-radius: 5px;
    }

    .message.assistant .bubble {
      background: #17101f;
      border: 1px solid #2d1b3d;
      border-bottom-left-radius: 5px;
    }

    /* =========================
       IMAGES
    ========================= */

    .imageMessage {
      max-width: 850px;
      margin: 0 auto 20px;
    }

    .generatedImage {
      max-width: min(100%, 700px);
      max-height: 75vh;
      display: block;
      border-radius: 16px;
      border: 1px solid #39234b;
      margin-top: 8px;
      object-fit: contain;
      background: #10091a;
    }

    .imageActions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .imageActionButton {
      padding: 9px 12px;
      border-radius: 9px;
      border: 1px solid #43275a;
      background: #160d21;
      color: #ddd;
    }

    .imageActionButton:hover {
      background: #241433;
    }

    /* =========================
       PROGRESS
    ========================= */

    #imageProgress {
      display: none;
      position: fixed;
      bottom: 105px;
      left: 50%;
      transform: translateX(-50%);
      width: min(500px, calc(100% - 30px));
      background: #170d21;
      border: 1px solid #44265b;
      border-radius: 14px;
      padding: 13px 16px;
      z-index: 600;
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    }

    .progressTitle {
      font-size: 13px;
      color: #ddd;
      margin-bottom: 8px;
    }

    .progressBar {
      width: 100%;
      height: 6px;
      background: #2a1937;
      border-radius: 10px;
      overflow: hidden;
    }

    #progressFill {
      width: 15%;
      height: 100%;
      background: linear-gradient(90deg, #8b4cff, #d85cff);
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    /* =========================
       UPLOAD
    ========================= */

    #uploadPreview {
      display: none;
      position: absolute;
      bottom: 86px;
      left: 0;
      background: #170d21;
      border: 1px solid #42265a;
      border-radius: 12px;
      padding: 8px;
      z-index: 50;
    }

    #uploadPreview img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
    }

    #removeUpload {
      position: absolute;
      top: -7px;
      right: -7px;
      width: 22px;
      height: 22px;
      border: 0;
      border-radius: 50%;
      background: #e34b62;
      color: white;
      font-size: 12px;
    }

    /* =========================
       COMPOSER
    ========================= */

    .dock {
      position: fixed;
      bottom: 0;
      left: 270px;
      right: 0;
      padding: 15px 20px 20px;
      background: linear-gradient(
        to top,
        #0b0711 70%,
        rgba(11,7,17,0)
      );
      z-index: 20;
    }

    .composer {
      max-width: 900px;
      margin: auto;
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: #160d20;
      border: 1px solid #39234a;
      border-radius: 18px;
      padding: 8px;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      max-height: 150px;
      resize: none;
      background: transparent;
      border: 0;
      color: white;
      outline: none;
      padding: 10px;
      font-size: 15px;
    }

    .dockButton {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      border: 1px solid #3b244d;
      background: #21132e;
      color: white;
      flex-shrink: 0;
    }

    .dockButton:hover {
      background: #2c1940;
    }

    .dockButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #imageButton {
      background: linear-gradient(135deg, #5d2cc9, #a341dc);
      border: 0;
    }

    #sendButton {
      background: linear-gradient(135deg, #7c3cff, #b34fff);
      border: 0;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 750px) {

      .sidebar {
        display: flex;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 285px;
        max-width: 85vw;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        box-shadow: 20px 0 50px rgba(0,0,0,0.45);
      }

      .sidebar.mobileOpen {
        transform: translateX(0);
      }

      .mobileMenuButton {
        display: block;
      }

      header {
        padding: 0 12px;
        justify-content: flex-start;
      }

      header .logo {
        flex: 1;
      }

      .dock {
        left: 0;
        padding: 10px;
      }

      .logo {
        font-size: 17px;
      }

      .logo img {
        width: 36px;
        height: 36px;
      }

      .headerButtons {
        gap: 5px;
      }

      .headerButtons button {
        padding: 8px;
        font-size: 12px;
      }

      #chat {
        padding: 15px;
        padding-bottom: 170px;
      }

      .bubble {
        max-width: 90%;
      }

      .welcome {
        margin: 40px auto;
      }

      .welcome h2 {
        font-size: 26px;
      }

      .generatedImage {
        max-width: 100%;
      }

      #memoryPanel {
        right: 10px;
        top: 72px;
        width: calc(100vw - 20px);
      }
    }
  </style>
</head>

<body>

  <div
    id="sidebarOverlay"
    class="sidebarOverlay"
  ></div>


  <!-- AUTH -->

  <div id="authScreen">

    <div class="authBox">

      <div class="authLogo">

        <img
          src="IMG_0471.jpeg"
          alt="Nastivee AI"
        >

        <h1>Nastivee AI</h1>

        <p>Your personal AI assistant</p>

      </div>


      <div id="loginForm">

        <input
          id="loginEmail"
          type="email"
          placeholder="Email"
          autocomplete="email"
        >

        <input
          id="loginPassword"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
        >

        <button
          type="button"
          class="authButton"
          id="loginButton"
        >
          Login
        </button>

        <div class="authSwitch">
          Don't have an account?
          <button
            type="button"
            id="showSignupButton"
          >
            Sign up
          </button>
        </div>

      </div>


      <div
        id="signupForm"
        style="display:none;"
      >

        <input
          id="signupEmail"
          type="email"
          placeholder="Email"
          autocomplete="email"
        >

        <input
          id="signupPassword"
          type="password"
          placeholder="Password"
          autocomplete="new-password"
        >

        <input
          id="signupPasswordConfirm"
          type="password"
          placeholder="Confirm password"
          autocomplete="new-password"
        >

        <button
          type="button"
          class="authButton"
          id="signupButton"
        >
          Create account
        </button>

        <div class="authSwitch">
          Already have an account?
          <button
            type="button"
            id="showLoginButton"
          >
            Login
          </button>
        </div>

      </div>

      <div id="authMessage"></div>

    </div>

  </div>


  <!-- APP -->

  <div id="app">

    <div class="layout">

      <!-- SIDEBAR -->

      <aside class="sidebar">

        <button
          type="button"
          class="newChatButton"
          id="sidebarNewChatButton"
        >
          ＋ New chat
        </button>

        <div class="historyTitle">
          Chat history
        </div>

        <div id="chatHistory"></div>

        <div class="sidebarBottom">

          <button
            type="button"
            class="sidebarButton"
            id="sidebarMemoryButton"
          >
            🧠 Memory
          </button>

          <button
            type="button"
            class="sidebarButton"
            id="logoutButton"
          >
            🚪 Log out
          </button>

        </div>

      </aside>


      <!-- MAIN -->

      <main class="main">

        <header>

          <button
            type="button"
            id="mobileMenuButton"
            class="mobileMenuButton"
            aria-label="Open menu"
          >
            ☰
          </button>

          <div class="logo">

            <img
              src="IMG_0471.jpeg"
              alt="Nastivee AI"
            >

            <span>Nastivee AI</span>

          </div>

          <div class="headerButtons">

            <button
              type="button"
              id="memoryButton"
            >
              🧠 Memory
            </button>

            <button
              type="button"
              id="newChatButton"
            >
              ＋ New
            </button>

          </div>

        </header>


        <!-- MEMORY -->

        <div id="memoryPanel">

          <h3>🧠 Memory</h3>

          <textarea
            id="memoryText"
            placeholder="Things Nastivee should remember about you..."
          ></textarea>

          <button
            type="button"
            id="saveMemoryButton"
          >
            Save memory
          </button>

        </div>


        <!-- CHAT -->

        <div id="chat">

          <div
            class="welcome"
            id="welcome"
          >

            <h2>
              What can I help you with?
            </h2>

            <p>
              Ask Nastivee anything,
              create images,
              edit photos,
              or just have a conversation.
            </p>

          </div>

        </div>

      </main>

    </div>


    <!-- IMAGE PROGRESS -->

    <div id="imageProgress">

      <div
        class="progressTitle"
        id="progressTitle"
      >
        Preparing image...
      </div>

      <div class="progressBar">

        <div id="progressFill"></div>

      </div>

    </div>


    <!-- COMPOSER -->

    <div class="dock">

      <div class="composer">

        <div id="uploadPreview">

          <button
            type="button"
            id="removeUpload"
          >
            ×
          </button>

          <img
            id="uploadPreviewImage"
            src=""
            alt="Upload preview"
          >

        </div>


        <button
          type="button"
          class="dockButton"
          id="uploadButton"
          title="Upload image"
        >
          📎
        </button>


        <textarea
          id="messageInput"
          rows="1"
          placeholder="Message Nastivee..."
        ></textarea>


        <button
          type="button"
          class="dockButton"
          id="imageButton"
          title="Create image"
        >
          🖼️
        </button>


        <button
          type="button"
          class="dockButton"
          id="sendButton"
          title="Send message"
        >
          ➤
        </button>

      </div>

    </div>


    <input
      id="fileInput"
      type="file"
      accept="image/*"
      style="display:none;"
    >

  </div>


<script>

  /* =========================================================
     CONFIG
  ========================================================= */

  const SUPABASE_URL =
    'https://fzwqunpnohgwgwikumkt.supabase.co';

  const SUPABASE_KEY =
    'sb_publishable_kNUxEr43Kp5qVC4Evxgz0A_iCTLw7GB';

  const API_BASE =
    'https://ai-8vlt.onrender.com';

  const LIVE_SITE_URL =
    'https://ai-8vlt.onrender.com';


  /* =========================================================
     SUPABASE
  ========================================================= */

  let supabaseClient = null;

  try {

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

  } catch (error) {

    console.error(
      'Supabase initialisation error:',
      error
    );

  }


  /* =========================================================
     STATE
  ========================================================= */

  let currentUser = null;
  let currentChatId = null;
  let chats = [];
  let memory = '';
  let selectedImageFile = null;
  let selectedImageData = null;
  let conversationMessages = [];
  let initialised = false;
  let imageBusy = false;
  let loadingChat = false;


  /* =========================================================
     ELEMENTS
  ========================================================= */

  const authScreen =
    document.getElementById('authScreen');

  const app =
    document.getElementById('app');

  const loginForm =
    document.getElementById('loginForm');

  const signupForm =
    document.getElementById('signupForm');

  const authMessage =
    document.getElementById('authMessage');

  const chat =
    document.getElementById('chat');

  const welcome =
    document.getElementById('welcome');

  const messageInput =
    document.getElementById('messageInput');

  const fileInput =
    document.getElementById('fileInput');

  const uploadPreview =
    document.getElementById('uploadPreview');

  const uploadPreviewImage =
    document.getElementById('uploadPreviewImage');

  const imageProgress =
    document.getElementById('imageProgress');

  const progressTitle =
    document.getElementById('progressTitle');

  const progressFill =
    document.getElementById('progressFill');

  const memoryPanel =
    document.getElementById('memoryPanel');

  const memoryText =
    document.getElementById('memoryText');

  const imageButton =
    document.getElementById('imageButton');

  const sendButton =
    document.getElementById('sendButton');

  const uploadButton =
    document.getElementById('uploadButton');

  const sidebar =
    document.querySelector('.sidebar');

  const sidebarOverlay =
    document.getElementById('sidebarOverlay');

  const mobileMenuButton =
    document.getElementById('mobileMenuButton');


  /* =========================================================
     MOBILE SIDEBAR
  ========================================================= */

  function openMobileSidebar() {

    sidebar.classList.add(
      'mobileOpen'
    );

    sidebarOverlay.classList.add(
      'show'
    );

  }


  function closeMobileSidebar() {

    sidebar.classList.remove(
      'mobileOpen'
    );

    sidebarOverlay.classList.remove(
      'show'
    );

  }


  mobileMenuButton.addEventListener(
    'click',
    openMobileSidebar
  );


  sidebarOverlay.addEventListener(
    'click',
    closeMobileSidebar
  );


  /* =========================================================
     AUTH
  ========================================================= */

  function setAuthMessage(
    message,
    success = false
  ) {

    authMessage.textContent =
      message || '';

    authMessage.style.color =
      success
        ? '#8ff0ae'
        : '#ff9e9e';

  }


  function showLogin() {

    loginForm.style.display =
      'block';

    signupForm.style.display =
      'none';

    setAuthMessage('');

  }


  function showSignup() {

    loginForm.style.display =
      'none';

    signupForm.style.display =
      'block';

    setAuthMessage('');

  }


  document
    .getElementById('showSignupButton')
    .addEventListener(
      'click',
      showSignup
    );


  document
    .getElementById('showLoginButton')
    .addEventListener(
      'click',
      showLogin
    );


  /* =========================================================
     LOGIN
  ========================================================= */

  async function login() {

    const email =
      document
        .getElementById('loginEmail')
        .value
        .trim();

    const password =
      document
        .getElementById('loginPassword')
        .value;

    if (!email || !password) {

      setAuthMessage(
        'Please enter your email and password.'
      );

      return;

    }

    const button =
      document.getElementById(

      );

  /* =========================================================
     SIGNUP
  ========================================================= */

  async function signup() {

    const email =
      document
        .getElementById('signupEmail')
        .value
        .trim();

    const password =
      document
        .getElementById('signupPassword')
        .value;

    const confirmPassword =
      document
        .getElementById('signupPasswordConfirm')
        .value;

    if (!email || !password) {

      setAuthMessage(
        'Please complete all fields.'
      );

      return;

    }

    if (password !== confirmPassword) {

      setAuthMessage(
        'Passwords do not match.'
      );

      return;

    }

    const button =
      document.getElementById(
        'signupButton'
      );

    button.disabled = true;
    button.textContent =
      'Creating account...';

    try {

      const result =
        await supabaseClient.auth.signUp({

          email,
          password,

          options: {
            emailRedirectTo:
              LIVE_SITE_URL
          }

        });


      if (result.error) {

        setAuthMessage(
          result.error.message
        );

        return;

      }


      if (
        result.data &&
        !result.data.session
      ) {

        setAuthMessage(
          'Account created. Check your email to confirm your account.',
          true
        );

      } else {

        setAuthMessage(
          'Account created successfully.',
          true
        );

      }

    } catch (error) {

      console.error(
        'Signup error:',
        error
      );

      setAuthMessage(
        error.message
      );

    } finally {

      button.disabled = false;
      button.textContent =
        'Create account';

    }

  }


  document
    .getElementById('signupButton')
    .addEventListener(
      'click',
      signup
    );

  /* =========================================================
     API
  ========================================================= */

  async function apiFetch(
    path,
    options = {}
  ) {

    const headers =
      new Headers(
        options.headers || {}
      );


    if (
      options.body &&
      !(options.body instanceof FormData)
    ) {

      headers.set(
        'Content-Type',
        'application/json'
      );

    }


    try {

      const sessionResult =
        await supabaseClient.auth.getSession();

      const token =
        sessionResult
          .data
          ?.session
          ?.access_token;

      if (token) {

        headers.set(
          'Authorization',
          `Bearer ${token}`
        );

      }

    } catch (error) {

      console.warn(
        'Token error:',
        error
      );

    }


    return fetch(
      `${API_BASE}${path}`,
      {
        ...options,
        headers
      }
    );

  }

  function renderChatHistory() {

    const container =
      document.getElementById(
        'chatHistory'
      );

    container.innerHTML =
      '';


    if (!chats.length) {

      const empty =
        document.createElement(
          'div'
        );

      empty.className =
        'emptyHistory';

      empty.textContent =
        'No conversations yet';

      container.appendChild(
        empty
      );

      return;

    }


    chats.forEach(
      chatItem => {

        const item =
          document.createElement(
            'div'
          );


        item.className =
          'historyItem';


        if (
          String(chatItem.id) ===
          String(currentChatId)
        ) {

          item.classList.add(
            'active'
          );

        }


        item.textContent =
          chatItem.title ||
          'New chat';


        item.addEventListener(
          'click',
          async () => {

            /*
              IMPORTANT:
              Always attempt to load the clicked chat.
            */

            if (loadingChat) {
              return;
            }


            console.log(
              'CLICKED OLD CHAT:',
              chatItem.id
            );


            await loadChat(
              chatItem.id
            );


            closeMobileSidebar();

          }
        );


        container.appendChild(
          item
        );

      }
    );

  /* =========================================================
     CREATE CHAT IN DATABASE
  ========================================================= */

  async function ensureCurrentChat(
    firstMessage
  ) {

    if (currentChatId) {

      /*
        Verify the chat actually belongs to
        the current user before continuing.
      */

      const existing =
        chats.find(
          item =>
            String(item.id) ===
            String(currentChatId)
        );

      if (existing) {
        return true;
      }

    }


    if (!currentUser) {
      return false;
    }


    const title =
      firstMessage
        .trim()
        .slice(0, 50) ||
      'New chat';


    console.log(
      'CREATING CHAT FOR USER:',
      currentUser.id
    );


    const result =
      await supabaseClient
        .from('chats')
        .insert({

          user_id:
            currentUser.id,

          title:
            title

        })
        .select('*')
        .single();


    if (result.error) {

      console.error(
        'CREATE CHAT ERROR:',
        result.error
      );

      return false;

    }


    currentChatId =
      result.data.id;


    chats.unshift(
      result.data
    );


    renderChatHistory();


    console.log(
      'NEW CHAT CREATED:',
      currentChatId
    );


    return true;

  }


  /* =========================================================
     LOAD OLD CHAT
  ========================================================= */

  async function loadChat(
    chatId
  ) {

    if (
      !chatId ||
      !currentUser
    ) {

      return;

    }


    if (loadingChat) {
      return;
    }


    loadingChat =
      true;


    console.log(
      '================================'
    );

    console.log(
      'LOADING CHAT:',
      chatId
    );

    console.log(
      'USER:',
      currentUser.id
    );


    try {

      /*
        First verify that the selected chat
        belongs to the current user.
      */

      const chatResult =
        await supabaseClient
          .from('chats')
          .select('*')
          .eq(
            'id',
            chatId
          )
          .eq(
            'user_id',
            currentUser.id
          )
          .maybeSingle();


      if (chatResult.error) {

        console.error(
          'CHAT VERIFY ERROR:',
          chatResult.error
        );

        addTextMessage(
          'assistant',
          'I could not open this conversation: ' +
          chatResult.error.message
        );

        return;

      }


      if (!chatResult.data) {

        console.error(
          'CHAT NOT FOUND FOR CURRENT USER'
        );

        addTextMessage(
          'assistant',
          'This conversation could not be found.'
        );

        return;

      }


      /*
        Now load messages.

        We deliberately use chat_id as the primary
        filter. Supabase RLS will enforce ownership.
      */

      const messageResult =
        await supabaseClient
          .from('messages')
          .select('*')
          .eq(
            'chat_id',
            chatId
          )
          .order(
            'created_at',
            {
              ascending: true
            }
          );


      console.log(
        'MESSAGE QUERY:',
        messageResult
      );


      if (messageResult.error) {

        console.error(
          'MESSAGE LOAD ERROR:',
          messageResult.error
        );

        clearChatUI();

        addTextMessage(
          'assistant',
          'Could not load this conversation: ' +
          messageResult.error.message
        );

        return;

      }


      const messages =
        messageResult.data || [];


      console.log(
        'MESSAGES FOUND:',
        messages.length
      );


      console.table(
        messages
      );


      /*
        Switch active chat.
      */

      currentChatId =
        chatId;


      conversationMessages =
        [];


      clearUpload();

      clearChatUI();


      /*
        Rebuild messages.
      */

      messages.forEach(
        message => {

          const role =
            message.role ||
            'assistant';

          const content =
            message.content ||
            '';


          /*
            IMAGE
          */

          if (
            message.image_url
          ) {

            addImageMessage(
              message.image_url,
              content,
              null,
              content
            );

            return;

          }


          /*
            TEXT
          */

          if (
            role === 'user' ||
            role === 'assistant'
          ) {

            conversationMessages.push({

              role:
                role,

              content:
                content

            });

          }


          addTextMessage(
            role,
            content
          );

        }
      );


      renderChatHistory();


      requestAnimationFrame(
        () => {

          chat.scrollTop =
            chat.scrollHeight;

        }
      );


      console.log(
        'CHAT SUCCESSFULLY LOADED'
      );

      console.log(
        'CONVERSATION:',
        conversationMessages
      );


    } catch (error) {

      console.error(
        'LOAD CHAT ERROR:',
        error
      );

      clearChatUI();

      addTextMessage(
        'assistant',
        'Could not load this conversation: ' +
        error.message
      );

    } finally {

      loadingChat =
        false;

      console.log(
        '================================'
      );

    }

  }

  /* =========================================================
     UPDATE TITLE
  ========================================================= */

  async function updateChatTitle(
    text
  ) {

    if (!currentChatId) {
      return;
    }


    const existing =
      chats.find(
        item =>
          String(item.id) ===
          String(currentChatId)
      );


    if (
      existing &&
      existing.title &&
      existing.title !== 'New chat'
    ) {

      return;

    }


    const title =
      text
        .trim()
        .slice(0, 50) ||
      'New chat';


    const result =
      await supabaseClient
        .from('chats')
        .update({
          title
        })
        .eq(
          'id',
          currentChatId
        )
        .eq(
          'user_id',
          currentUser.id
        );


    if (result.error) {

      console.error(
        'TITLE UPDATE ERROR:',
        result.error
      );

      return;

    }


    if (existing) {

      existing.title =
        title;

    }


    renderChatHistory();

  }

  /* =========================================================
     IMAGE UI
  ========================================================= */

  function addImageMessage(
    imageUrl,
    prompt,
    originalImageData,
    originalPrompt
  ) {

    welcome.style.display =
      'none';


    const wrapper =
      document.createElement(
        'div'
      );


    wrapper.className =
      'imageMessage';


    const img =
      document.createElement(
        'img'
      );


    img.className =
      'generatedImage';


    img.src =
      imageUrl;


    img.alt =
      prompt ||
      'Generated image';


    wrapper.appendChild(
      img
    );


    if (prompt) {

      const caption =
        document.createElement(
          'div'
        );


      caption.style.marginTop =
        '8px';


      caption.style.color =
        '#aaa';


      caption.style.fontSize =
        '13px';


      caption.textContent =
        prompt;


      wrapper.appendChild(
        caption
      );

    }


    const actions =
      document.createElement(
        'div'
      );


    actions.className =
      'imageActions';


    const rerenderButton =
      document.createElement(
        'button'
      );


    rerenderButton.type =
      'button';


    rerenderButton.className =
      'imageActionButton';


    rerenderButton.textContent =
      '🔄 Re-render';


    /*
      If this image was loaded from history,
      originalImageData is null.

      We still show the button but don't pretend
      we have the original source image.
    */

    if (!originalImageData) {

      rerenderButton.disabled =
        true;

      rerenderButton.title =
        'Re-render is available for images from the current session';

    } else {

      rerenderButton.addEventListener(
        'click',
        async () => {

          await rerenderImage({

            sourceImage:
              originalImageData,

            prompt:
              originalPrompt ||
              prompt ||
              ''

          });

        }
      );

    }


    actions.appendChild(
      rerenderButton
    );


    const downloadButton =
      document.createElement(
        'button'
      );


    downloadButton.type =
      'button';


    downloadButton.className =
      'imageActionButton';


    downloadButton.textContent =
      '⬇️ Save image';


    downloadButton.addEventListener(
      'click',
      () => {

        const link =
          document.createElement(
            'a'
          );

        link.href =
          imageUrl;

        link.download =
          'nastivee-image.png';

        link.target =
          '_blank';

        document.body.appendChild(
          link
        );

        link.click();

        link.remove();

      }
    );


    actions.appendChild(
      downloadButton
    );


    wrapper.appendChild(
      actions
    );


    chat.appendChild(
      wrapper
    );


    chat.scrollTop =
      chat.scrollHeight;


    return wrapper;

  }

  /* =========================================================
     GENERATE IMAGE
  ========================================================= */

  async function generateImage(
    prompt
  ) {

    if (imageBusy) {
      return;
    }


    setImageButtonsBusy(true);


    showImageProgress(
      'Preparing image...',
      15
    );


    let timer1;
    let timer2;


    try {

      timer1 =
        setTimeout(
          () => {

            showImageProgress(
              'Creating your image...',
              45
            );

          },
          700
        );


      timer2 =
        setTimeout(
          () => {

            showImageProgress(
              'Rendering details...',
              70
            );

          },
          1800
        );


      const response =
        await apiFetch(
          '/api/image',
          {

            method:
              'POST',

            body:
              JSON.stringify({

                prompt:
                  prompt.trim()

              })

          }
        );


      let data;


      try {

        data =
          await response.json();

      } catch {

        throw new Error(
          'Invalid response from image server.'
        );

      }


      if (!response.ok) {

        throw new Error(
          data.error ||
          data.message ||
          `Image generation failed (${response.status})`
        );

      }


      if (!data.image) {

        throw new Error(
          'No image was returned.'
        );

      }


      showImageProgress(
        'Finishing image...',
        95
      );


      addImageMessage(
        data.image,
        prompt,
        null,
        prompt
      );


      await saveMessage(
        'assistant',
        prompt,
        data.image
      );


      hideImageProgress();


    } catch (error) {

      console.error(
        'IMAGE ERROR:',
        error
      );

      hideImageProgress();


      addTextMessage(
        'assistant',
        `Image error: ${error.message}`
      );

    } finally {

      clearTimeout(timer1);
      clearTimeout(timer2);

      setImageButtonsBusy(false);

    }

  }

      }


      showImageProgress(
        'Finishing your image...',
        95
      );


      addImageMessage(
        data.image,
        prompt,
        imageData,
        prompt
      );


      await saveMessage(
        'assistant',
        prompt,
        data.image
      );


      hideImageProgress();


    } catch (error) {

      console.error(
        'IMAGE EDIT ERROR:',
        error
      );

      hideImageProgress();


      addTextMessage(
        'assistant',
        `Image edit error: ${error.message}`
      );

    } finally {

      clearTimeout(timer1);
      clearTimeout(timer2);

      setImageButtonsBusy(false);

    }

  }


  /* =========================================================
     RERENDER
  ========================================================= */

  async function rerenderImage({
    sourceImage,
    prompt
  }) {

    if (!sourceImage) {

      addTextMessage(
        'assistant',
        'This image was loaded from history. Upload the image again if you want to re-render it.'
      );

      return;

    }


    const newPrompt =

`${prompt}

Create a fresh variation of this image.

Keep the main subject and original creative intention,
but create a noticeably different composition,
lighting, camera angle, background or styling.`;



    await editImage(
      sourceImage,
      newPrompt
    );

  }


  /* =========================================================
     SEND MESSAGE
  ========================================================= */

  async function sendMessage() {

    console.log(
      'SEND BUTTON / SEND MESSAGE TRIGGERED'
    );


    if (imageBusy) {
      return;
    }


    const text =
      messageInput.value.trim();


    if (
      !text &&
      !selectedImageData
    ) {

      messageInput.focus();

      return;

    }


    const userText =
      text ||
      'Please edit this image.';


    /*
      Make sure a DB chat exists BEFORE
      saving the message.
    */

    const chatReady =
      await ensureCurrentChat(
        userText
      );


    if (!chatReady) {

      addTextMessage(
        'assistant',
        'I could not create this conversation. Please try again.'
      );

      return;

    }


    /*
      Add user message to UI.
    */

    addTextMessage(
      'user',
      userText
    );


    /*
      Add it to conversation memory.
    */

    conversationMessages.push({

      role:
        'user',

      content:
        userText

    });


    /*
      SAVE USER MESSAGE
    */

    const saved =
      await saveMessage(
        'user',
        userText
      );


    if (!saved) {

      console.error(
        'USER MESSAGE WAS NOT SAVED'
      );

    }


    await updateChatTitle(
      userText
    );


    /*
      IMAGE EDIT
    */

    if (selectedImageData) {

      const image =
        selectedImageData;


      clearUpload();


      messageInput.value =
        '';


      await editImage(
        image,
        userText
      );


      return;

    }


    /*
      NORMAL CHAT
    */

    messageInput.value =
      '';

    messageInput.style.height =
      'auto';


    try {

      const response =
        await apiFetch(
          '/api/chat',
          {

            method:
              'POST',

            body:
              JSON.stringify({

                messages:
                  conversationMessages.slice(-30),

                memory:
                  memory

              })

          }
        );


      let data;


      try {

        data =
          await response.json();

      } catch {

        throw new Error(
          'Invalid response from chat server.'
        );

      }


      if (!response.ok) {

        throw new Error(
          data.error ||
          data.message ||
          `Chat request failed (${response.status})`
        );

      }


      const answer =
        data.reply ||
        data.message ||
        'I could not generate a response.';


      /*
        Display assistant response.
      */

      addTextMessage(
        'assistant',
        answer
      );


      /*
        Add to conversation state.
      */

      conversationMessages.push({

        role:
          'assistant',

        content:
          answer

      });


      /*
        SAVE ASSISTANT MESSAGE
      */

      await saveMessage(
        'assistant',
        answer
      );


    } catch (error) {

      console.error(
        'CHAT ERROR:',
        error
      );


      addTextMessage(
        'assistant',
        `Error: ${error.message}`
      );

    }

  }


  /*
    IMPORTANT:
    THIS WAS MISSING BEFORE.
  */

  sendButton.addEventListener(
    'click',
    sendMessage
  );


  /* =========================================================
     IMAGE BUTTON
  ========================================================= */

  imageButton.addEventListener(
    'click',
    async () => {

      if (imageBusy) {
        return;
      }


      const prompt =
        messageInput.value.trim();


      if (
        selectedImageData
      ) {

        if (!prompt) {

          addTextMessage(
            'assistant',
            'Tell me what you want me to change in the uploaded image.'
          );

          messageInput.focus();

          return;

        }


        const chatReady =
          await ensureCurrentChat(
            prompt
          );


        if (!chatReady) {
          return;
        }


        addTextMessage(
          'user',
          prompt
        );


        await saveMessage(
          'user',
          prompt
        );


        await updateChatTitle(
          prompt
        );


        const image =
          selectedImageData;


        clearUpload();

        messageInput.value =
          '';


        await editImage(
          image,
          prompt
        );


        return;

      }


      if (!prompt) {

        addTextMessage(
          'assistant',
          'Type what you want me to create first.'
        );

        messageInput.focus();

        return;

      }


      const chatReady =
        await ensureCurrentChat(
          prompt
        );


      if (!chatReady) {
        return;
      }


      addTextMessage(
        'user',
        prompt
      );


      await saveMessage(
        'user',
        prompt
      );


      await updateChatTitle(
        prompt
      );


      messageInput.value =
        '';

      messageInput.style.height =
        'auto';


      await generateImage(
        prompt
      );

    }
  );


  /* =========================================================
     UPLOAD
  ========================================================= */

  uploadButton.addEventListener(
    'click',
    () => {

      if (!imageBusy) {
        fileInput.click();
      }

    }
  );


  fileInput.addEventListener(
    'change',
    event => {

      const file =
        event.target.files?.[0];


      if (!file) {
        return;
      }


      if (
        !file.type.startsWith(
          'image/'
        )
      ) {

        alert(
          'Please select an image.'
        );

        return;

      }


      selectedImageFile =
        file;


      const reader =
        new FileReader();


      reader.onload =
        () => {

          selectedImageData =
            reader.result;


          uploadPreviewImage.src =
            selectedImageData;


          uploadPreview.style.display =
            'block';


          messageInput.focus();

        };


      reader.readAsDataURL(
        file
      );

    }
  );


  /* =========================================================
     CLEAR UPLOAD
  ========================================================= */

  function clearUpload() {

    selectedImageFile =
      null;

    selectedImageData =
      null;

    fileInput.value =
      '';

    uploadPreview.style.display =
      'none';

    uploadPreviewImage.src =
      '';

  }


  document
    .getElementById('removeUpload')
    .addEventListener(
      'click',
      clearUpload
    );


  /* =========================================================
     ENTER KEY
  ========================================================= */

  messageInput.addEventListener(
    'keydown',
    event => {

      if (
        event.key === 'Enter' &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


  /* =========================================================
     TEXTAREA RESIZE
  ========================================================= */

  messageInput.addEventListener(
    'input',
    () => {

      messageInput.style.height =
        'auto';


      messageInput.style.height =
        `${Math.min(
          messageInput.scrollHeight,
          150
        )}px`;

    }
  );


  /* =========================================================
     LOGOUT
  ========================================================= */

  document
    .getElementById('logoutButton')
    .addEventListener(
      'click',
      async () => {

        await supabaseClient.auth.signOut();

        currentUser =
          null;

        currentChatId =
          null;

        chats =
          [];

        memory =
          '';

        conversationMessages =
          [];

        initialised =
          false;

        clearUpload();

        clearChatUI();

        showAuthScreen();

      }
    );


  /* =========================================================
     START APP
  ========================================================= */

  checkSession();

</script>

</body>
</html>
