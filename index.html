DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>AI Flare Chat & SVG Generator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, sans-serif;
background: #0f172a;
color: #f8fafc;
display: flex;
flex-direction: column;
height: 100vh;
height: -webkit-fill-available;
overflow: hidden;
}
header {
background: #1e293b;
padding: 14px 16px;
border-bottom: 1px solid #334155;
display: flex;
align-items: center;
justify-content: space-between;
}
header h1 {
font-size: 1.1rem;
color: #38bdf8;
font-weight: 700;
}
header span {
font-size: 0.75rem;
background: #0369a1;
color: #e0f2fe;
padding: 3px 8px;
border-radius: 12px;
}
.chat-container {
flex: 1;
overflow-y: auto;
padding: 16px;
display: flex;
flex-direction: column;
gap: 16px;
-webkit-overflow-scrolling: touch;
}
.message {
display: flex;
flex-direction: column;
max-width: 85%;
gap: 6px;
}
.message.user {
align-self: flex-end;
}
.message.bot {
align-self: flex-start;
}
.bubble {
padding: 12px 16px;
border-radius: 18px;
font-size: 0.95rem;
line-height: 1.45;
word-break: break-word;
}
.user .bubble {
background: #0284c7;
color: #ffffff;
border-bottom-right-radius: 4px;
}
.bot .bubble {
background: #1e293b;
color: #f1f5f9;
border: 1px solid #334155;
border-bottom-left-radius: 4px;
}
.svg-preview {
margin-top: 8px;
background: #090d16;
border: 1px solid #334155;
border-radius: 12px;
padding: 12px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
overflow: hidden;
}
.svg-preview svg, .svg-preview img {
max-width: 100%;
height: auto;
display: block;
}
.code-toggle {
background: transparent;
border: none;
color: #38bdf8;
font-size: 0.75rem;
margin-top: 6px;
cursor: pointer;
text-align: left;
padding: 2px 0;
}
.raw-code {
display: none;
background: #020617;
color: #38bdf8;
font-family: ui-monospace, monospace;
font-size: 0.75rem;
padding: 10px;
border-radius: 8px;
margin-top: 6px;
white-space: pre-wrap;
overflow-x: auto;
border: 1px solid #1e293b;
}
.input-area {
background: #1e293b;
padding: 12px 16px;
border-top: 1px solid #334155;
display: flex;
gap: 8px;
align-items: center;
}
textarea {
flex: 1;
background: #0f172a;
color: #f8fafc;
border: 1px solid #334155;
border-radius: 20px;
padding: 10px 16px;
font-family: inherit;
font-size: 0.95rem;
resize: none;
height: 42px;
max-height: 120px;
outline: none;
-webkit-appearance: none;
}
textarea:focus {
border-color: #38bdf8;
}
.send-btn {
background: #0284c7;
color: #fff;
border: none;
width: 42px;
height: 42px;
border-radius: 50%;
font-weight: bold;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
flex-shrink: 0;
}
.send-btn:active {
background: #0369a1;
}
</style>
</head>
<body>
<header>
<h1>AI Flare Mobile</h1>
<span>Chat + Render</span>
</header>
<div class="chat-container" id="chat">
<div class="message bot">
<div class="bubble">
Hello! I am your AI assistant. Ask me to generate an SVG illustration or paste any SVG code directly here to view it rendered in real-time.
</div>
</div>
</div>
<div class="input-area">
<textarea id="userInput" placeholder="Type a message or paste SVG code..." rows="1" onkeydown="handleKey(event)"></textarea>
<button class="send-btn" onclick="sendMessage()">➤</button>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('userInput');
function handleKey(e) {
if (e.key === 'Enter' && !e.shiftKey) {
e.preventDefault();
sendMessage();
}
}
function sendMessage() {
const text = input.value.trim();
if (!text) return;
// Add User Message
appendMessage('user', text);
input.value = '';
// Auto-respond / Parse AI response
setTimeout(() => {
processAIResponse(text);
}, 500);
}
function appendMessage(sender, content) {
const msgDiv = document.createElement('div');
msgDiv.className = ⁠message ${sender}⁠;
const bubble = document.createElement('div');
bubble.className = 'bubble';
// Check for raw <svg>...</svg>
const svgMatch = content.match(/<svg[\s\S]*?</svg>/i);
// Check for <img src="data:image/svg+xml..."/>
const imgMatch = content.match(/<img[^>]+src="'["']/i);
if (svgMatch || imgMatch) {
// Plain text part without SVG
let cleanText = content
.replace(/<svg[\s\S]*?</svg>/gi, '')
.replace(/<img[^>]+>/gi, '')
.trim();
bubble.textContent = cleanText || (sender === 'bot' ? 'Here is your rendered image:' : '');
msgDiv.appendChild(bubble);
// Rendered Container
const preview = document.createElement('div');
preview.className = 'svg-preview';
if (svgMatch) {
preview.innerHTML = svgMatch[0];
} else if (imgMatch) {
preview.innerHTML = ⁠<img src="${imgMatch[1]}" alt="Rendered SVG" />⁠;
}
msgDiv.appendChild(preview);
// Show code toggle
if (svgMatch) {
const toggleBtn = document.createElement('button');
toggleBtn.className = 'code-toggle';
toggleBtn.textContent = '{ } Toggle SVG Code';
const rawCode = document.createElement('div');
rawCode.className = 'raw-code';
rawCode.textContent = svgMatch[0];
toggleBtn.onclick = () => {
rawCode.style.display = rawCode.style.display === 'block' ? 'none' : 'block';
};
msgDiv.appendChild(toggleBtn);
msgDiv.appendChild(rawCode);
}
} else {
bubble.textContent = content;
msgDiv.appendChild(bubble);
}
chat.appendChild(msgDiv);
chat.scrollTop = chat.scrollHeight;
}
function processAIResponse(userText) {
const lower = userText.toLowerCase();
// Demo auto-response if user asks for a tree or SVG sample
if (lower.includes('tree') || lower.includes('svg') || userText.includes('<svg')) {
if (userText.includes('<svg')) {
// User pasted raw SVG code
appendMessage('bot', 'I detected SVG code in your message and rendered it above! Here is another sample for you:\n' + getSampleTreeSVG());
} else {
appendMessage('bot', 'Here is the rendered SVG vector illustration you requested:\n' + getSampleTreeSVG());
}
} else {
appendMessage('bot', ⁠I received your message: "${userText}". Try asking me to "draw a tree" or paste any raw <svg> code!⁠);
}
}
function getSampleTreeSVG() {
return ⁠<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 512 512"> <rect width="512" height="512" fill="#0f172a" rx="16"/> <circle cx="430" cy="80" r="42" fill="#ffd95a"/> <rect y="410" width="512" height="102" fill="#1e293b"/> <path d="M225 430 L238 275 L274 275 L291 430 Z" fill="#795038"/> <circle cx="256" cy="190" r="100" fill="#3e9b50"/> <circle cx="180" cy="225" r="70" fill="#49a95b"/> <circle cx="330" cy="220" r="76" fill="#368c47"/> </svg>⁠;
}
</script>
</body>
</html>
